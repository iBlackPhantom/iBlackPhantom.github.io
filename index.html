/* fumée de l'ouverture */
function fumeeSur(c, o) {
  if (!c || !c.getContext) return null;
  const ctx = c.getContext('2d');
  const calme = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, raf = 0, vu = true, fini = false, dernier = 0;
  const parts = [];
  const taille = () => {
    const dpr = Math.min(o.dpr || 2, window.devicePixelRatio || 1);
    w = c.clientWidth; h = c.clientHeight;
    c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const nouvelle = debut => {
    const r = o.r[0] + Math.random() * (o.r[1] - o.r[0]);
    return { x: Math.random() * w, y: debut ? Math.random() * h : h + r, r, v: o.v[0] + Math.random() * (o.v[1] - o.v[0]), ph: Math.random() * 6.28, a: o.a[0] + Math.random() * (o.a[1] - o.a[0]) };
  };
  const dessiner = () => {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (!calme) { p.y -= p.v; p.ph += 0.004; }
      const x = p.x + Math.sin(p.ph) * 36;
      const t = Math.max(0, Math.min(1, (h + p.r - p.y) / (h + 2 * p.r)));
      const a = p.a * Math.sin(Math.PI * t);
      const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r);
      g.addColorStop(0, `rgba(226,229,236,${a.toFixed(3)})`);
      g.addColorStop(1, 'rgba(226,229,236,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.2832); ctx.fill();
      if (p.y < -p.r) Object.assign(p, nouvelle(false));
    }
  };
  const pas = 1000 / (o.ips || 60);
  const boucle = t => {
    if (fini) return;
    if (!dernier || t - dernier >= pas - 2) { dernier = t; dessiner(); }
    raf = vu && !document.hidden ? requestAnimationFrame(boucle) : 0;
  };
  taille();
  for (let i = 0; i < o.n; i++) parts.push(nouvelle(true));
  dessiner();
  if (calme) return () => {};
  let io = null;
  if (o.observer && 'IntersectionObserver' in window) {
    io = new IntersectionObserver(es => { vu = es[0].isIntersecting; if (vu && !raf) raf = requestAnimationFrame(boucle); });
    io.observe(c);
  }
  const reprise = () => { if (!document.hidden && vu && !raf) raf = requestAnimationFrame(boucle); };
  document.addEventListener('visibilitychange', reprise);
  window.addEventListener('resize', taille);
  raf = requestAnimationFrame(boucle);
  return () => { fini = true; cancelAnimationFrame(raf); if (io) io.disconnect(); document.removeEventListener('visibilitychange', reprise); window.removeEventListener('resize', taille); ctx.clearRect(0, 0, w, h); };
}
function demarrerFumee() {
  if (S.fumeeStop) { S.fumeeStop(); S.fumeeStop = null; }
  // emblème en cuir absent ou illisible : on revient au logo intégré
  const em = document.querySelector('.embleme.cuir');
  if (em) {

  }

/* sélection */
function nettoyerPanier() {
  for (const k of Object.keys(S.panier)) {
    const [id, s] = k.split('|');
    const p = trouver(id) || pieceCmd(id);
    if (!p || !p.visible || prixDe(p, s) == null) delete S.panier[k];
  }
  ST.parfums.forEach(p => {
    if (p.stock != null && mlPanier(p.id) > p.stock) Object.keys(S.panier).filter(k => k.startsWith(p.id + '|')).forEach(k => delete S.panier[k]);
  });
}
function contenuPanier() {
  const lignes = [];
  let total = 0, n = 0;
  for (const k of Object.keys(S.panier)) {
    const [id, s] = k.split('|');
    const p = trouver(id) || pieceCmd(id);
    if (!p) continue;
    const prix = prixDe(p, s);
    if (prix == null) continue;
    const q = S.panier[k];
    lignes.push({ k, p, s: Number(s), q, prix, somme: prix * q, cmd: !!p.cmd });
    total += prix * q; n += q;
  }
  lignes.sort((a, b) => (a.cmd - b.cmd) || a.p.nom.localeCompare(b.p.nom, 'fr') || a.s - b.s);
  const brut = total, remises = appliquerOffres(lignes);
  lignes.forEach(l => { if (l.offre) l.sommeMsg = l.sommeOffre; });
  remises.forEach(r => { total = arrondi(total - r.remise); });
  const acompte = arrondi(lignes.filter(l => l.cmd).reduce((t, l) => t + acompteDe(l.somme), 0));
  return { lignes, total, n, brut, remises, acompte };
}
/* offres d'ensemble sur des lignes { p, s (taille), q (quantité), prix (unitaire) } : quand toutes les pièces d'une offre
   sont là à leur taille d'offre, chacune reçoit l.offre et l.sommeOffre (sa part du prix d'ensemble, en proportion de son prix).
   Renvoie les remises { o, k (nombre d'ensembles), remise }. */
function appliquerOffres(lignes) {
  const remises = [];
  for (const o of ST.boutique.offres || []) {
    const ls = o.ids.map(id => lignes.find(l => l.p && l.p.id === id && !l.offre && l.prix != null && l.s === tailleOffre(l.p)));
    if (ls.some(l => !l)) continue;
    const k = Math.min(...ls.map(l => l.q)), normal = ls.reduce((t, l) => t + l.prix, 0);
    if (!(k > 0) || !(normal > o.prix)) continue;
    let reste = o.prix;
    ls.forEach((l, i) => { const part = i === ls.length - 1 ? reste : arrondi(l.prix * o.prix / normal); reste = arrondi(reste - part); l.offre = o; l.sommeOffre = arrondi(part * k + l.prix * (l.q - k)); });
    remises.push({ o, k, remise: arrondi((normal - o.prix) * k) });
  }
  return remises;
}
/* ---------- offres groupées ---------- */
const tailleOffre = p => tailles(p)[0];
const piecesOffre = o => o.ids.map(trouver);

/* proposée tant que chaque pièce est en vente et que le prix d'ensemble est bien plus doux */
const offreDispo = o => piecesOffre(o).every(p => p && vendable(p) && tailleOffre(p) != null) && prixNormalOffre(o) > o.prix;
const offresDispo = () => (ST.boutique.offres || []).filter(offreDispo);
const nomsOffre = o => piecesOffre(o).map(p => p.nom).join(' + ');
function ajouterOffre(o) {
  let ajout = 0;
  for (const p of piecesOffre(o)) {
    const sz = tailleOffre(p), k = p.id + '|' + sz;
    if (S.panier[k]) continue;
    if (!dispo(p, sz)) return { erreur: `${p.nom} n'est plus disponible.` };
    S.panier[k] = 1; ajout++;

}
function livrable(c) {
  const B = ST.boutique;

  if (!(B.livraisonMin > 0) && !(B.livraisonNb > 0)) return true;

  const t = parts.join(', ');

/* ouverture en zoom : la photo de la vignette grandit jusqu'à la fiche (iPhone à jour ; sinon ouverture normale) */
const zoomPossible = () => typeof document.startViewTransition === 'function' && !sansMouvement();

  src.style.viewTransitionName = 'bp-flacon';

  t.finished.then(fin, fin);

/* bords de l'image sombres en moyenne : photo sur fond noir */
function fondSombre(img) {
  try {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let t = 0, n = 0;
    for (let i = 0; i < 32; i++) for (const [px, py] of [[i, 0], [i, 31], [0, i], [31, i]]) { const k = (py * 32 + px) * 4; t += d[k] * .2126 + d[k + 1] * .7152 + d[k + 2] * .0722; n++; }
    return t / n < 70;
  } catch (e) { return false; }
}
function traiterImage(fichier) {
  return new Promise((res, rej) => {
    if (!fichier || !/^image\//.test(fichier.type || 'image/')) { rej(new Error('type')); return; }
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      try {
        const W = 640, H = 800, marge = 0.05;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';
        if (fondSombre(img)) {
          /* photo de studio sur fond sombre : recadrée plein cadre, centrée, le bas conservé */
          const r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.fillStyle = '#000';
          x.fillRect(0, 0, W, H);
          x.drawImage(img, (W - w) / 2, H - h, w, h);
        } else {
          /* flacon détouré sur fond clair : posé au centre du plateau */
          x.fillStyle = '#ECECEA';
          x.fillRect(0, 0, W, H);
          const r = Math.min(W * (1 - 2 * marge) / img.naturalWidth, H * (1 - 2 * marge) / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.globalCompositeOperation = 'multiply';
          x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        }
        URL.revokeObjectURL(url);

function enregistrerEditeur() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('e-err');
  const nom = v('e-nom');
  if (!nom) { err.textContent = 'Donne un nom au parfum.'; return; }
  const accords = document.getElementById('e-acc').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)(?:\s+(\d{1,3}))?$/);
    return m[2] ? { n: m[1].trim(), v: Math.min(100, Number(m[2])) } : { n: m[1].trim() };
  });
  const coches = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const annee = v('e-annee');
  const data = {
    maison: v('e-maison'), nom, collection: v('e-coll'), annee: /^\d{4}$/.test(annee) ? Number(annee) : annee, genre: v('e-genre'),
    fragrantica: /^https:\/\//.test(v('e-frag')) ? v('e-frag') : '', accords,
    notes: { tete: liste(v('e-tete')), coeur: liste(v('e-coeur')), fond: liste(v('e-fond')), plat: liste(v('e-plat')) },
    saisons: coches('e-saison'), moment: coches('e-moment'), saisonsVerifiees: document.getElementById('e-verif').checked,
    badge: v('e-badge'), prixFlacon: (nombre(v('e-pf')) > 0 ? arrondi(nombre(v('e-pf'))) : null), mlFlacon: (nombre(v('e-mf')) > 0 ? nombre(v('e-mf')) : null),
    type: ['miniature', 'flacon'].includes(v('e-type')) ? v('e-type') : '', statut: v('e-statut'), famille: v('e-fam'), mention: v('e-mention').slice(0, 160),
    concentration: v('e-conc'), tenue: v('e-tenue'), sillage: v('e-sillage')
  };
  const ct = nombre(v('e-cont'));
  if (data.type === 'miniature') {
    if (!(ct > 0) || ct > 100) { err.textContent = 'Indique la contenance de la miniature en ml, par exemple 7,5.'; return; }
    data.contenance = arrondi(ct);
  } else if (data.type === 'flacon') {
    if (!(ct >= 15) || ct > 1000) { err.textContent = 'Indique la contenance du flacon en ml, par exemple 100.'; return; }
    data.contenance = arrondi(ct);
  } else data.contenance = null;
  const id = document.getElementById('edit').dataset.id;
  if (id) {
    const p = trouver(id);
    /* changement de contenance d'une pièce entière : le prix et le stock suivent */
    if (data.type && data.type === p.type && p.contenance !== data.contenance) {
      const px = prixDe(p, p.contenance), n = pieces(p);
      if (px != null) { delete p.prix[String(p.contenance)]; p.prix[String(data.contenance)] = px; }
      if (n != null) p.stock = arrondi(n * data.contenance);
    }
    Object.assign(p, normaliser({ parfums: [Object.assign({}, p, data)] }).parfums[0]);
  } else {
    const base = (data.type === 'miniature' ? 'mini-' : data.type === 'flacon' ? 'neuf-' : '') + (nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'parfum');
    let nid = base, i = 2;
    while (trouver(nid)) nid = base + '-' + i++;
    ST.parfums.push(normaliser({ parfums: [Object.assign({ id: nid, prix: {}, stock: null, visible: true, photo: '' }, data)] }).parfums[0]);
  }
  fermer(); modifie(); rendre();
  toast(id ? 'Fiche modifiée. Publie pour mettre la carte à jour.' : 'Parfum ajouté. Indique ses prix, puis publie.');
}

function construire() {
  const json = JSON.stringify(ST).replace(/</g, '\\u003c');
  const css = document.getElementById('bp-style').textContent;
  const code = document.getElementById('bp-code').textContent;
  return PREFIX + TETE + '<style id="bp-style">' + css + '</style>' + CORPS
    + '<script type="application/json" id="bp-data">' + json + '<' + '/script>'
    + '<script id="bp-code">' + code + '<' + '/script>' + SUFFIX;
}
function retenirApres(msg) {
  try { sessionStorage.setItem('bp-apres', JSON.stringify({ msg, onglet: S.onglet })); } catch (e) {}
}
function oublierApres() { try { sessionStorage.removeItem('bp-apres'); } catch (e) {} }
async function publier(msgOk, muet) {
  if (S.hote === 'gh') return publierGh(msgOk, muet);
  if (S.publication) return false;
  let art = null;
  try { art = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('artifact') : null; } catch (e) {}
  if (!art) { toast("La publication n'est pas disponible dans cette vue."); return false; }
  S.publication = true; rendreConsole();
  retenirApres(msgOk);
  const html = construire();
  try {
    try { await art.publish(html); }
    catch (e) {
      if (!e || e.code !== 'upstream_error') throw e;
      await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      await art.publish(html);
    }
    return true;
  } catch (e) {
    oublierApres();
    const c = e && e.code;
    if (c === 'conflict') toast('Une version plus récente existe. La page se recharge : refais ta dernière modification.');
    else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) toast("Ce compte ne peut pas publier la carte depuis cette vue.");
    else if (c === 'too_large') toast('La page est trop lourde. Retire une ou deux photos, puis réessaie.');
    else if (c === 'rate_limited') toast("Trop de publications d'affilée. Attends un peu, puis réessaie.");
    else toast("La publication n'a pas abouti. Réessaie dans un instant.");
    return false;
  } finally {
    S.publication = false; rendreConsole();
  }
}

/* ---------- la vente : un client, un ou plusieurs parfums ---------- */
/* On touche chaque parfum pris par le client, puis on vérifie la vente (taille, quantité, prix) et on enregistre tout d'un coup.
   Les offres d'ensemble (le duo…) s'appliquent toutes seules dès que leurs pièces sont dans la vente.
   La vente en cours reste gardée sur le téléphone tant qu'elle n'est pas enregistrée, même si la feuille se ferme. */
const CLE_GROUPE = 'bp-ventes-attente';
function groupe() {
  if (!S.groupe) {
    let g = null;
    try { g = JSON.parse(lire(CLE_GROUPE) || 'null'); } catch (e) {}
    /* ancien format : une liste de ventes en attente, chacune avec son prix déjà fixé */
    const ancien = Array.isArray(g);
    const ls = ancien ? g : g && Array.isArray(g.lignes) ? g.lignes : [];
    S.groupe = ls.filter(l => l && trouver(l.id) && Number(l.taille) > 0 && Number(l.qte) >= 1)
      .map(l => ({ id: l.id, taille: Number(l.taille), qte: Math.floor(Number(l.qte)), prix: typeof l.prix === 'number' ? l.prix : null, manuel: ancien || !!l.manuel }));
    const info = (ancien ? g[0] : g) || {};
    S.venteInfo = { client: String(info.client || '').slice(0, 80), date: /^\d{4}-\d{2}-\d{2}$/.test(info.date || '') ? info.date : '' };
  }
  return S.groupe;
}
function sauverGroupe(leger) {
  const G = groupe(), I = S.venteInfo;
  try { if (G.length) localStorage.setItem(CLE_GROUPE, JSON.stringify({ lignes: G, client: I.client, date: I.date })); else localStorage.removeItem(CLE_GROUPE); } catch (e) {}
  const f = document.querySelector('.fab');
  if (f) f.innerHTML = typo(contenuFab());
  if (!leger) rendreAccueil();
}
function viderVente() { S.groupe = []; S.venteInfo = { client: '', date: '' }; sauverGroupe(); }
const ligneVente = () => S.vs ? groupe()[S.vs.i] : null;
const nPiecesVente = () => groupe().reduce((t, l) => t + l.qte, 0);
const nParfums = n => `${n} ${n > 1 ? 'parfums' : 'parfum'}`;
/* ml et flacons vides déjà pris par les autres lignes de la vente (sauf la ligne d'indice « sauf ») */
const dejaGroupe = (id, sauf) => groupe().filter((l, i) => i !== sauf && l.id === id).reduce((t, l) => t + l.taille * l.qte, 0);
const fiolesGroupe = (s, sauf) => groupe().filter((l, i) => i !== sauf && l.taille === s && trouver(l.id) && !estMini(trouver(l.id))).reduce((t, l) => t + l.qte, 0);
const nVentes = n => `${n} ${n > 1 ? 'ventes' : 'vente'}`;
const contenuFab = () => { const n = nPiecesVente(); return `${ICV.plus}<span class="vh">Nouvelle vente</span>${n ? `<span class="fab-nb" aria-label="${nParfums(n)} dans la vente en cours">${n}</span>` : ''}`; };
const texteTout = (n, total) => `Enregistrer ${n > 1 ? `les ${n} ventes` : 'la vente'}${total > 0 ? ' · ' + eur(total) : ''}`;
/* prix de chaque ligne : la carte, sa part d'une offre d'ensemble quand toutes les pièces de l'offre sont dans la vente, ou le prix tapé */
function prixVente() {
  const ls = groupe().map(l => { const p = trouver(l.id); return { l, p, s: l.taille, q: l.qte, prix: prixDe(p, l.taille) }; });
  const remises = appliquerOffres(ls);
  const lignes = ls.map(x => {
    const carte = x.prix == null ? null : arrondi(x.prix * x.q);
    const auto = x.offre ? x.sommeOffre : carte;

/* enregistre les nombres et les prix saisis */

    if (n != null) {

  rendreFlacons();
}

/* proposer ou retirer un format sur la carte (public : il faut publier) */
function basculerFormat(el) {

function margeVente(v) {
  if (typeof v.cout === 'number') return arrondi(v.prix - v.cout);
  const cu = coutUnitaire(v.parfumId);
  if (cu == null) return null;
  return v.prix - (cu * v.ml + (venteEntiere(v) ? 0 : coutFiole(v.taille) * (v.qte || 1)));
}

}
/* le journal montre les 150 dernières ventes (jusqu'au bout de leur dernier jour) : avec des milliers de ventes, l'onglet reste rapide */
function ventesVisibles() {
  const lim = S.journalLim || 150;
  if (S.ventes.length <= lim) return S.ventes;
  const d = S.ventes[lim - 1].date;
  let n = lim;
  while (n < S.ventes.length && S.ventes[n].date === d) n++;
  return S.ventes.slice(0, n);
}
/* le journal, jour par jour, avec le total de chaque jour */
function nomJour(iso) {
  const auj = aujourdhui();
  if (iso === auj) return "Aujourd'hui";
  const h = new Date(auj + 'T12:00:00'); h.setDate(h.getDate() - 1);
  if (iso === new Date(h.getTime() - h.getTimezoneOffset() * 60000).toISOString().slice(0, 10)) return 'Hier';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso || 'Sans date';
  const t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function journalParJour(ventes) {
  let h = '', jour = null;
  ventes.forEach((v, i) => {
    if (v.date !== jour) {
      jour = v.date;
      const tot = ventes.filter(x => x.date === jour).reduce((t, x) => t + (x.prix || 0), 0);
      h += `<li class="j-jour"><span>${esc(nomJour(jour))}</span><span>${eur(tot)}</span></li>`;
    }
    h += ligneJournal(v);
  });
  return h;
}
function ligneJournal(v) {
  const m = margeVente(v);
  const conf = S.confirmVente === v.id;
  const rendStock = v.stockSuivi && estDeduite(v) && trouver(v.parfumId) && trouver(v.parfumId).stock != null;
  const p = pieceVente(v.parfumId);
  return `<li class="j-vente${S.venteNeuve && S.venteNeuve.includes(v.id) ? ' neuve' : ''}">
    <span class="plaque">${p ? plaqueContenu(p) : ''}</span>
    <div><span class="quoi">${esc(v.nom)}, ${esc(tailleVente(v))} × ${v.qte}</span><br><span class="qui">${esc(dateCourte(v.date))}${v.client ? ', ' + esc(v.client) : ''}</span></div>
    <div class="prix">${eur(v.prix)}${m != null ? `<span class="marge">marge ${eur(m, true)}</span>` : ''}</div>
    ${conf ? '' : `<button type="button" class="suppr" data-act="suppr-vente" data-id="${esc(v.id)}" aria-label="Supprimer la vente de ${esc(v.nom)}" title="Supprimer">${ICV.corbeille}</button>`}
    ${conf ? `<div class="confirm"><span>Supprimer cette vente${rendStock ? ` et remettre ${qteVente(v)} en stock` : ''} ?</span><button type="button" class="btn petit danger" data-act="suppr-vente-ok" data-id="${esc(v.id)}">Oui, supprimer</button><button type="button" class="btn petit discret" data-act="suppr-vente-non">Non</button></div>` : ''}
  </li>`;

async function supprimerVente(id) {

async function deduireEnAttente() {

/* ---------- sur commande, côté vendeur ----------
   commande.json, dans le dépôt privé : { seuil, achats: { id: prix d'achat }, reservations: [...], commandes: [...] }.
   Une réservation compte dans la commande dès que son acompte est reçu ; à 500 € d'achat, tu passes la commande.
   Seul le pourcentage de remplissage part sur le site, jamais les prix d'achat ni les clients. */
const SEUIL_CMD = 500;
function normCmdPrive(x) {
  const o = x && typeof x === 'object' ? x : {};
  return {
    seuil: Number(o.seuil) > 0 ? Number(o.seuil) : SEUIL_CMD,
    achats: o.achats && typeof o.achats === 'object' ? o.achats : {},
    reservations: Array.isArray(o.reservations) ? o.reservations.filter(r => r && r.id && r.produit) : [],
    commandes: Array.isArray(o.commandes) ? o.commandes.filter(c => c && c.id) : []
  };
}
const cmdPrive = () => S.cmdP || (S.cmdP = normCmdPrive(null));
const copieCmd = () => JSON.parse(JSON.stringify(cmdPrive()));
const produitsCmd = () => (ST.commande && ST.commande.produits) || [];
const achatCmd = id => { const a = cmdPrive().achats[id]; return typeof a === 'number' ? a : null; };
const resEnCours = () => cmdPrive().reservations.filter(r => !r.commande);
const resRecues = () => resEnCours().filter(r => r.recu);
const resAttente = () => resEnCours().filter(r => !r.recu);
const aRemettre = () => cmdPrive().reservations.filter(r => r.commande && !r.remis);
const montantCmd = l => arrondi(l.reduce((t, r) => t + (achatCmd(r.produit) || 0), 0));
const rempliCmd = () => Math.min(100, Math.round(montantCmd(resRecues()) / cmdPrive().seuil * 100));
const joursDepuis = t => Math.floor((Date.now() - (t || 0)) / 864e5);
/* acompte reçu depuis plus de 30 jours, commande toujours pas partie : on le rend */
const enRetard = r => r.recu && !r.commande && joursDepuis(r.recuLe || r.creeLe) >= ((ST.commande && ST.commande.jours) || 30);
const aRembourser = () => resRecues().filter(enRetard);
const nomRes = r => r.nom + (r.client ? ' (' + r.client + ')' : '');
const nomsRes = l => l.length <= 2 ? l.map(nomRes).join(', ') : l.slice(0, 2).map(nomRes).join(', ') + ` et ${l.length - 2} autres`;
/* une réservation de plusieurs flacons : chaque flacon garde sa ligne, reliées par le même « groupe » */
const cleGroupe = r => r.groupe || r.id;
function groupesRes(l) {
  const m = new Map();
  l.forEach(r => { const k = cleGroupe(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.values()];
}
const nomGroupe = g => g.length > 1 ? `${g[0].client || 'Sans nom'} (${g.length} flacons)` : nomRes(g[0]);
const nomsGroupes = gs => gs.length <= 2 ? gs.map(nomGroupe).join(', ') : gs.slice(0, 2).map(nomGroupe).join(', ') + ` et ${gs.length - 2} autres`;
const sommeDe = (l, f) => arrondi(l.reduce((t, x) => t + (f(x) || 0), 0));
const pieceRes = r => pieceCmd(r.produit, true) || { id: r.produit, nom: r.nom, maison: r.maison || '', type: 'commande', cmd: true, contenance: r.ml, prix: {}, stock: null, visible: true, statut: '', photo: '', notes: {}, accords: [], saisons: [], moment: [] };
const pieceVente = id => trouver(id) || pieceCmd(id, true);
const virgule = x => String(arrondi(x)).replace('.', ',');
async function ecrireCmd(C, message) {
  S.gh.shaCmd = await ecrireFichier(S.gh.prive, 'commande.json', texteB64(JSON.stringify(C, null, 1)), S.gh.shaCmd, message);
  S.cmdP = C;
}
/* après chaque changement : l'écran, puis la jauge du site si le pourcentage a bougé */
async function apresCmd(msg) {
  majPanneauDb();

  if (ST.commande && produitsCmd().length && ST.commande.remplie !== r) {
    ST.commande.remplie = r; S.modifs++; rendreConsole();
    await publier(`${msg} La jauge du site passe à ${r} %.`);

}
/* une vente annulée ou supprimée : le flacon redevient à remettre */
async function oublierRemis(ids) {

  const C = copieCmd();
  C.reservations.forEach(r => { if (ids.includes(r.remis)) r.remis = null; });

}

/* coûts : tableau de bord de l'investissement, lots, achats à l'unité */
function valeurStock() {
  let v = 0, comptes = 0, ignores = 0;
  ST.parfums.forEach(p => {
    const o = tailles(p);
    if (p.stock == null || !o.length) { if (p.stock !== 0) ignores++; return; }
    if (estMini(p)) v += pieces(p) * prixDe(p, p.contenance);
    else v += p.stock * Math.min(...o.map(s => prixDe(p, s) / s));
    comptes++;
  });
  return { v, comptes, ignores };
}
function bilanInvestissement(C) {
  const somme = (l, f) => l.reduce((t, x) => t + (f(x) || 0), 0);
  const lots = Array.isArray(C.lots) ? C.lots : [];
  const unites = Object.values(C.parfums || {}).filter(c => c && c.achat > 0);
  const investi = somme(lots, L => L.montant) + somme(unites, c => c.achat);
  const encaisse = somme(S.ventes, v => v.prix);
  return { investi, encaisse, resultat: encaisse - investi, part: investi > 0 ? Math.min(1, encaisse / investi) : 0, nbLots: lots.length, nbUnites: unites.length };
}

function lireLot() {
  const v = id => document.getElementById(id).value.trim();

  document.querySelectorAll('#lot-form .lot-ligne').forEach(l => {

    const p = trouver(l.dataset.id); if (!p) return;
    const brut = l.querySelector('.l-ml').value.trim();
    const n = brut === '' ? (estMini(p) ? 1 : 100) : nombre(brut);
    if (!(n > 0) || (estMini(p) && !Number.isInteger(n))) { invalide = p.nom; return; }
    parfums.push({ id: p.id, ml: arrondi(estMini(p) ? n * p.contenance : n) });
  });

/* API GitHub : les erreurs remontent sous la forme { statut, limite } */
async function gh(methode, chemin, corps, accept) {
  let r;
  try {
    r = await fetch(GH_API + chemin, {
      method: methode, cache: 'no-store',
      headers: Object.assign({ Accept: accept || 'application/vnd.github+json', Authorization: 'Bearer ' + S.gh.jeton }, corps ? { 'Content-Type': 'application/json' } : {}),
      body: corps ? JSON.stringify(corps) : undefined
    });
  } catch (e) { throw { statut: 0 }; }
  if (!r.ok) throw { statut: r.status, limite: r.headers.get('x-ratelimit-remaining') === '0' };
  return accept ? r.text() : r.json().catch(() => null);
}
const enc = encodeURIComponent;
const cheminDepot = depot => `/repos/${enc(S.gh.proprio)}/${enc(depot)}`;
const cheminFichier = (depot, f) => cheminDepot(depot) + '/contents/' + f.split('/').map(enc).join('/');
async function lireFichier(depot, f, sansTexte) {
  let d;
  try { d = await gh('GET', cheminFichier(depot, f)); }
  catch (e) { if (e.statut === 404) return null; throw e; }
  if (!d || Array.isArray(d) || !d.sha) throw { statut: -1 };
  if (sansTexte) return { sha: d.sha, texte: null };
  /* au-delà de 1 Mo, l'API ne renvoie pas le contenu : on le demande brut */
  const texte = d.encoding === 'base64' && d.content ? b64Texte(d.content) : await gh('GET', cheminFichier(depot, f), null, 'application/vnd.github.raw+json');
  return { sha: d.sha, texte };
}
async function ecrireFichier(depot, f, contenuB64, sha, message) {
  const d = await gh('PUT', cheminFichier(depot, f), Object.assign({ message, content: contenuB64 }, sha ? { sha } : {}));
  if (!d || !d.content || !d.content.sha) throw { statut: -1 };

function messageGh(e, depot) {
  const s = e && e.statut;
  if (s === 0) return 'Pas de connexion à GitHub. Vérifie ton réseau, puis réessaie.';
  if (s === 401) return "Ton jeton GitHub n'est plus valide (expiré ou supprimé). Crée-en un nouveau sur GitHub, puis reconnecte-toi avec « Nouveau jeton ».";
  if (s === 403 && e.limite) return 'GitHub limite les requêtes pour le moment. Réessaie dans quelques minutes.';
  if (s === 403) return `Ton jeton n'a pas le droit de modifier ${depot || 'ce dépôt'}. Dans ses réglages GitHub, coche ce dépôt et mets « Contents » sur « Read and write ».`;
  if (s === 404) return `Le dépôt ${depot || ''} est introuvable avec ce jeton. Vérifie qu'il existe et qu'il est coché dans le jeton.`;
  if (s === 409 || s === 422) return 'Tes données ont été modifiées entre-temps, depuis un autre appareil ou un autre onglet. Recharge la page, puis refais ta dernière action.';
  return "GitHub n'a pas répondu comme prévu. Réessaie dans un instant.";
}

/* retrouve le jeton dans le texte collé, même entouré d'autres caractères ou avec une majuscule ajoutée au début */

  if (!m) return '';

  if (S.cmdP) cmdPrive().reservations.forEach(r => { const c = obtenir(r.client); if (c) c.resas.push(r); });
  G.attente.forEach(a => { const c = obtenir(a.client); if (c) c.attente.push(a); });

function retourG() {

  rendreG();
}

async function enregistrerClient() {
  const v = id => (document.getElementById(id) || {}).value || '';
  const err = document.getElementById('ce-err');
  const nom = v('ce-nom').trim();
  if (!nom) { err.textContent = 'Indique au moins un nom.'; return; }
  const c = S.gs.id ? clientDe(S.gs.id) : null;
  const alias = v('ce-alias').split(',').map(x => x.trim()).filter(Boolean);
  if (c && cleNom(c.nom) !== cleNom(nom) && !alias.some(a => cleNom(a) === cleNom(c.nom))) alias.push(c.nom);
  const autre = clientsTous().find(x => x.fiche && (!c || x.id !== c.id) && [x.nom, ...x.fiche.alias].some(n => cleNom(n) === cleNom(nom)));
  if (autre) { err.textContent = `« ${autre.nom} » existe déjà. Pour regrouper les deux, ajoute ce nom dans « Autres noms » de sa fiche.`; return; }
  const fiche = { nom, alias: [...new Set(alias.filter(a => cleNom(a) !== cleNom(nom)))], snap: v('ce-snap').trim(), insta: v('ce-insta').trim(), tel: v('ce-tel').trim(), ville: v('ce-ville').trim(), notes: v('ce-notes').trim() };
  /* le changement peut être rejoué sur une version plus récente de gestion.json : il ne doit rien dépendre d'un premier passage */
  const neuf = !(c && c.fiche), id = neuf ? nouvelId('c') : c.fiche.id, creeLe = Date.now();
  const ok = await majGest(G => {
    if (neuf) { if (!G.clients.some(x => x.id === id)) G.clients.push(Object.assign({ id, creeLe }, fiche)); return; }
    const f = G.clients.find(x => x.id === id);
    if (!f) return false;
    Object.assign(f, fiche);
  }, `Client : ${nom}`, neuf ? 'Fiche client créée' : 'Fiche modifiée', nom);
  if (ok) { S.gs = { type: 'client', id, pile: [] }; rendreG(); }
}

const PERIODES = [['7', '7 jours'], ['30', '30 jours'], ['mois', 'Ce mois'], ['trim', 'Trimestre'], ['annee', 'Année'], ['tout', 'Tout']];
function bornesPeriode(k) {
  const auj = aujourdhui();
  if (k === '7') return [jourDecale(auj, -6), auj, 'jour'];
  if (k === '30') return [jourDecale(auj, -29), auj, 'jour'];
  if (k === 'mois') return [auj.slice(0, 8) + '01', auj, 'jour'];
  if (k === 'trim') { const m = Number(auj.slice(5, 7)), d = Math.floor((m - 1) / 3) * 3 + 1; return [`${auj.slice(0, 4)}-${String(d).padStart(2, '0')}-01`, auj, 'semaine']; }
  if (k === 'annee') return [auj.slice(0, 4) + '-01-01', auj, 'mois'];
  const d0 = S.ventes.map(v => v.date).filter(Boolean).sort()[0] || auj;
  return [d0, auj, joursEntre(d0, auj) > 120 ? 'mois' : joursEntre(d0, auj) > 31 ? 'semaine' : 'jour'];
}
function seriePeriode(ventes, a, b, pas) {
  const cases = [];
  if (pas === 'jour') for (let d = a; d <= b; d = jourDecale(d, 1)) cases.push({ k: d, lib: String(Number(d.slice(8))), de: d, a: d });
  else if (pas === 'semaine') { let d = a; while (d <= b) { const f = jourDecale(d, 6); cases.push({ k: d, lib: dateCourte(d).replace(/\.$/, ''), de: d, a: f }); d = jourDecale(d, 7); } }
  else { let d = a.slice(0, 7); while (d <= b.slice(0, 7)) { cases.push({ k: d, lib: moisDe(d + '-01').replace(/\.?\s?\d+$/, ''), de: d + '-01', a: d + '-31' }); const [y, m] = d.split('-').map(Number); d = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`; } }
  cases.forEach(c => { const l = ventes.filter(v => v.date >= c.de && v.date <= c.a); c.ca = somme(l, v => v.prix); c.n = l.length; });
  return cases;
}
function graphe(cases) {
  const max = Math.max(1, ...cases.map(c => c.ca)), n = cases.length, W = 320, H = 120, g = Math.max(1, Math.min(6, 120 / n)), bw = (W - g * (n - 1)) / n;
  /* une étiquette toutes les « pas » barres, la dernière toujours, sans qu'elles se touchent */
  const pas = n <= 8 ? 1 : Math.ceil(n / 7);
  const etiq = cases.map((c, i) => (i === n - 1 || (i % pas === 0 && n - 1 - i >= pas * 0.7)) ? `<text x="${(i * (bw + g) + bw / 2).toFixed(1)}" y="${H + 14}" text-anchor="middle">${esc(c.lib)}</text>` : '').join('');
  return `<svg class="g-graphe" viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="Chiffre d'affaires sur la période">${cases.map((c, i) => { const h = c.ca ? Math.max(2, (c.ca / max) * H) : 0; return `<rect x="${(i * (bw + g)).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, bw / 3).toFixed(1)}"${i === n - 1 ? ' class="dernier"' : ''}><title>${esc(c.lib)} : ${esc(eur(c.ca) || '0 €')}</title></rect>`; }).join('')}<line x1="0" y1="${H}" x2="${W}" y2="${H}"/>${etiq}</svg>`;
}

    <div class="g-kpis">

      <div class="g-kpi"><span>Marge</span><b>${avecM.length ? eur(marge) : '–'}</b><small>${avecM.length && avecM.length < V.length ? `sur ${avecM.length} ventes sur ${V.length}` : avecM.length ? `${ca ? Math.round(marge / ca * 100) : 0} % du chiffre` : 'Ajoute tes achats dans Coûts'}</small></div>
      <div class="g-kpi"><span>Ventes</span><b>${V.length}</b><small>${mlD ? ml(mlD) + ' de décants' : ''}</small></div>
      <div class="g-kpi"><span>Panier moyen</span><b>${visites ? eur(arrondi(ca / visites)) : '–'}</b><small>${pluriel(visites, 'passage')}</small></div>

    <div class="bloc"><h3>Jour après jour</h3>${graphe(seriePeriode(V, a, b, pas))}</div>
    <div class="bloc g-objectif"><div class="bloc-tete"><h3>Objectif du mois</h3><button type="button" class="btn petit discret" data-act="objectif">${obj ? 'Modifier' : 'Fixer'}</button></div>
      ${obj ? `<div class="g-jauge"><span style="width:${Math.min(100, caMois / obj * 100).toFixed(1)}%"></span></div><p class="aide">${eur(caMois) || '0 €'} sur ${eur(obj)} : ${caMois >= obj ? 'objectif atteint, bravo !' : `encore ${eur(arrondi(obj - caMois))} d'ici la fin du mois.`}</p>` : '<p class="aide">Fixe un chiffre d\'affaires à atteindre ce mois-ci : une jauge le suit sur ton Accueil.</p>'}</div>

    <div class="bloc"><div class="bloc-tete"><h3>Chiffre d'affaires par mois</h3><button type="button" class="btn petit discret" data-act="export">Tableur</button></div>

/* =====================================================================================================
   RÉASSORT : date de rupture estimée d'après le rythme des ventes, liste de courses
   ===================================================================================================== */
const JOURS_RYTHME = 60;
function rythmes() {
  const auj = aujourdhui(), d0 = jourDecale(auj, -(JOURS_RYTHME - 1));
  return ST.parfums.filter(p => p.visible && p.stock != null).map(p => {
    const V = S.ventes.filter(v => v.parfumId === p.id && v.date >= d0);
    const premier = S.ventes.filter(v => v.parfumId === p.id).map(v => v.date).sort()[0];
    const jours = Math.max(14, Math.min(JOURS_RYTHME, premier ? joursEntre(premier, auj) + 1 : JOURS_RYTHME));
    const parJour = somme(V, v => v.ml) / jours;
    const reste = parJour > 0 ? Math.floor(p.stock / parJour) : null;
    return { p, parJour, reste, vendu: somme(V, v => v.ml), date: reste != null ? jourDecale(auj, reste) : null };
  });
}

    else if (xa && J(xa) !== J(xb)) l.push(`${p.nom} : prix spécial modifié`);
    if (estNouveau(p) !== estNouveau(q)) l.push(`${p.nom} : badge « Nouveau » ${estNouveau(p) ? 'ajouté' : 'retiré'}`);
    if ((p.badge || '') !== (q.badge || '')) l.push(`${p.nom} : ${p.badge ? `pastille « ${p.badge} »` : 'pastille retirée'}`);
    if ((p.statut || '') !== (q.statut || '')) l.push(`${p.nom} : ${p.statut === 'bientot' ? 'bientôt disponible' : p.statut === 'rupture' ? 'marqué en rupture' : 'de nouveau disponible'}`);
    if (p.visible !== q.visible) l.push(`${p.nom} : ${p.visible ? 'de nouveau affiché' : 'masqué'}`);
    if (publi && p.photo !== q.photo) l.push(`${p.nom} : ${p.photo ? 'nouvelle photo' : 'photo retirée'}`);
  });
  B.parfums.forEach(p => { if (!pa.has(p.id)) l.push(publi ? `${p.nom} retiré de la carte` : `${p.nom} : n'existait pas encore (sera retiré)`); });
  const ba = A.boutique, bb = B.boutique;
  if ((ba.vedette || '') !== (bb.vedette || '')) l.push(`Vedette : ${ba.vedette ? ((A.parfums.find(p => p.id === ba.vedette) || {}).nom || ba.vedette) : 'automatique'}`);
  if (J(ba.ordreMaisons) !== J(bb.ordreMaisons)) l.push('Ordre des maisons changé');
  BLOCS_ACCUEIL.forEach(([k, lib]) => { const ma = !!(ba.masquer || {})[k], mb = !!(bb.masquer || {})[k]; if (ma !== mb) l.push(`Bloc « ${lib.replace(/ \(.*\)$/, '')} » ${ma ? 'masqué' : 'affiché'}`); });
  if (J(ba.offres) !== J(bb.offres)) l.push('Duos et lots modifiés');
  Object.entries(NOMS_REGLAGES).forEach(([k, lib]) => { if (J(ba[k]) !== J(bb[k])) l.push(`${lib} modifié${/s$/.test(lib) ? 's' : ''}`); });
  if (J((A.commande || {}).produits) !== J((B.commande || {}).produits)) l.push('Sur commande : flacons modifiés');
  if ((A.commande || {}).ferme !== (B.commande || {}).ferme) l.push(`Précommandes ${(A.commande || {}).ferme ? 'clôturées' : 'rouvertes'}`);
  return l;
}

function messagePublication(avant) {
  let d = [];
  try { d = differences(ST, normaliser(JSON.parse(JSON.stringify(avant))), true, true); } catch (e) {}
  if (!d.length) return 'Mise à jour de la carte';
  const m = d.slice(0, 2).join(' ; ') + (d.length > 2 ? ` (et ${d.length - 2} autre${d.length > 3 ? 's' : ''})` : '');

async function revenirVersion() {

/* feuilles (fiche, panier) : tirer vers le bas depuis le haut pour les ranger, comme sur iPhone */
let tire = null;
document.addEventListener('touchstart', e => {
  tire = null;
  const d = e.target.closest && e.target.closest('dialog.feuille');
  if (!d || !(window.matchMedia && matchMedia('(max-width: 859px)').matches)) return;
  const f = d.querySelector('.fen');
  if (f && f.scrollTop > 0) return;
  const t = e.touches[0];

document.addEventListener('touchmove', e => {
  if (!tire) return;
  const t = e.touches[0], dx = t.clientX - tire.x, dy = t.clientY - tire.y;
  if (!tire.actif) {
    if (Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
    if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) { tire = null; return; }
    tire.actif = true; tire.d.style.transition = 'none'; tire.d.style.animation = 'none';
  }
  tire.dy = Math.max(0, dy);
  tire.d.style.transform = `translateY(${tire.dy}px)`;
  e.preventDefault();
}, { passive: false });
const finTire = () => {
  if (!tire) return;
  const { d, dy, t0, actif } = tire; tire = null;
  if (!actif) return;

/* stock : glisser une ligne vers la gauche montre « Ajuster » et « Vendre », comme dans Mail ou Rappels */
let glisse = null;
const fermerGlisses = sauf => document.querySelectorAll('.ligne-stock.glisse').forEach(d => { if (d !== sauf) d.classList.remove('glisse'); });
document.addEventListener('touchstart', e => {
  const r = e.target.closest && e.target.closest('.ls-resume');
  const d = r && r.closest('.ligne-stock');

}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!glisse || !glisse.larg) return;
  const t = e.touches[0], dx = t.clientX - glisse.x, dy = t.clientY - glisse.y;
  if (!glisse.sens) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    glisse.sens = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    if (glisse.sens === 'h') glisse.d.classList.add('glisse-actif');

  if (glisse.sens !== 'h') return;
  if (e.cancelable) e.preventDefault();
  glisse.dx = dx;
  let x = glisse.base + dx;
  if (x > 0) x = 0;
  if (x < -glisse.larg) x = -glisse.larg + (x + glisse.larg) / 3;
  glisse.c.style.transform = `translateX(${x.toFixed(1)}px)`;
}, { passive: false });
document.addEventListener('touchend', () => {

  g.d.classList.toggle('glisse', g.base + g.dx < -g.larg / 2);
  g.d.dataset.glisseLe = String(Date.now());

/* toucher une ligne ouverte la referme, sans déplier la fiche ; le clic qui suit un glissement est ignoré */

function demarrer(donnees) {
  installerDegrades();
  const d = donnees || {};
  if (d.panier && typeof d.panier === 'object') S.panier = d.panier;
  else chargerSelection();
  if (typeof d.q === 'string') S.q = d.q;

  let apres = null;

  if (apres && apres.onglet) S.ongletApres = apres.onglet;
  { const h0 = ancre(); if (h0 === 'sur-commande' || ficheCmd(h0)) S.vue = 'commande'; }

  if (surClaude()) { initVendeur(); return; }

  if (/[?&]v=\d+/.test(location.search)) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  const porte = () => {
    if (location.hash === '#vendeur') { if (!S.vendeur) ouvrirConnexion(false); return; }

    /* retour arrière depuis l'onglet (bouton, geste ou fiche ouverte) : la carte, là où on l'avait laissée */

    else if (ficheCmd(h) && !ouverte) { if (!enCommande()) changerVue('commande', null, true); if (!etatFen()) majAdresse('#sur-commande'); ouvrirFicheCmd(h); }
  };
  window.addEventListener('hashchange', porte);
  porte();
}

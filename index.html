@media (prefers-reduced-motion:no-preference){.barre:not([hidden]){animation:barre-monte .5s cubic-bezier(.2,.8,.2,1)}}
@keyframes barre-monte{from{transform:translateY(100%)}to{transform:none}}

/* ouverture et fermeture de la fiche en zoom */
::view-transition-group(bp-flacon){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(bp-flacon),::view-transition-new(bp-flacon){height:100%;object-fit:cover}
.vt-fiche::view-transition-old(root),.vt-fiche::view-transition-new(root){animation-duration:.34s}

/* « À découvrir aujourd'hui » : vitrine qui défile */
.ouverture .decouvrir{max-width:46rem}
.vitrine-arc{--cw:clamp(7.4rem,31vw,10.5rem);display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.8rem calc(50% - var(--cw) / 2) 1.1rem;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.vitrine-arc::-webkit-scrollbar{display:none}
.vitrine-arc .decouvrir-p{position:relative;flex:0 0 var(--cw);scroll-snap-align:center;transform:scale(calc(1 - var(--oa,0) * .13));transform-origin:50% 45%}
.vitrine-arc .decouvrir-p .nom,.vitrine-arc .decouvrir-p .prix{opacity:calc(1 - var(--oa,0) * 1.15)}
.vitrine-arc .decouvrir-p .plaque{box-shadow:0 18px 40px rgba(0,0,0,.6)}
@media (min-width:860px){.vitrine-arc{margin:0;--cw:10.5rem}}

/* sceau « Rupture », frappé en relief */
.sceau{position:absolute;z-index:2;top:.4rem;right:.4rem;width:4.5rem;height:4.5rem;transform:rotate(-14deg);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.sceau svg{display:block;width:100%;height:100%;overflow:visible}
.sc-fond{fill:rgba(12,12,14,.84);stroke:rgba(255,255,255,.16);stroke-width:1}
.sc-trait{fill:none;stroke:url(#bp-sceau-metal);stroke-width:1.1;opacity:.8}
.sc-tour{font:600 8.2px var(--f-texte);fill:url(#bp-sceau-metal);text-transform:uppercase}
.sc-mot{font:italic 500 15.5px var(--f-titre);fill:#E7A497}
.sc-bp{font:500 8px var(--f-titre);letter-spacing:2.4px;fill:#C9CCD2}
.bloc-maison.petite .sceau,.decouvrir-p .sceau{width:3.9rem;height:3.9rem}
.sceau.grand{top:auto;bottom:1.1rem;right:1.1rem;width:7.4rem;height:7.4rem}
@media (prefers-reduced-motion:no-preference){.sceau.grand{animation:frappe .65s cubic-bezier(.3,1.4,.5,1) .3s backwards}}
@keyframes frappe{from{transform:rotate(-14deg) scale(1.75);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* reflet sur le cuir du fond : il glisse quand on descend */
.lustre{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.lustre::before{content:"";position:absolute;left:-45vmax;top:-48vmax;width:115vmax;height:72vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.11),rgba(255,255,255,.04) 55%,rgba(255,255,255,0));transform:translate3d(calc(var(--sy,0) * 60vw),calc(var(--sy,0) * 108vh),0) rotate(-24deg);will-change:transform}
@media (prefers-reduced-motion:reduce){.lustre{display:none}}

/* barres d'accords qui se remplissent */
@media (prefers-reduced-motion:no-preference){
  .accords.attend:not(.vu) .jauge span{width:0}
  .accords.vu .jauge span{animation:jauge 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i,0) * .09s) both}
  .accords.attend li{opacity:.35;transition:opacity .5s ease calc(var(--i,0) * .09s)}
  .accords.vu li{opacity:1}
}
@keyframes jauge{from{width:0}}

/* ================= espace vendeur, façon app iPhone =================
   Police du système (San Francisco sur iPhone), grands titres en Bodoni, listes groupées sur fond noir,
   barre d'onglets flottante et bouton « + » rond. Seul l'espace vendeur change : la vitrine garde son style. */
:root{--i-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;--f-bodoni:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;--i-cell:#151517;--i-cell-h:#1F1F22;--i-sep:rgba(255,255,255,.08);--i-champ:rgba(118,118,128,.24)}
body.vue-vendeur::before{background:#000}
.vue-vendeur .page-vendeur,.mode-vendeur .console,.mode-vendeur .fab,.bandeau-vente,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion){--f-titre:var(--i-ui);--f-texte:var(--i-ui);font-family:var(--i-ui);-webkit-font-smoothing:antialiased}
.vue-vendeur .page-vendeur{font-size:16px;line-height:1.35}

/* grand titre, boutons ronds au-dessus */
.vue-vendeur .panneau{gap:1.15rem;padding-top:.5rem}
.vue-vendeur .pv-tete{display:block}
.vue-vendeur .pv-barre{display:flex;justify-content:flex-end;gap:.6rem;min-height:44px;margin-bottom:.15rem}
.vue-vendeur .pv-barre .sortie{order:-1;margin:0 auto 0 0}
.vue-vendeur .pv-tete h2{margin:0;font:700 2.125rem/1.12 var(--f-bodoni);letter-spacing:-.01em;color:var(--platine)}
.vue-vendeur .pv-sous{margin:.15rem 0 0;font-size:.94rem;color:var(--fumee)}
.vue-vendeur .sortie,.vue-vendeur .nav-rond{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--platine)}
.vue-vendeur .sortie svg,.vue-vendeur .nav-rond svg{width:21px;height:21px}

/* raccourcis en pastilles */
.puces-ios{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.puces-ios::-webkit-scrollbar{display:none}
.puce-ios{flex:none;display:inline-flex;align-items:center;gap:.45rem;min-height:40px;padding:0 1rem;border:0;border-radius:999px;background:var(--i-cell-h);color:var(--platine);font:500 .94rem var(--i-ui);white-space:nowrap}
.puce-ios svg{width:18px;height:18px;color:var(--argent)}
.puce-ios:active{background:#2A2A2E}

/* listes groupées */
.groupe-ios{display:grid}
.gi-tete{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2rem;padding:0 .4rem .35rem 1.25rem}
.gi-tete h3{margin:0;font:600 .94rem var(--i-ui);color:var(--fumee)}
.lien-ios{min-height:44px;padding:0 .6rem;border:0;background:none;color:var(--platine);font:600 .94rem var(--i-ui)}
.vue-vendeur .bloc{border:0;border-radius:22px;background:var(--i-cell);padding:1rem}
.vue-vendeur .bloc h3{font:600 1.06rem var(--i-ui)}
.vue-vendeur .faceid-carte{border:0;border-radius:22px;background:var(--i-cell)}

/* la semaine : barres jour par jour, puis le mois */
.semaine{display:grid;border-radius:22px;background:var(--i-cell);overflow:hidden}
.sem-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;padding:.9rem 1rem 0}
.sem-tete small{display:block;font-size:.8rem;color:var(--fumee)}
.sem-tete b{display:block;font:600 1.75rem/1.15 var(--i-ui);letter-spacing:-.01em;color:var(--platine);font-variant-numeric:tabular-nums}
.sem-auj{text-align:right}
.sem-auj b{font-size:1.06rem}
.sem-auj b span{font-weight:400;color:var(--fumee)}
.sem-barres{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;height:116px;padding:.6rem .75rem 0}
.sem-j{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.sem-v{min-height:1em;font-size:.7rem;line-height:1;color:var(--argent);font-variant-numeric:tabular-nums}
.sem-b{width:22px;max-width:72%;border-radius:5px;background:rgba(244,245,247,.36)}
.sem-j.zero .sem-b{border-radius:2px;background:rgba(255,255,255,.12)}
.sem-l{font-size:.7rem;line-height:1;color:var(--fumee)}
.sem-j.auj .sem-b{background:var(--platine)}
.sem-j.auj .sem-v,.sem-j.auj .sem-l{color:var(--platine);font-weight:600}
.sem-ligne{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:50px;margin-left:1rem;padding:.45rem 1rem .45rem 0;border-top:1px solid var(--i-sep);color:var(--platine)}
.sem-barres + .sem-ligne{margin-top:.9rem}
.sem-ligne b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sem-ligne b small{display:block;font-weight:400;font-size:.76rem;color:var(--fumee)}
.sem-ligne b.pos{color:var(--ok)}

/* à faire : lignes à toucher, pastille de couleur selon l'urgence */
.vue-vendeur .taches{border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .tache{display:block;padding:0;border:0}
.tache-b{display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;align-items:center;gap:.75rem;width:100%;min-height:58px;padding:.55rem .9rem .55rem 1rem;border:0;background:none;color:var(--platine);font:400 .98rem/1.3 var(--i-ui);text-align:left}
.tache + .tache .tache-b{background:linear-gradient(var(--i-sep),var(--i-sep)) no-repeat 3.6rem 0/100% 1px}
.tache-b:active{background-color:#1E1E21}
.vue-vendeur .tache .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#3A3B40;color:var(--platine)}
.vue-vendeur .tache.urgent .ic{background:var(--epuise);color:#1C0E0B}
.vue-vendeur .tache.att .ic{background:var(--bas);color:#1E1505}
.vue-vendeur .tache .ic svg{width:18px;height:18px}
.tache-lbl{font-size:.86rem;font-weight:600;color:var(--argent)}
.tache.urgent .tache-lbl{color:var(--platine)}
.chevron{display:block;width:14px;height:14px;color:#5E616A}
.chevron svg{display:block;width:100%;height:100%}
.vue-vendeur .tout-ok{padding:1rem;border-radius:22px;background:var(--i-cell)}

/* dernières ventes */
.vue-vendeur .dernieres{border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .dernieres li{grid-template-columns:44px minmax(0,1fr) auto;gap:.8rem;padding:.6rem 1rem .6rem .75rem;border:0;background:linear-gradient(var(--i-sep),var(--i-sep)) no-repeat 4.3rem 0/100% 1px}
.vue-vendeur .dernieres li:first-child{background:none}
.vue-vendeur .dernieres .plaque{width:44px;aspect-ratio:1;border-radius:10px}
.vue-vendeur .dernieres b{font:400 1rem/1.25 var(--i-ui)}
.vue-vendeur .d-prix{font-weight:600;color:var(--platine);font-variant-numeric:tabular-nums}

/* boutons, champs, pastilles */
.vue-vendeur .btn,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn{min-height:44px;border:0;border-radius:999px;background:var(--i-cell-h);color:var(--platine);font:600 .98rem var(--i-ui)}
.vue-vendeur .btn.petit,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.petit{min-height:38px;padding:.35rem .95rem;font-size:.9rem}
.vue-vendeur .btn.plein,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.plein{background:var(--platine);color:#000}
.vue-vendeur .btn.discret,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.discret{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--argent)}
.vue-vendeur .btn.danger,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.danger{background:rgba(221,144,132,.15);color:var(--epuise)}
.vue-vendeur .champ :is(input,select,textarea),.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .champ :is(input,select,textarea){padding:.7rem .85rem;border:0;border-radius:12px;background:var(--i-cell-h);color:var(--platine);font:16px var(--i-ui)}
.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .champ :is(input,select,textarea){background:#2A2A2D}
.vue-vendeur .champ label,.vue-vendeur .champ .lbl{font-size:.84rem;color:var(--fumee)}
.vue-vendeur .recherche,.mode-vendeur dialog.vente-dlg .recherche{height:42px;padding:0 .9rem 0 2.5rem;border:0;border-radius:12px;background:var(--i-champ);color:var(--platine);font:17px var(--i-ui)}
.vue-vendeur .recherche-zone .icone,.mode-vendeur dialog.vente-dlg .recherche-zone .icone{left:.8rem;width:1.05rem;height:1.05rem}
.vue-vendeur .puce{min-height:36px;border:0;background:var(--i-cell-h);color:var(--platine);font:500 .9rem var(--i-ui)}
.vue-vendeur .puce span{background:rgba(255,255,255,.1);color:var(--argent)}
.vue-vendeur .puce[aria-pressed="true"]{background:var(--platine);color:#000}
.vue-vendeur .alerte{border:0;border-radius:18px;background:rgba(227,185,111,.12)}

/* stock : lignes groupées, jauge de fiole, glisser pour Ajuster / Vendre */
.vue-vendeur .stock-liste{gap:0;border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .ligne-stock{position:relative;border:0;border-radius:0;background:none}
.vue-vendeur .ligne-stock + .ligne-stock::before{content:"";position:absolute;z-index:3;left:4.5rem;right:0;top:0;height:1px;background:var(--i-sep);pointer-events:none}
.vue-vendeur .ls-resume{display:block;position:relative;padding:0;overflow:hidden;border:0!important}
.ls-contenu{position:relative;z-index:1;display:grid;grid-template-columns:46px minmax(0,1fr) auto 14px;align-items:center;gap:.75rem;padding:.6rem 1rem .6rem .75rem;background:var(--i-cell);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ligne-stock.glisse-actif .ls-contenu{transition:none}
.ligne-stock.glisse .ls-contenu{transform:translateX(calc(-1 * var(--lg,156px)))}
.ls-glisse{position:absolute;top:0;right:0;bottom:0;display:flex}
.lg-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:78px;padding:0;border:0;font:500 .8rem var(--i-ui)}
.lg-b svg{width:20px;height:20px}
.lg-b.ajuster{background:#3A3B40;color:var(--platine)}
.lg-b.vendre{background:var(--platine);color:#000;font-weight:600}
.vue-vendeur .ls-contenu .plaque{width:46px;aspect-ratio:1;border-radius:10px}
.vue-vendeur .ls-txt b{font:400 1rem/1.25 var(--i-ui);color:var(--platine)}
.vue-vendeur .ls-txt b small{font:500 .68rem var(--i-ui)}
.vue-vendeur .ls-etat{padding:0;border:0;border-radius:0;background:none;font-size:.84rem;font-weight:600;text-align:right}
.vue-vendeur .ls-etat.ok{color:var(--argent)}
.vue-vendeur .ligne-stock[open]{background:#1A1A1D;border:0}
.vue-vendeur .ligne-stock[open] .ls-contenu{background:#1A1A1D}
.vue-vendeur .ligne-stock[open] > .ls-resume{border-bottom:0!important}
.vue-vendeur .ligne-stock > .corps{padding:.3rem 1rem 1rem}
.fiole-j{position:relative;display:block;width:14px;height:36px}
.fiole-j::before{content:"";position:absolute;left:3px;top:0;width:8px;height:5px;border-radius:1.5px;background:#6A6D75}
.fiole-j > span{position:absolute;left:0;right:0;top:6px;bottom:0;border:1.5px solid rgba(244,245,247,.5);border-radius:3px 3px 7px 7px;overflow:hidden}
.fiole-j > span::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--n,0) * 100%);background:linear-gradient(0deg,var(--j2,#C9A764),var(--j1,#EFE0B6))}
.fiole-j.bas > span{border-color:var(--bas)}
.fiole-j.rupt > span{border-color:var(--epuise)}
.fiole-j.libre > span{border-style:dashed;border-color:rgba(244,245,247,.3)}

/* ventes : chiffres en lignes, journal jour par jour */
.vue-vendeur .page-vendeur .chiffres{grid-template-columns:minmax(0,1fr);gap:0;border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .chiffre{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.1rem 1rem;padding:.75rem 1rem;border:0;border-radius:0;background:none}
.vue-vendeur .chiffre + .chiffre{border-top:1px solid var(--i-sep)}
.vue-vendeur .chiffre span{grid-column:1;color:var(--platine);font-size:1rem}
.vue-vendeur .chiffre b{grid-column:2;grid-row:1/span 2;font:600 1.25rem var(--i-ui);text-align:right}
.vue-vendeur .chiffre small{grid-column:1}
.vue-vendeur .chiffre .progres-barre{grid-column:1/-1}
.vue-vendeur .page-vendeur .chiffres > .chiffre:last-child:nth-child(odd){grid-column:auto}

.cmd-puces-zone{position:sticky;top:0;z-index:20;min-width:0;margin:0 calc(50% - 50vw);padding:max(10px,env(safe-area-inset-top,0px)) 0 10px}

function aLaVue(els) {
  if (!('IntersectionObserver' in window) || sansMouvement()) return;

    el.classList.add('attend');

/* ouverture en zoom : la photo de la vignette grandit jusqu'à la fiche (iPhone à jour ; sinon ouverture normale) */

  src.style.viewTransitionName = 'bp-flacon';
  document.documentElement.classList.add('vt-fiche');
  let t;

  if (f === 'stock') { const v = n == null ? null : arrondi(parPiece ? n * p.contenance : n); if (p.stock === v) return; p.stock = v; }
  if (f === 'prix') {
    const s = String(el.dataset.s);
    const avant = prixDe(p, s);
    if (n == null || n === 0) delete p.prix[s]; else p.prix[s] = arrondi(n);
    if (avant === prixDe(p, s)) return;
  }
  modifie();
  majResumeLigne(p);
}

/* bords de l'image sombres en moyenne : photo sur fond noir */
function fondSombre(img) {
  try {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let t = 0, n = 0;
    for (let i = 0; i < 32; i++) for (const [px, py] of [[i, 0], [i, 31], [0, i], [31, i]]) { const k = (py * 32 + px) * 4; t += d[k] * .2126 + d[k + 1] * .7152 + d[k + 2] * .0722; n++; }
    return t / n < 70;
  } catch (e) { return false; }
}
function traiterImage(fichier) {
  return new Promise((res, rej) => {
    if (!fichier || !/^image\//.test(fichier.type || 'image/')) { rej(new Error('type')); return; }
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      try {
        const W = 640, H = 800, marge = 0.05;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';
        if (fondSombre(img)) {
          /* photo de studio sur fond sombre : recadrée plein cadre, centrée, le bas conservé */
          const r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.fillStyle = '#000';
          x.fillRect(0, 0, W, H);
          x.drawImage(img, (W - w) / 2, H - h, w, h);
        } else {
          /* flacon détouré sur fond clair : posé au centre du plateau */
          x.fillStyle = '#ECECEA';
          x.fillRect(0, 0, W, H);
          const r = Math.min(W * (1 - 2 * marge) / img.naturalWidth, H * (1 - 2 * marge) / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.globalCompositeOperation = 'multiply';
          x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        }
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('lecture')); };
    img.src = url;
  });
}
function recevoirImage(fichier) {
  const err = document.getElementById('ph-err');
  if (err) err.textContent = '';
  traiterImage(fichier).then(data => {
    S.photoTemp = data;
    const a = document.getElementById('ph-apercu');
    if (a) a.innerHTML = `<img src="${data}" alt="Nouvelle photo">`;
    const b = document.getElementById('ph-ok');
    if (b) b.disabled = false;
  }, () => { if (err) err.textContent = "Cette image n'a pas pu être lue. Essaie une photo en JPEG ou PNG."; });
}

function enregistrerEditeur() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('e-err');
  const nom = v('e-nom');
  if (!nom) { err.textContent = 'Donne un nom au parfum.'; return; }
  const accords = document.getElementById('e-acc').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)(?:\s+(\d{1,3}))?$/);
    return m[2] ? { n: m[1].trim(), v: Math.min(100, Number(m[2])) } : { n: m[1].trim() };
  });
  const coches = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const annee = v('e-annee');
  const data = {
    maison: v('e-maison'), nom, collection: v('e-coll'), annee: /^\d{4}$/.test(annee) ? Number(annee) : annee, genre: v('e-genre'),
    fragrantica: /^https:\/\//.test(v('e-frag')) ? v('e-frag') : '', accords,
    notes: { tete: liste(v('e-tete')), coeur: liste(v('e-coeur')), fond: liste(v('e-fond')), plat: liste(v('e-plat')) },
    saisons: coches('e-saison'), moment: coches('e-moment'), saisonsVerifiees: document.getElementById('e-verif').checked,
    badge: v('e-badge'), prixFlacon: (nombre(v('e-pf')) > 0 ? arrondi(nombre(v('e-pf'))) : null), mlFlacon: (nombre(v('e-mf')) > 0 ? nombre(v('e-mf')) : null),
    type: ['miniature', 'flacon'].includes(v('e-type')) ? v('e-type') : '', statut: v('e-statut'), famille: v('e-fam'), mention: v('e-mention').slice(0, 160)
  };
  const ct = nombre(v('e-cont'));
  if (data.type === 'miniature') {
    if (!(ct > 0) || ct > 100) { err.textContent = 'Indique la contenance de la miniature en ml, par exemple 7,5.'; return; }
    data.contenance = arrondi(ct);
  } else if (data.type === 'flacon') {
    if (!(ct >= 15) || ct > 1000) { err.textContent = 'Indique la contenance du flacon en ml, par exemple 100.'; return; }
    data.contenance = arrondi(ct);
  } else data.contenance = null;
  const id = document.getElementById('edit').dataset.id;
  if (id) {
    const p = trouver(id);
    /* changement de contenance d'une pièce entière : le prix et le stock suivent */
    if (data.type && data.type === p.type && p.contenance !== data.contenance) {
      const px = prixDe(p, p.contenance), n = pieces(p);
      if (px != null) { delete p.prix[String(p.contenance)]; p.prix[String(data.contenance)] = px; }
      if (n != null) p.stock = arrondi(n * data.contenance);
    }
    Object.assign(p, normaliser({ parfums: [Object.assign({}, p, data)] }).parfums[0]);
  } else {
    const base = (data.type === 'miniature' ? 'mini-' : data.type === 'flacon' ? 'neuf-' : '') + (nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'parfum');
    let nid = base, i = 2;
    while (trouver(nid)) nid = base + '-' + i++;
    ST.parfums.push(normaliser({ parfums: [Object.assign({ id: nid, prix: {}, stock: null, visible: true, photo: '' }, data)] }).parfums[0]);
  }
  fermer(); modifie(); rendre();
  toast(id ? 'Fiche modifiée. Publie pour mettre la carte à jour.' : 'Parfum ajouté. Indique ses prix, puis publie.');
}

function construire() {
  const json = JSON.stringify(ST).replace(/</g, '\\u003c');
  const css = document.getElementById('bp-style').textContent;
  const code = document.getElementById('bp-code').textContent;
  return PREFIX + TETE + '<style id="bp-style">' + css + '</style>' + CORPS
    + '<script type="application/json" id="bp-data">' + json + '<' + '/script>'
    + '<script id="bp-code">' + code + '<' + '/script>' + SUFFIX;
}
function retenirApres(msg) {
  try { sessionStorage.setItem('bp-apres', JSON.stringify({ msg, onglet: S.onglet })); } catch (e) {}
}
function oublierApres() { try { sessionStorage.removeItem('bp-apres'); } catch (e) {} }
async function publier(msgOk, muet) {
  if (S.hote === 'gh') return publierGh(msgOk, muet);
  if (S.publication) return false;
  let art = null;
  try { art = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('artifact') : null; } catch (e) {}
  if (!art) { toast("La publication n'est pas disponible dans cette vue."); return false; }
  S.publication = true; rendreConsole();
  retenirApres(msgOk);
  const html = construire();
  try {
    try { await art.publish(html); }
    catch (e) {
      if (!e || e.code !== 'upstream_error') throw e;
      await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      await art.publish(html);
    }
    return true;
  } catch (e) {
    oublierApres();
    const c = e && e.code;
    if (c === 'conflict') toast('Une version plus récente existe. La page se recharge : refais ta dernière modification.');
    else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) toast("Ce compte ne peut pas publier la carte depuis cette vue.");
    else if (c === 'too_large') toast('La page est trop lourde. Retire une ou deux photos, puis réessaie.');
    else if (c === 'rate_limited') toast("Trop de publications d'affilée. Attends un peu, puis réessaie.");
    else toast("La publication n'a pas abouti. Réessaie dans un instant.");
    return false;
  } finally {
    S.publication = false; rendreConsole();
  }
}

/* ---------- la vente : un client, un ou plusieurs parfums ---------- */
/* On touche chaque parfum pris par le client, puis on vérifie la vente (taille, quantité, prix) et on enregistre tout d'un coup.
   Les offres d'ensemble (le duo…) s'appliquent toutes seules dès que leurs pièces sont dans la vente.
   La vente en cours reste gardée sur le téléphone tant qu'elle n'est pas enregistrée, même si la feuille se ferme. */
const CLE_GROUPE = 'bp-ventes-attente';
function groupe() {
  if (!S.groupe) {
    let g = null;
    try { g = JSON.parse(lire(CLE_GROUPE) || 'null'); } catch (e) {}
    /* ancien format : une liste de ventes en attente, chacune avec son prix déjà fixé */
    const ancien = Array.isArray(g);

/* le journal, jour par jour, avec le total de chaque jour */
function nomJour(iso) {
  const auj = aujourdhui();
  if (iso === auj) return "Aujourd'hui";
  const h = new Date(auj + 'T12:00:00'); h.setDate(h.getDate() - 1);
  if (iso === new Date(h.getTime() - h.getTimezoneOffset() * 60000).toISOString().slice(0, 10)) return 'Hier';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso || 'Sans date';
  const t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function journalParJour(ventes) {

      h += `<li class="j-jour"><span>${esc(nomJour(jour))}</span><span>${eur(tot)}</span></li>`;

/* ---------- sur commande, côté vendeur ----------
   commande.json, dans le dépôt privé : { seuil, achats: { id: prix d'achat }, reservations: [...], commandes: [...] }.
   Une réservation compte dans la commande dès que son acompte est reçu ; à 500 € d'achat, tu passes la commande.
   Seul le pourcentage de remplissage part sur le site, jamais les prix d'achat ni les clients. */
const SEUIL_CMD = 500;
function normCmdPrive(x) {
  const o = x && typeof x === 'object' ? x : {};
  return {
    seuil: Number(o.seuil) > 0 ? Number(o.seuil) : SEUIL_CMD,
    achats: o.achats && typeof o.achats === 'object' ? o.achats : {},
    reservations: Array.isArray(o.reservations) ? o.reservations.filter(r => r && r.id && r.produit) : [],
    commandes: Array.isArray(o.commandes) ? o.commandes.filter(c => c && c.id) : []
  };
}
const cmdPrive = () => S.cmdP || (S.cmdP = normCmdPrive(null));
const copieCmd = () => JSON.parse(JSON.stringify(cmdPrive()));
const produitsCmd = () => (ST.commande && ST.commande.produits) || [];
const achatCmd = id => { const a = cmdPrive().achats[id]; return typeof a === 'number' ? a : null; };
const resEnCours = () => cmdPrive().reservations.filter(r => !r.commande);
const resRecues = () => resEnCours().filter(r => r.recu);
const resAttente = () => resEnCours().filter(r => !r.recu);
const aRemettre = () => cmdPrive().reservations.filter(r => r.commande && !r.remis);
const montantCmd = l => arrondi(l.reduce((t, r) => t + (achatCmd(r.produit) || 0), 0));
const rempliCmd = () => Math.min(100, Math.round(montantCmd(resRecues()) / cmdPrive().seuil * 100));
const joursDepuis = t => Math.floor((Date.now() - (t || 0)) / 864e5);
/* acompte reçu depuis plus de 30 jours, commande toujours pas partie : on le rend */
const enRetard = r => r.recu && !r.commande && joursDepuis(r.recuLe || r.creeLe) >= ((ST.commande && ST.commande.jours) || 30);
const aRembourser = () => resRecues().filter(enRetard);
const nomRes = r => r.nom + (r.client ? ' (' + r.client + ')' : '');
const nomsRes = l => l.length <= 2 ? l.map(nomRes).join(', ') : l.slice(0, 2).map(nomRes).join(', ') + ` et ${l.length - 2} autres`;

const nomsGroupes = gs => gs.length <= 2 ? gs.map(nomGroupe).join(', ') : gs.slice(0, 2).map(nomGroupe).join(', ') + ` et ${gs.length - 2} autres`;
const sommeDe = (l, f) => arrondi(l.reduce((t, x) => t + (f(x) || 0), 0));
const pieceRes = r => pieceCmd(r.produit, true) || { id: r.produit, nom: r.nom, maison: r.maison || '', type: 'commande', cmd: true, contenance: r.ml, prix: {}, stock: null, visible: true, statut: '', photo: '', notes: {}, accords: [], saisons: [], moment: [] };
const pieceVente = id => trouver(id) || pieceCmd(id, true);

/* ---------- espace vendeur sur le site hébergé (GitHub) ----------
   Le site est public : aucun secret n'y figure. La clé est un jeton GitHub personnel,
   collé une fois sur l'appareil du vendeur et gardé chiffré (AES-GCM, clé tirée du mot de passe
   par PBKDF2) dans le stockage de ce navigateur. Le mot de passe n'est jamais enregistré. */
const GH_API = 'https://api.github.com';
const CLE_GH = 'bp-vendeur';
const ITERATIONS = 310000;
const ITERATIONS_SITE = 600000;
const MDP_MIN_SITE = 12;
function depotsParDefaut() {
  const h = location.hostname.toLowerCase();
  const m = h.match(/^([a-z0-9-]+)\.github\.io$/);
  return { proprio: m ? m[1] : '', depot: m ? h : '', prive: 'blackphantom-gestion' };
}
function ghConfig() {
  try { const c = JSON.parse(lire(CLE_GH) || 'null'); return c && c.v === 1 && c.ct && c.proprio && c.depot ? c : null; } catch (e) { return null; }
}
const octets = t => new TextEncoder().encode(t);
function versB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function depuisB64(b) {
  const s = atob(String(b).replace(/\s/g, ''));
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);

}
const texteB64 = t => versB64(octets(t));
const b64Texte = b => new TextDecoder().decode(depuisB64(b));
async function cleDe(mdp, sel, iterations) {
  const base = await crypto.subtle.importKey('raw', octets(mdp), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sel, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function chiffrer(jeton, mdp, iterations) {
  const n = iterations || ITERATIONS;
  const sel = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await cleDe(mdp, sel, n), octets(jeton)));
  return { sel: versB64(sel), iv: versB64(iv), iter: n, ct: versB64(ct) };
}

/* API GitHub : les erreurs remontent sous la forme { statut, limite } */
async function gh(methode, chemin, corps, accept) {
  let r;
  try {
    r = await fetch(GH_API + chemin, {
      method: methode, cache: 'no-store',
      headers: Object.assign({ Accept: accept || 'application/vnd.github+json', Authorization: 'Bearer ' + S.gh.jeton }, corps ? { 'Content-Type': 'application/json' } : {}),
      body: corps ? JSON.stringify(corps) : undefined
    });
  } catch (e) { throw { statut: 0 }; }
  if (!r.ok) throw { statut: r.status, limite: r.headers.get('x-ratelimit-remaining') === '0' };
  return accept ? r.text() : r.json().catch(() => null);
}
const enc = encodeURIComponent;
const cheminDepot = depot => `/repos/${enc(S.gh.proprio)}/${enc(depot)}`;

async function lireFichier(depot, f, sansTexte) {
  let d;
  try { d = await gh('GET', cheminFichier(depot, f)); }
  catch (e) { if (e.statut === 404) return null; throw e; }
  if (!d || Array.isArray(d) || !d.sha) throw { statut: -1 };
  if (sansTexte) return { sha: d.sha, texte: null };
  /* au-delà de 1 Mo, l'API ne renvoie pas le contenu : on le demande brut */
  const texte = d.encoding === 'base64' && d.content ? b64Texte(d.content) : await gh('GET', cheminFichier(depot, f), null, 'application/vnd.github.raw+json');
  return { sha: d.sha, texte };
}
async function ecrireFichier(depot, f, contenuB64, sha, message) {
  const d = await gh('PUT', cheminFichier(depot, f), Object.assign({ message, content: contenuB64 }, sha ? { sha } : {}));
  if (!d || !d.content || !d.content.sha) throw { statut: -1 };
  return d.content.sha;
}

function messageGh(e, depot) {
  const s = e && e.statut;
  if (s === 0) return 'Pas de connexion à GitHub. Vérifie ton réseau, puis réessaie.';
  if (s === 401) return "Ton jeton GitHub n'est plus valide (expiré ou supprimé). Crée-en un nouveau sur GitHub, puis reconnecte-toi avec « Nouveau jeton ».";
  if (s === 403 && e.limite) return 'GitHub limite les requêtes pour le moment. Réessaie dans quelques minutes.';
  if (s === 403) return `Ton jeton n'a pas le droit de modifier ${depot || 'ce dépôt'}. Dans ses réglages GitHub, coche ce dépôt et mets « Contents » sur « Read and write ».`;
  if (s === 404) return `Le dépôt ${depot || ''} est introuvable avec ce jeton. Vérifie qu'il existe et qu'il est coché dans le jeton.`;
  if (s === 409 || s === 422) return 'Tes données ont été modifiées entre-temps, depuis un autre appareil ou un autre onglet. Recharge la page, puis refais ta dernière action.';
  return "GitHub n'a pas répondu comme prévu. Réessaie dans un instant.";
}

/* retrouve le jeton dans le texte collé, même entouré d'autres caractères ou avec une majuscule ajoutée au début */
function extraireJeton(t) {
  const m = String(t || '').match(/(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})/i);
  if (!m) return '';
  return m[1].replace(/^github_pat_/i, 'github_pat_').replace(/^gh([pousr])_/i, (x, c) => 'gh' + c.toLowerCase() + '_');

       sauf si la case « tous mes appareils » avait été décochée */
    let astuce = false;
    if (!accesSite() && c.site !== false) {
      if (mdp.length >= MDP_MIN_SITE) {
        const cle = Object.assign({ v: 1, proprio: c.proprio, depot: c.depot, prive: c.prive, site: true }, await chiffrer(jeton, mdp, ITERATIONS_SITE));
        ecrire(CLE_GH, JSON.stringify(cle));
        S.gh.acces = { publier: cle };
      } else astuce = true;
    }
    entrerVendeur();
    if (astuce) toast(`Pour te connecter partout avec ton mot de passe seul : touche « Quitter », puis « Mot de passe oublié ou nouveau jeton », et choisis un mot de passe de ${MDP_MIN_SITE} caractères.`);
    return;
  }
  const brut = document.getElementById('gh-jeton').value.replace(/[\s\u200B-\u200D\u2060\uFEFF]/g, '');
  const jeton = extraireJeton(brut);
  const conf = { proprio: val('gh-proprio').replace(/^@/, ''), depot: val('gh-depot'), prive: val('gh-prive') || 'blackphantom-gestion' };
  if (!brut) { err.textContent = 'Colle ton jeton GitHub.'; return; }
  if (!jeton) { err.textContent = typo(`Ce texte ne ressemble pas à un jeton GitHub. Il commence par « ${brut.slice(0, 11)} » et fait ${brut.length} caractères, alors qu'un jeton commence par github_pat_ et en fait environ 93. Touche « Afficher » pour le vérifier.`); return; }
  const partout = document.getElementById('gh-partout').checked;
  const min = partout ? MDP_MIN_SITE : 8;
  if (mdp.length < min) { err.textContent = `Choisis un mot de passe d'au moins ${min} caractères.`; return; }
  if (mdp !== document.getElementById('gh-mdp2').value) { err.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
  if (!conf.proprio || !conf.depot) { f.querySelector('details').open = true; err.textContent = 'Indique ton compte GitHub et le dépôt du site.'; return; }
  occupe(true, 'Vérification…');
  try { await verifierJeton(jeton, conf); }
  catch (e) { occupe(false, 'Se connecter'); err.textContent = e.texte || messageGh(e, conf.depot); return; }
  const cle = Object.assign({ v: 1, site: partout }, conf, await chiffrer(jeton, mdp, partout ? ITERATIONS_SITE : ITERATIONS));
  ecrire(CLE_GH, JSON.stringify(cle));
  oublier(CLE_FACEID);
  S.gh = Object.assign({ jeton }, conf, { acces: partout ? { publier: cle } : { retirer: true } });
  entrerVendeur();
}

const trierVentes = () => S.ventes.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.creeLe || 0) - (a.creeLe || 0));
async function chargerGh() {
  const g = S.gh;
  S.ghEtat = 'charge'; S.dbEtat = 'charge';
  /* la carte publiée, lue sur GitHub plutôt que dans la page (qui peut venir du cache) */
  try {
    const f = await lireFichier(g.depot, 'index.html');
    if (S.gh !== g) return;
    if (!f) throw { statut: 404 };
    const doc = new DOMParser().parseFromString(f.texte, 'text/html');
    const data = doc.getElementById('bp-data'), code = doc.getElementById('bp-code');
    if (!data || !code) throw { texte: "Le fichier index.html de ton site n'est pas une carte BlackPhantom. Remets en ligne le fichier que je t'ai donné." };
    S.gh.shaIndex = f.sha;
    if (code.textContent !== document.getElementById('bp-code').textContent) S.ghEtat = 'ancien';
    else {
      ST = normaliser(JSON.parse(data.textContent));
      BASE = JSON.stringify(ST);
      S.modifs = 0;
      const a = g.acces;
      if (a && (a.publier ? JSON.stringify(ST.acces) !== JSON.stringify(normaliser({ acces: a.publier }).acces) : ST.acces)) {
        ST.acces = a.publier ? normaliser({ acces: a.publier }).acces : null;
        S.ghEtat = 'pret';
        S.modifs = 1;
        const ok = await publierGh(a.publier ? 'Accès enregistré : sur tes autres appareils, ton mot de passe suffira.' : 'Accès retiré du site.');
        if (S.gh !== g) return;
        if (ok) delete g.acces;
      }
      S.ghEtat = 'pret';
    }
  } catch (e) {
    if (S.gh !== g) return;
    S.ghEtat = 'erreur';
    S.ghErreur = e.texte || messageGh(e, g.depot);
  }
  rendre();
  if (S.ghEtat !== 'pret') return;
  /* ventes et coûts, dans le dépôt privé */
  try {
    const r = await gh('GET', cheminDepot(g.prive));
    if (S.gh !== g) return;
    if (!r || r.private !== true) { S.dbEtat = 'public'; }
    else {
      const [v, c, k] = await Promise.all([lireFichier(g.prive, 'ventes.json'), lireFichier(g.prive, 'couts.json'), lireFichier(g.prive, 'commande.json')]);
      if (S.gh !== g) return;
      const lv = v ? JSON.parse(v.texte || '[]') : [];
      const lc = c ? JSON.parse(c.texte || '{}') : {};
      S.gh.shaVentes = v ? v.sha : null;
      S.gh.shaCouts = c ? c.sha : null;
      S.ventes = Array.isArray(lv) ? lv.filter(x => x && x.id) : [];
      trierVentes();
      S.couts = Object.assign({ fiole: null, parfums: {} }, lc && typeof lc === 'object' ? lc : {});
      S.gh.shaCmd = k ? k.sha : null;
      S.cmdP = normCmdPrive(k ? JSON.parse(k.texte || '{}') : null);
      /* la jauge du site suit les acomptes reçus : corrigée si elle s'est décalée */
      if (k && ST.commande && ST.commande.produits.length && ST.commande.remplie !== rempliCmd()) { ST.commande.remplie = rempliCmd(); S.modifs++; rendreConsole(); }
      S.db = 'gh'; S.dbEtat = 'pret';
    }
  } catch (e) {
    if (S.gh !== g) return;
    S.dbEtat = e && e.statut === 404 ? 'sans-depot' : 'erreur';
    S.dbErreur = e instanceof SyntaxError ? 'Le fichier de tes ventes est illisible. Dis-le-moi dans la conversation, je le répare.' : messageGh(e, g.prive);
  }
  majPanneauDb();
}

/* publication : photos nouvelles dans photos/, puis index.html */
async function publierGh(msgOk, muet) {
  if (S.publication) return false;
  if (S.ghEtat !== 'pret') { toast(S.ghEtat === 'ancien' ? 'Recharge la page avant de publier.' : 'Ta carte est encore en cours de chargement.'); return false; }
  S.publication = true; rendreConsole();
  const avant = JSON.parse(BASE);
  try {
    for (const p of ST.parfums) {
      const m = /^data:image\/(jpeg|png|webp);base64,/.exec(p.photo || '');
      if (!m) continue;
      const chemin = `photos/${p.id}-${Date.now().toString(36)}.${m[1] === 'jpeg' ? 'jpg' : m[1]}`;
      await ecrireFichier(S.gh.depot, chemin, p.photo.slice(m[0].length), null, `Photo de ${p.nom}`);
      S.apercus[chemin] = p.photo;
      p.photo = chemin;
    }
    S.gh.shaIndex = await ecrireFichier(S.gh.depot, 'index.html', texteB64(construireVitrine()), S.gh.shaIndex, 'Mise à jour de la carte');
    BASE = JSON.stringify(ST);
    S.modifs = 0;
    await retirerVieillesPhotos(avant);
    if (!muet) toast((msgOk || 'Carte publiée.') + ' Ton site sera à jour d\'ici une à deux minutes.');
    return true;
  } catch (e) {
    toast(messageGh(e, S.gh.depot));
    return false;
  } finally {
    S.publication = false; rendreConsole();
  }
}
async function retirerVieillesPhotos(avant) {
  const utilisees = new Set(ST.parfums.map(p => p.photo));
  const vieilles = [...new Set((avant.parfums || []).map(p => p.photo))].filter(x => /^photos\/[\w.-]+$/.test(x || '') && !utilisees.has(x));
  for (const f of vieilles) {
    try { const r = await lireFichier(S.gh.depot, f, true); if (r) await supprimerFichier(S.gh.depot, f, r.sha, 'Ancienne photo retirée'); } catch (e) {}
  }
}

/* ventes sur le site */
async function ecrireVentes(liste, message) {
  S.gh.shaVentes = await ecrireFichier(S.gh.prive, 'ventes.json', texteB64(JSON.stringify(liste, null, 1)), S.gh.shaVentes, message);
  S.ventes = liste;
  trierVentes();
}
async function supprimerVenteGh(v) {
  const rendre_ = estDeduite(v) && v.stockSuivi;
  try { await ecrireVentes(S.ventes.filter(x => x.id !== v.id), `Vente retirée : ${v.nom}`); }
  catch (e) { toast(messageGh(e, S.gh.prive)); rendreVentesDyn(); return; }
  await oublierRemis([v.id]);
  const p = trouver(v.parfumId);
  if (rendre_ && p && p.stock != null) {
    p.stock = arrondi(p.stock + (v.ml || 0));
    S.modifs++;
    rendreVentesDyn();
    await publier(`Vente supprimée. ${qteVente(v)} ${venteEntiere(v) && v.qte > 1 ? 'remises' : venteEntiere(v) ? 'remise' : 'remis'} en stock.`);
  } else toast('Vente supprimée.');
  rendreVentesDyn();
}

details.couts-parfums > summary small{grid-column:1;font-size:.82rem;color:var(--fumee)}
details.couts-parfums > summary::after{content:"+";grid-column:2;grid-row:1/span 2;color:var(--fumee);font-size:1.2rem}
details.couts-parfums[open] > summary::after{content:"−"}
details.couts-parfums[open] > summary{margin-bottom:.6rem}
.page-vendeur .chiffres:not(.mini){grid-template-columns:repeat(2,minmax(0,1fr))}
.page-vendeur .chiffres:not(.mini) > .chiffre:last-child:nth-child(odd){grid-column:1/-1}

/* ventes groupées : plusieurs ventes notées une par une, enregistrées en une fois */
.vs-p .plaque{position:relative}
.vs-nb{position:absolute;top:6px;right:6px;min-width:1.5rem;height:1.5rem;padding:0 .4rem;border-radius:999px;background:var(--platine);color:var(--nuit);font:600 .8rem/1.5rem var(--f-texte);text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.vs-groupe-barre{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:.7rem;width:100%;padding:.6rem .75rem;border:1px solid rgba(227,185,111,.5);border-radius:var(--r-ecrin);background:rgba(227,185,111,.09);color:var(--argent);text-align:left;font:inherit}
.vs-groupe-barre svg{width:18px;height:18px;color:var(--fumee)}
.vg-nb{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--bas);color:var(--nuit);font-weight:600;font-variant-numeric:tabular-nums}
.vg-txt{display:grid;min-width:0}
.vg-txt b{font-weight:500;color:var(--platine)}
.vg-txt small{font-size:.8rem;color:var(--fumee);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vg-total{font-weight:500;color:var(--platine);font-variant-numeric:tabular-nums}
.vs-pied{position:sticky;bottom:-1.3rem;z-index:2;display:grid;gap:.55rem;margin:0 -1.3rem -1.3rem;padding:1.4rem 1.3rem 1.3rem;background:linear-gradient(180deg,rgba(17,17,19,0),var(--ecrin) 1.2rem)}
.vs-pied .err:empty{display:none}
.vs-boutons{display:grid;gap:.6rem}
.vs-boutons .btn svg,.vs-liste ~ .btn svg{width:18px;height:18px}
.vs-liste{display:grid;margin:0;padding:0;list-style:none}
.vs-liste li{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--filet)}
.vs-liste .plaque{width:46px;border-radius:6px}
.vl-txt{display:grid;min-width:0}
.vl-txt b{font:500 1.02rem/1.2 var(--f-titre);color:var(--platine)}
.vl-txt small{font-size:.8rem;color:var(--fumee)}
.vl-txt small.err{color:var(--epuise)}
.vl-prix{font-weight:500;color:var(--platine);font-variant-numeric:tabular-nums}
.vs-liste .suppr{margin:0}
.fab{overflow:visible}
.fab-nb{position:absolute;top:-6px;right:-4px;min-width:1.4rem;height:1.4rem;padding:0 .35rem;border-radius:999px;background:var(--bas);color:var(--nuit);font:600 .78rem/1.4rem var(--f-texte);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.vs-groupe-barre.vient{animation:vg-vient .55s cubic-bezier(.2,.8,.2,1)}
@keyframes vg-vient{0%{transform:translateY(10px) scale(.97);box-shadow:0 0 0 0 rgba(227,185,111,.6)}60%{box-shadow:0 0 0 8px rgba(227,185,111,0)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.vs-groupe-barre.vient{animation:none}}
.sel-outils{display:flex;justify-content:flex-end;margin:-.4rem 0 0}

/* ================= effets : fioles, sélection, zoom, vitrine, sceau, reflet du cuir ================= */

/* le parfum dans les fioles : il monte dans la taille choisie, et clapote */
.flacon .jus-niveau{transform-box:fill-box;transition:transform 1.15s cubic-bezier(.3,.75,.25,1)}
.trio-f:not(.choisi) .jus-niveau,.trio.attend:not(.vu) .jus-niveau{transform:translateY(100%)}
@media (prefers-reduced-motion:no-preference){
  .trio-f.choisi .jus-vague{animation:clapote 1.9s cubic-bezier(.3,.6,.4,1) .45s both}
  .trio.attend:not(.vu) .trio-f.choisi .jus-vague{animation:none}
}
@keyframes clapote{0%{transform:rotate(0)}16%{transform:rotate(8deg)}36%{transform:rotate(-6deg)}56%{transform:rotate(3.5deg)}76%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}

/* la sélection, visible dans la fiche ; la fiole s'y envole */
.fiche-sel{position:fixed;z-index:2;top:calc(.8rem + env(safe-area-inset-top,0px));right:calc(max(.8rem,env(safe-area-inset-right,0px)) + 3.05rem);display:inline-flex;align-items:center;gap:.4rem;height:2.5rem;padding:0 .55rem 0 .75rem;border:1px solid var(--filet);border-radius:999px;background:rgba(17,17,19,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--platine);font-size:.85rem;font-weight:500}
.fiche-sel svg{width:18px;height:18px}
.fiche-sel b{display:grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .3rem;border-radius:999px;background:var(--platine);color:var(--nuit);font-size:.76rem;font-variant-numeric:tabular-nums}
.fiche-sel[hidden]{display:none}
.fiche-sel.attend b{opacity:.45}
.fiche-sel.rebond{animation:rebond .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes rebond{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (min-width:860px){.fiche-sel{position:absolute}}
.envol{position:fixed;z-index:5;width:40px;height:62px;pointer-events:none;color:var(--platine);transform:translate(-50%,-50%) scale(1.5);filter:drop-shadow(0 0 12px rgba(244,245,247,.6))}
.envol svg{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.barre:not([hidden]){animation:barre-monte .5s cubic-bezier(.2,.8,.2,1)}}
@keyframes barre-monte{from{transform:translateY(100%)}to{transform:none}}

/* ouverture et fermeture de la fiche en zoom */
::view-transition-group(bp-flacon){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(bp-flacon),::view-transition-new(bp-flacon){height:100%;object-fit:cover}
.vt-fiche::view-transition-old(root),.vt-fiche::view-transition-new(root){animation-duration:.34s}

/* « À découvrir aujourd'hui » : vitrine qui défile */
.ouverture .decouvrir{max-width:46rem}
.vitrine-arc{--cw:clamp(7.4rem,31vw,10.5rem);display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.8rem calc(50% - var(--cw) / 2) 1.1rem;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.vitrine-arc::-webkit-scrollbar{display:none}
.vitrine-arc .decouvrir-p{position:relative;flex:0 0 var(--cw);scroll-snap-align:center;transform:scale(calc(1 - var(--oa,0) * .13));transform-origin:50% 45%}
.vitrine-arc .decouvrir-p .nom,.vitrine-arc .decouvrir-p .prix{opacity:calc(1 - var(--oa,0) * 1.15)}
.vitrine-arc .decouvrir-p .plaque{box-shadow:0 18px 40px rgba(0,0,0,.6)}
@media (min-width:860px){.vitrine-arc{margin:0;--cw:10.5rem}}

/* sceau « Rupture », frappé en relief */
.sceau{position:absolute;z-index:2;top:.4rem;right:.4rem;width:4.5rem;height:4.5rem;transform:rotate(-14deg);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.sceau svg{display:block;width:100%;height:100%;overflow:visible}
.sc-fond{fill:rgba(12,12,14,.84);stroke:rgba(255,255,255,.16);stroke-width:1}
.sc-trait{fill:none;stroke:url(#bp-sceau-metal);stroke-width:1.1;opacity:.8}
.sc-tour{font:600 8.2px var(--f-texte);fill:url(#bp-sceau-metal);text-transform:uppercase}
.sc-mot{font:italic 500 15.5px var(--f-titre);fill:#E7A497}
.sc-bp{font:500 8px var(--f-titre);letter-spacing:2.4px;fill:#C9CCD2}
.bloc-maison.petite .sceau,.decouvrir-p .sceau{width:3.9rem;height:3.9rem}
.sceau.grand{top:auto;bottom:1.1rem;right:1.1rem;width:7.4rem;height:7.4rem}
@media (prefers-reduced-motion:no-preference){.sceau.grand{animation:frappe .65s cubic-bezier(.3,1.4,.5,1) .3s backwards}}
@keyframes frappe{from{transform:rotate(-14deg) scale(1.75);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* reflet sur le cuir du fond : il glisse quand on descend */
.lustre{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.lustre::before{content:"";position:absolute;left:-45vmax;top:-48vmax;width:115vmax;height:72vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.11),rgba(255,255,255,.04) 55%,rgba(255,255,255,0));transform:translate3d(calc(var(--sy,0) * 60vw),calc(var(--sy,0) * 108vh),0) rotate(-24deg);will-change:transform}
@media (prefers-reduced-motion:reduce){.lustre{display:none}}

/* barres d'accords qui se remplissent */
@media (prefers-reduced-motion:no-preference){
  .accords.attend:not(.vu) .jauge span{width:0}
  .accords.vu .jauge span{animation:jauge 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i,0) * .09s) both}
  .accords.attend li{opacity:.35;transition:opacity .5s ease calc(var(--i,0) * .09s)}
  .accords.vu li{opacity:1}
}
@keyframes jauge{from{width:0}}

/* ================= espace vendeur, façon app iPhone =================
   Police du système (San Francisco sur iPhone), grands titres en Bodoni, listes groupées sur fond noir,
   barre d'onglets flottante et bouton « + » rond. Seul l'espace vendeur change : la vitrine garde son style. */
:root{--i-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;--f-bodoni:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;--i-cell:#151517;--i-cell-h:#1F1F22;--i-sep:rgba(255,255,255,.08);--i-champ:rgba(118,118,128,.24)}
body.vue-vendeur::before{background:#000}
.vue-vendeur .page-vendeur,.mode-vendeur .console,.mode-vendeur .fab,.bandeau-vente,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion){--f-titre:var(--i-ui);--f-texte:var(--i-ui);font-family:var(--i-ui);-webkit-font-smoothing:antialiased}
.vue-vendeur .page-vendeur{font-size:16px;line-height:1.35}

/* grand titre, boutons ronds au-dessus */
.vue-vendeur .panneau{gap:1.15rem;padding-top:.5rem}
.vue-vendeur .pv-tete{display:block}
.vue-vendeur .pv-barre{display:flex;justify-content:flex-end;gap:.6rem;min-height:44px;margin-bottom:.15rem}
.vue-vendeur .pv-barre .sortie{order:-1;margin:0 auto 0 0}
.vue-vendeur .pv-tete h2{margin:0;font:700 2.125rem/1.12 var(--f-bodoni);letter-spacing:-.01em;color:var(--platine)}
.vue-vendeur .pv-sous{margin:.15rem 0 0;font-size:.94rem;color:var(--fumee)}
.vue-vendeur .sortie,.vue-vendeur .nav-rond{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--platine)}
.vue-vendeur .sortie svg,.vue-vendeur .nav-rond svg{width:21px;height:21px}

/* raccourcis en pastilles */
.puces-ios{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.puces-ios::-webkit-scrollbar{display:none}
.puce-ios{flex:none;display:inline-flex;align-items:center;gap:.45rem;min-height:40px;padding:0 1rem;border:0;border-radius:999px;background:var(--i-cell-h);color:var(--platine);font:500 .94rem var(--i-ui);white-space:nowrap}
.puce-ios svg{width:18px;height:18px;color:var(--argent)}
.puce-ios:active{background:#2A2A2E}

/* listes groupées */
.groupe-ios{display:grid}
.gi-tete{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2rem;padding:0 .4rem .35rem 1.25rem}
.gi-tete h3{margin:0;font:600 .94rem var(--i-ui);color:var(--fumee)}
.lien-ios{min-height:44px;padding:0 .6rem;border:0;background:none;color:var(--platine);font:600 .94rem var(--i-ui)}
.vue-vendeur .bloc{border:0;border-radius:22px;background:var(--i-cell);padding:1rem}
.vue-vendeur .bloc h3{font:600 1.06rem var(--i-ui)}
.vue-vendeur .faceid-carte{border:0;border-radius:22px;background:var(--i-cell)}

/* la semaine : barres jour par jour, puis le mois */
.semaine{display:grid;border-radius:22px;background:var(--i-cell);overflow:hidden}
.sem-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;padding:.9rem 1rem 0}
.sem-tete small{display:block;font-size:.8rem;color:var(--fumee)}
.sem-tete b{display:block;font:600 1.75rem/1.15 var(--i-ui);letter-spacing:-.01em;color:var(--platine);font-variant-numeric:tabular-nums}
.sem-auj{text-align:right}
.sem-auj b{font-size:1.06rem}
.sem-auj b span{font-weight:400;color:var(--fumee)}
.sem-barres{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;height:116px;padding:.6rem .75rem 0}
.sem-j{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.sem-v{min-height:1em;font-size:.7rem;line-height:1;color:var(--argent);font-variant-numeric:tabular-nums}
.sem-b{width:22px;max-width:72%;border-radius:5px;background:rgba(244,245,247,.36)}
.sem-j.zero .sem-b{border-radius:2px;background:rgba(255,255,255,.12)}
.sem-l{font-size:.7rem;line-height:1;color:var(--fumee)}
.sem-j.auj .sem-b{background:var(--platine)}
.sem-j.auj .sem-v,.sem-j.auj .sem-l{color:var(--platine);font-weight:600}
.sem-ligne{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:50px;margin-left:1rem;padding:.45rem 1rem .45rem 0;border-top:1px solid var(--i-sep);color:var(--platine)}
.sem-barres + .sem-ligne{margin-top:.9rem}
.sem-ligne b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sem-ligne b small{display:block;font-weight:400;font-size:.76rem;color:var(--fumee)}
.sem-ligne b.pos{color:var(--ok)}

/* à faire : lignes à toucher, pastille de couleur selon l'urgence */
.vue-vendeur .taches{border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .tache{display:block;padding:0;border:0}
.tache-b{display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;align-items:center;gap:.75rem;width:100%;min-height:58px;padding:.55rem .9rem .55rem 1rem;border:0;background:none;color:var(--platine);font:400 .98rem/1.3 var(--i-ui);text-align:left}
.tache + .tache .tache-b{background:linear-gradient(var(--i-sep),var(--i-sep)) no-repeat 3.6rem 0/100% 1px}
.tache-b:active{background-color:#1E1E21}
.vue-vendeur .tache .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#3A3B40;color:var(--platine)}
.vue-vendeur .tache.urgent .ic{background:var(--epuise);color:#1C0E0B}
.vue-vendeur .tache.att .ic{background:var(--bas);color:#1E1505}
.vue-vendeur .tache .ic svg{width:18px;height:18px}
.tache-lbl{font-size:.86rem;font-weight:600;color:var(--argent)}
.tache.urgent .tache-lbl{color:var(--platine)}
.chevron{display:block;width:14px;height:14px;color:#5E616A}
.chevron svg{display:block;width:100%;height:100%}
.vue-vendeur .tout-ok{padding:1rem;border-radius:22px;background:var(--i-cell)}

/* dernières ventes */
.vue-vendeur .dernieres{border-radius:22px;background:var(--i-cell);overflow:hidden}
.vue-vendeur .dernieres li{grid-template-columns:44px minmax(0,1fr) auto;gap:.8rem;padding:.6rem 1rem .6rem .75rem;border:0;background:linear-gradient(var(--i-sep),var(--i-sep)) no-repeat 4.3rem 0/100% 1px}
.vue-vendeur .dernieres li:first-child{background:none}
.vue-vendeur .dernieres .plaque{width:44px;aspect-ratio:1;border-radius:10px}
.vue-vendeur .dernieres b{font:400 1rem/1.25 var(--i-ui)}
.vue-vendeur .d-prix{font-weight:600;color:var(--platine);font-variant-numeric:tabular-nums}

/* boutons, champs, pastilles */
.vue-vendeur .btn,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn{min-height:44px;border:0;border-radius:999px;background:var(--i-cell-h);color:var(--platine);font:600 .98rem var(--i-ui)}
.vue-vendeur .btn.petit,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.petit{min-height:38px;padding:.35rem .95rem;font-size:.9rem}
.vue-vendeur .btn.plein,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.plein{background:var(--platine);color:#000}
.vue-vendeur .btn.discret,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.discret{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--argent)}
.vue-vendeur .btn.danger,.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .btn.danger{background:rgba(221,144,132,.15);color:var(--epuise)}
.vue-vendeur .champ :is(input,select,textarea),.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .champ :is(input,select,textarea){padding:.7rem .85rem;border:0;border-radius:12px;background:var(--i-cell-h);color:var(--platine);font:16px var(--i-ui)}
.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .champ :is(input,select,textarea){background:#2A2A2D}
.vue-vendeur .champ label,.vue-vendeur .champ .lbl{font-size:.84rem;color:var(--fumee)}
.vue-vendeur .recherche,.mode-vendeur dialog.vente-dlg .recherche{height:42px;padding:0 .9rem 0 2.5rem;border:0;border-radius:12px;background:var(--i-champ);color:var(--platine);font:17px var(--i-ui)}
.vue-vendeur .recherche-zone .icone,.mode-vendeur dialog.vente-dlg .recherche-zone .icone{left:.8rem;width:1.05rem;height:1.05rem}
.vue-vendeur .puce{min-height:36px;border:0;background:var(--i-cell-h);color:var(--platine);font:500 .9rem var(--i-ui)}
.vue-vendeur .puce span{background:rgba(255,255,255,.1);color:var(--argent)}
.vue-vendeur .puce[aria-pressed="true"]{background:var(--platine);color:#000}

/* ventes : chiffres en lignes, journal jour par jour */

.vue-vendeur .page-vendeur .chiffres > .chiffre:last-child:nth-child(odd){grid-column:auto}

.vue-vendeur .journal .j-vente:has(+ .j-jour),.vue-vendeur .journal .j-vente:last-child{border-radius:0 0 20px 20px}
.vue-vendeur .journal .j-jour + .j-vente:has(+ .j-jour),.vue-vendeur .journal .j-jour + .j-vente:last-child{border-radius:20px}

.vue-vendeur .journal .quoi{color:var(--platine)}

.vue-vendeur .journal .suppr{width:40px;height:40px;border:0;background:none;color:#6A6D75}
.vue-vendeur .lot,.vue-vendeur .cout-l{border-color:var(--i-sep)}
.vue-vendeur .lot{border:0;border-radius:18px;background:var(--i-cell-h)}

/* barre d'onglets flottante et bouton « + » */
.mode-vendeur .console{padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}

.mode-vendeur .onglets{height:64px;max-width:none;margin:0 78px 0 0;padding:4px;border:1px solid rgba(255,255,255,.1);border-radius:32px;background:rgba(30,30,33,.72);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 10px 30px rgba(0,0,0,.45)}

.mode-vendeur .a-publier{max-width:none;margin:0 0 10px;padding:.45rem .45rem .45rem 1rem;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:rgba(44,44,48,.92);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:.9rem}

.mode-vendeur .toast{bottom:calc(6.4rem + env(safe-area-inset-bottom,0px))}

/* bandeau « Vente enregistrée », avec Annuler */
.bandeau-vente{position:fixed;z-index:61;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:.75rem;max-width:560px;margin:0 auto;padding:.5rem .5rem .5rem .8rem;border:1px solid rgba(255,255,255,.1);border-radius:33px;background:rgba(44,44,48,.95);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 12px 34px rgba(0,0,0,.55);color:var(--platine)}

.bv-ic{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#0B1A12}

/* feuilles (vente, fiche complète, réglages, photo) */
.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion){border:1px solid rgba(255,255,255,.06);border-radius:28px;background:#1C1C1E}
.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .fen-tete h2{font:600 1.25rem/1.25 var(--i-ui)}
.mode-vendeur dialog:is(.vente-dlg,.edition,.photo):not(.connexion) .fermer{border:0;background:#2C2C2F}

.feuille-tete{display:grid;grid-template-columns:4.8rem minmax(0,1fr) 4.8rem;align-items:center;gap:.4rem}

.mode-vendeur .vs-mode{min-height:38px;overflow:hidden;border-radius:999px;color:var(--platine);font:500 .88rem var(--i-ui);text-overflow:ellipsis;white-space:nowrap}

.mode-vendeur .vs-produit .plaque{aspect-ratio:1;border-radius:12px}
.mode-vendeur .vs-produit h3{font:600 1.06rem/1.25 var(--i-ui)}
.mode-vendeur .vs-produit .maison{font-size:.82rem;color:var(--fumee)}
.mode-vendeur .vs-tailles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:16px;background:var(--i-champ)}
.mode-vendeur .vs-taille{min-width:0;justify-items:center;padding:.5rem .3rem;border:0;border-radius:13px;background:transparent;color:var(--platine);text-align:center}
.mode-vendeur .vs-taille b{font-weight:600;color:var(--platine)}
.mode-vendeur .vs-taille span{font-size:.82rem;color:var(--argent)}
.mode-vendeur .vs-taille[aria-pressed="true"]{background:#5C5C62;color:var(--platine);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mode-vendeur .vs-taille[aria-pressed="true"] :is(b,span){color:var(--platine)}
.mode-vendeur .vs-p b{font:500 .88rem/1.2 var(--i-ui)}
.groupe-ios.formulaire{border-radius:20px;background:#2A2A2D;overflow:hidden}
.gi-ligne{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:52px;margin-left:1rem;padding:.3rem .75rem .3rem 0}
.gi-ligne + .gi-ligne{border-top:1px solid var(--i-sep)}
.gi-ligne label{flex:none;color:var(--platine);font-size:1rem}
.gi-ligne input{flex:1;width:0;min-width:0;padding:.4rem 0;border:0;background:transparent;color:var(--platine);font:16px var(--i-ui);text-align:right;outline:none}

.gi-ligne #v-prix{font-weight:600;font-size:17px}

.gi-ligne .pas{flex:none;gap:0;border-radius:18px;background:var(--i-champ)}
.gi-ligne .pas .rond{width:44px;height:38px;border:0;border-radius:0;background:none;color:var(--platine);font-size:1.35rem}
.gi-ligne .pas input{flex:none;width:2.2rem;min-width:2.2rem;padding:0;text-align:center;font-weight:600}
.mode-vendeur dialog.vente-dlg .v-remise{padding:0 1rem}
.v-apres{display:grid;gap:.45rem;padding:.8rem 1rem;border-radius:20px;background:#2A2A2D}
.v-apres:has(.v-fiole[hidden]){padding:0 1rem;background:none}
.v-fiole{position:relative;display:grid;gap:.4rem}
.v-fiole[hidden]{display:none}
.v-fiole::before{content:"";position:absolute;left:0;top:7px;width:10px;height:10px;border-radius:2px;background:#6A6D75}
.vf-tube{position:relative;display:block;height:24px;margin-left:11px;border:1.5px solid rgba(244,245,247,.55);border-radius:4px 12px 12px 4px;overflow:hidden}

.mode-vendeur .vs-pied{background:linear-gradient(180deg,rgba(28,28,30,0),#1C1C1E 1.2rem)}
.mode-vendeur .vs-groupe-barre{border:0;border-radius:18px;background:#2A2A2D}
@media (prefers-reduced-motion:reduce){.bandeau-vente.vient{animation:none}.ls-contenu{transition:none}}
/* blocs des onglets : le même espace entre chaque cadre */
.vue-vendeur :is(#v-dyn,#acc-dyn,#couts-zone){display:grid;gap:1.4rem;min-width:0}

/* la vente : un client, plusieurs parfums, offres appliquées toutes seules */
.vs-pied[hidden],.vp-offres[hidden],.vp-offre-ligne[hidden]{display:none}

.vs-nb.vient{animation:nb-vient .4s cubic-bezier(.2,.8,.2,1)}
@keyframes nb-vient{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.mode-vendeur dialog.vente-dlg .vs-pied{bottom:-1.1rem;margin:0 -1rem -1.1rem;padding:1.4rem 1rem 1.1rem}

/* ===== vitrine façon app : barre flottante, « Ajouté », fiche et panier en feuilles ===== */

/* barre flottante : la carte, trouver, infos, et le panier rond */
.barre{left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));border:0;background:none;pointer-events:none}

.cv-l{display:flex;align-items:baseline;justify-content:space-between;margin:0;font-size:.94rem;color:var(--fumee)}
.cv-l b{font:700 1.4rem var(--i-ui);color:var(--or);font-variant-numeric:tabular-nums}
.cv-fiole{display:flex;align-items:center}
.cv-corps{position:relative;flex:1;height:36px;box-sizing:border-box;border:1.5px solid rgba(244,245,247,.5);border-radius:14px 9px 9px 14px;overflow:hidden}
.cv-jus{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#EBCB8B,#C9973F);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cv-col{width:10px;height:16px;box-sizing:border-box;border:1.5px solid rgba(244,245,247,.5);border-left:0}
.cv-bouchon{width:12px;height:24px;border-radius:3px;background:var(--platine)}
.cv-t{margin:0;color:var(--platine);font-size:.97rem}
.cv-t b{font-weight:600}
.cv-note{margin:0;font-size:.84rem;color:var(--fumee)}
.vue-vendeur .cv-carte .btn:disabled{background:#2C2C2F;color:#6A6D75;opacity:1}
.cv-aide{margin:-4px 0 0;text-align:center;font-size:.78rem;line-height:1.4;color:#6A6D75}
.cv-aide.gauche{margin:.5rem .4rem 0;text-align:left}
.cv-vide{margin:0;padding:1rem;border-radius:20px;background:var(--i-cell);color:var(--fumee);font-size:.92rem}
.cv-liste{display:grid;margin:0;padding:0;list-style:none;border-radius:20px;background:var(--i-cell);overflow:hidden}
.cv-liste > li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:64px;padding:0 14px 0 0}
.cv-liste > li + li{border-top:1px solid var(--i-sep)}
.cv-ouvrir{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:12px;min-width:0;min-height:64px;padding:8px 0 8px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left}
button.cv-ouvrir:active{opacity:.7}
.cv-img{display:block;width:44px;height:44px;box-sizing:border-box;padding:3px;border-radius:10px;background:#FFFFFF;overflow:hidden}
.cv-img img{display:block;width:100%;height:100%;object-fit:contain}
.cv-txt{min-width:0;line-height:1.3}
.cv-txt b{display:block;overflow:hidden;font-weight:600;color:var(--platine);text-overflow:ellipsis;white-space:nowrap}
.cv-txt small{display:block;font-size:.82rem;color:var(--fumee)}
.cv-txt small.retard{color:var(--bas)}
.cv-etat{padding:3px 10px;border-radius:12px;background:rgba(140,195,163,.16);color:var(--ok);font-size:.82rem;font-weight:600}
.cv-bouton{min-height:36px;padding:0 13px;border:0;border-radius:18px;background:rgba(224,164,88,.18);color:#E0A458;font:600 .84rem var(--i-ui);white-space:nowrap}
.cv-bouton:disabled{opacity:.5}
.cv-res.fini .cv-txt b{color:var(--argent)}
.cv-achat{font-weight:600;color:var(--platine);font-variant-numeric:tabular-nums}
.cv-cmd{display:grid;gap:6px}
.cv-cmd + .cv-cmd{margin-top:12px}
.cv-cmd-t{display:flex;justify-content:space-between;gap:1rem;margin:0 .4rem 0 1.25rem;font-size:.82rem;color:var(--fumee)}
.cv-cmd-t span:first-child{color:var(--argent);font-weight:600}
.cv-plie{border-radius:20px}
.cv-plie > summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:52px;padding:0 1rem;border-radius:20px;background:var(--i-cell);color:var(--platine);font-weight:600;list-style:none;cursor:pointer}
.cv-plie > summary::-webkit-details-marker{display:none}
.cv-plie > summary span{font-weight:400;font-size:.88rem;color:var(--fumee)}
.cv-plie[open] > summary{margin-bottom:8px}
.cv-prod .interrupteur{gap:0}
.cv-info{margin:0;padding:.7rem 1rem;border-radius:14px;background:rgba(227,185,111,.09);color:#E8D9B8;font-size:.9rem}
.gi-ligne select{flex:1;width:0;min-width:0;padding:.4rem 0;border:0;background:transparent;color:var(--platine);font:16px var(--i-ui);text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none;outline:none}
.gi-ligne select:disabled{color:var(--argent);opacity:1}
.gi-bascule{cursor:pointer}
.gi-bascule > span:first-child{color:var(--platine)}
dialog.cv-dlg .cv-liste{background:#2A2A2D}
dialog.cv-dlg .vp-total{display:flex;justify-content:space-between;align-items:baseline;margin:0 .3rem;color:var(--platine)}
dialog.cv-dlg .vp-total b{font-size:1.4rem}
dialog.cv-dlg .vp-total small{display:block;font-size:.8rem;color:var(--fumee)}
.cmd-liste small.cmd-res{display:block;color:var(--or)}

/* ================= l'onglet « Sur commande » : un écran à part ================= */
.page-cmd{padding-bottom:7rem}
.vue-cmd{padding-top:max(1.6rem,calc(env(safe-area-inset-top,0px) + .8rem));padding-bottom:0}
.vue-cmd .cmd-tete h1{margin:0;font:500 clamp(2.3rem,10vw,3rem)/1.05 var(--f-titre)}
.vue-cmd > *{min-width:0}
@media (min-width:760px){.vue-cmd .cmd-jauge,.vue-cmd .cmd-etapes{max-width:560px}}
/* la jauge se remplit à l'arrivée sur l'onglet */
@media (prefers-reduced-motion:no-preference){
  .vue-cmd .cmd-jus{animation:jauge 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
  .vue-cmd .cmd-tuile{animation:cmd-monte .5s cubic-bezier(.2,.8,.2,1) both}
  .vue-cmd .cmd-tuile:nth-child(2){animation-delay:.05s}
  .vue-cmd .cmd-tuile:nth-child(3){animation-delay:.1s}
  .vue-cmd .cmd-tuile:nth-child(4){animation-delay:.15s}
}
@keyframes cmd-monte{from{opacity:0;transform:translateY(10px)}}
/* les maisons restent sous la main en faisant défiler la grille */
.cmd-puces-zone{position:sticky;top:0;z-index:20;min-width:0;margin:0 calc(50% - 50vw);padding:max(10px,env(safe-area-inset-top,0px)) 0 10px}
.cmd-puces-zone::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(7,7,7,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .2s}
.cmd-puces-zone .cmd-puces{margin:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px),calc((100vw - 1180px) / 2 + 16px));scroll-padding-inline:max(16px,calc((100vw - 1180px) / 2 + 16px))}
.page.page-cmd{padding-left:0;padding-right:0}
.cmd-rayon{display:grid;gap:18px;min-width:0}
.page-cmd{overflow-x:clip}
.cmd-faq{margin-top:1.6rem}
.cmd-faq > h2{font-size:clamp(1.5rem,6vw,2rem)}
.cmd-retour{justify-self:start;display:inline-flex;align-items:center;gap:2px;min-height:44px;margin:-.7rem 0 -.5rem -.5rem;padding:0 .6rem 0 .1rem;border:0;background:none;color:var(--platine);font:400 1rem var(--f-texte)}
.cmd-retour svg{width:24px;height:24px}
.cmd-fin{justify-self:center;margin-top:.6rem}
.menu-lien.menu-cmd{display:inline-flex;align-items:center;gap:.35rem;color:var(--or)}
.menu-cmd svg{width:15px;height:15px}
/* dans la carte : l'entrée vers l'onglet */
.cmd-entree{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;margin:1.4rem 0 .4rem;padding:12px 14px 12px 12px;border:1px solid rgba(227,185,111,.28);border-radius:20px;background:linear-gradient(120deg,rgba(227,185,111,.12),rgba(21,21,23,.92) 55%);color:var(--argent);text-align:left;font:inherit}
.cmd-entree:active{transform:scale(.99)}
.cmd-entree-img{display:flex}
.cmd-entree-img span{display:block;width:44px;height:56px;padding:3px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.cmd-entree-img span + span{margin-left:-18px}
.cmd-entree-img span:nth-child(2){transform:translateY(-4px)}
.cmd-entree-img img{display:block;width:100%;height:100%;object-fit:contain}
.cmd-entree-t{display:grid;gap:1px;min-width:0}
.cmd-entree-t small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--or)}
.cmd-entree-t b{font:500 1.2rem/1.2 var(--f-titre);color:var(--platine)}
.cmd-entree-t > span{font-size:.84rem;line-height:1.35;color:var(--fumee)}
.cmd-entree-p{display:grid;place-items:center;min-width:52px;height:30px;padding:0 10px;border-radius:15px;background:rgba(227,185,111,.16);color:var(--or);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums}

/* tuiles sur commande : le prix en parfumerie toujours sous le prix, pour des tuiles régulières */
.cmd-tuile .cmd-p{flex-direction:column;align-items:flex-start;gap:1px}

/* ================= Sur commande : un début plus clair ================= */
.cmd-comment{display:grid;gap:12px;max-width:560px;padding:16px 16px 14px;border:1px solid var(--filet);border-radius:22px;background:rgba(21,21,23,.92)}
.cmd-comment > h2{margin:0;font:500 1.35rem/1.2 var(--f-titre);color:var(--platine)}
.cmd-pas{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.cmd-pas li{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;gap:12px}
.cmd-pas-n{display:grid;place-items:center;width:30px;height:30px;border-radius:15px;background:var(--platine);color:#000;font-weight:600;font-size:.88rem}
.cmd-pas b{display:block;margin-top:4px;font-weight:600;color:var(--platine)}
.cmd-pas p{margin:2px 0 0;font-size:.9rem;line-height:1.45;color:#A9ACB3}
.cmd-garantie{display:flex;align-items:center;gap:10px;margin:2px 0 0;padding:10px 12px;border-radius:14px;background:rgba(140,195,163,.1);color:#CFE6D8;font-size:.88rem;line-height:1.35}
.cmd-garantie > span{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:12px;background:rgba(140,195,163,.2);color:var(--ok)}
.cmd-garantie svg{width:15px;height:15px}
/* la commande groupée : une barre simple */
.cmd-barre{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.cmd-barre .cmd-jus{position:static;display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--or-fonce),#EBCB8B);box-shadow:none}
.cmd-jauge-l span{font-weight:500}
.cmd-jauge-l b{font-size:1.5rem}
/* l'entrée de la carte : une flèche, plus de pourcentage */
.cmd-entree-fl{display:block;width:16px;height:16px;color:var(--or)}
.cmd-entree-fl svg{display:block;width:100%;height:100%}
/* la feuille d'un flacon (vendeur) */
.cf-tete{display:flex;align-items:center;gap:12px;margin:0 .3rem}
.cf-tete p{margin:0;color:var(--argent);font-size:.94rem}
.cf-calc{display:grid;border-radius:16px;background:#2A2A2D;overflow:hidden}
.cf-calc:empty{display:none}
.cf-calc p{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin:0 0 0 1rem;padding:0 1rem 0 0;color:var(--platine);font-size:.95rem}
.cf-calc p + p{border-top:1px solid var(--i-sep)}
.cf-calc b{font-weight:600;font-variant-numeric:tabular-nums}
.cf-calc b.pos{color:var(--ok)}
.cf-calc b.bas{color:var(--bas)}
.cv-prod .cv-ouvrir{cursor:pointer}

/* ================= réserver plusieurs flacons pour un client (vendeur) ================= */
.cv-liste > li.cv-groupe{display:block;padding:0}
.cv-g-tete{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:12px 14px 6px}
.cv-g-tete .cv-txt b{font-size:1.02rem}
.cv-prive{display:flex;align-items:center;gap:4px}
.cv-prive svg,.nr-pv svg{flex:none;width:13px;height:13px}
.cv-g-liste{display:grid;margin:0 0 6px;padding:0;list-style:none}
.cv-g-liste li{margin-left:14px;border-top:1px solid var(--i-sep)}
.cv-g-liste .cv-ouvrir{width:100%;min-height:56px;padding:6px 14px 6px 0}
.cv-g-liste .cv-img{width:36px;height:36px}
.cv-g-liste .cv-ouvrir{grid-template-columns:36px minmax(0,1fr)}
/* la feuille « Réserver » */
dialog.nr-dlg .recherche-zone{margin:0}
.nr-liste > li{min-height:60px}
.nr-liste .cv-ouvrir{min-height:60px}
.nr-p.pris{background:rgba(227,185,111,.08)}
.nr-ajout{display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:19px;background:rgba(255,255,255,.1);color:var(--platine)}
.nr-ajout svg{width:20px;height:20px}
.nr-qte{display:flex;align-items:center;border-radius:19px;background:var(--i-champ)}
.nr-qte button{width:40px;height:38px;padding:0;border:0;background:none;color:var(--platine);font-size:1.3rem;line-height:1}
.nr-qte b{min-width:18px;text-align:center;font-weight:600;color:var(--platine)}
.nr-rien{display:block!important;padding:1rem;color:var(--fumee)}
.nr-recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.nr-recap p{display:grid;gap:1px;margin:0;padding:8px 10px;border-radius:12px;background:#2A2A2D}
.nr-recap span{display:flex;align-items:center;gap:4px;font-size:.76rem;color:var(--fumee)}
.nr-recap b{font-size:1.06rem;font-weight:600;color:var(--platine);font-variant-numeric:tabular-nums}
.nr-recap .nr-ac b{color:var(--or)}
.nr-recap .nr-pv{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nr-vide{margin:0;text-align:center;color:var(--fumee);font-size:.9rem}
.nr-actions{display:flex;gap:10px}
.nr-actions .btn{flex:1}
.nr-copie{flex:none;display:grid;place-items:center;width:52px;height:52px;padding:0;border:0;border-radius:26px;background:rgba(255,255,255,.1);color:var(--platine)}
.nr-copie svg{width:22px;height:22px}
.nr-copie:disabled{opacity:.4}


/* ================= finitions visuelles =================
   Une seule forme pour les actions (la pilule), des libellés en italique plutôt qu'en capitales,
   des écrans qui ne gardent que ce qui sert. */
/* les boutons : en pilule partout, comme dans les feuilles */
.btn{border-radius:999px}
.btn:not(.petit){min-height:48px}
.ouverture .actions .btn{min-width:15.5rem}
/* le bandeau du haut : une ligne */
.annonce{padding-block:.55rem}
.annonce-txt{font-size:.78rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* le panier rond : aligné sur le contenu à l'ordinateur */
@media (min-width:860px){.barre{max-width:calc(1180px + 2rem)}}
/* la fiche : barre de titre quand on fait défiler */
.fiche-barre{display:none}
@media (max-width:859px){
  dialog.produit.feuille .fiche-barre{position:absolute;z-index:1;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:76px;padding:0 74px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(14,14,16,.92);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);opacity:0;pointer-events:none;transition:opacity .22s ease}
  dialog.produit.feuille .fiche-barre span{overflow:hidden;font:500 1.12rem/1.2 var(--f-titre);color:var(--platine);text-overflow:ellipsis;white-space:nowrap;transform:translateY(4px);transition:transform .22s ease}
  dialog.produit.feuille.replie .fiche-barre{opacity:1}
  dialog.produit.feuille.replie .fiche-barre span{transform:none}
  dialog.produit.feuille.replie :is(.fermer,.partager-rond){border-color:transparent;background:rgba(255,255,255,.08)}
}
@media (prefers-reduced-motion:reduce){.fiche-barre,.fiche-barre span{transition:none}}
/* les étages de notes : en italique, comme les sous-titres des maisons */
.etage-t{margin:0 0 .8rem;font:italic 400 1.05rem/1.2 var(--f-titre);letter-spacing:0;text-transform:none;color:var(--argent)}
/* les notes sans photo : une pastille de leur couleur, l'initiale en Bodoni */
.rond-note.sans{background:radial-gradient(130% 130% at 28% 20%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 38%,color-mix(in srgb,var(--c) 52%,#000) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 8px 18px rgba(0,0,0,.5)}
.rond-note.sans span{font:italic 400 2.05rem/1 var(--f-titre);color:#fff;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.rond-note.sans.clair span{color:#2A241C;opacity:.8;text-shadow:none}
/* les petites maisons : la dernière seule s'étale sur la ligne, texte à gauche, flacon à droite */
@media (max-width:759px){
  .petites-maisons > .bloc-maison:last-child:nth-child(odd){grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:.9rem;align-items:start}
  .petites-maisons > .bloc-maison:last-child:nth-child(odd) > .grille{grid-column:2;grid-row:1 / span 2}
  .petites-maisons > .bloc-maison:last-child:nth-child(odd) > .maison-tete{grid-column:1;grid-row:1;padding-top:.4rem}
}
/* l'entrée « Sur commande » : un mot en italique plutôt qu'une étiquette en capitales */
.cmd-entree-t small{font:italic 400 .95rem/1.2 var(--f-titre);letter-spacing:0;text-transform:none;color:var(--or)}
/* les flacons sur commande : un fond porcelaine plutôt qu'un blanc pur, la photo s'y fond */
.cmd-photo,.produit .cmd-plaque,.cmd-entree-img span{background:linear-gradient(165deg,#F2EFEA 0%,#E2DDD5 100%)}
.cmd-photo img,.produit .cmd-plaque > img,.cmd-entree-img img{mix-blend-mode:multiply}
.cmd-photo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.45)}
/* deux boutons empilés : la même largeur */
.bientot-carte .actions .btn,.final .actions .btn{min-width:15.5rem}


/* ================= modifier une réservation (vendeur) ================= */
.cv-g-ouvrir{display:block;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left}
.cv-g-ouvrir:active{opacity:.7}
.cv-chev{display:inline-block;width:13px;height:13px;margin-left:4px;vertical-align:-1px;color:#6A6D75}
.cv-chev svg{display:block;width:100%;height:100%}
.nr-moitie{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0;margin:-.35rem .4rem 0;font-size:.84rem;color:var(--fumee)}
.nr-moitie:empty{display:none}
.nr-moitie-b{min-height:34px;padding:0 12px;border:0;border-radius:17px;background:rgba(227,185,111,.16);color:var(--or);font:600 .82rem var(--i-ui)}
.nr-recap .nr-pv small{font-size:.74rem;color:var(--fumee)}
.nr-fixe{font-weight:600;color:var(--argent);padding-right:4px}
.nr-suppr{display:grid;justify-items:center}
.nr-suppr-b{min-height:44px;color:var(--epuise);text-decoration:none;font-size:.95rem}
.nr-recap .nr-reste small{font-size:.74rem;color:var(--fumee)}

/* une réservation : la carte se lit, le bouton « Modifier » l'ouvre */
.cv-ligne{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:12px;min-height:56px;padding:6px 14px 6px 0}
.cv-ligne .cv-img{width:36px;height:36px}
.cv-g-pied{display:flex;justify-content:flex-end;padding:2px 14px 12px}
.cv-modif{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border:0;border-radius:19px;background:rgba(255,255,255,.1);color:var(--platine);font:600 .88rem var(--i-ui)}
.cv-modif svg{width:16px;height:16px}
.cv-modif:active{background:rgba(255,255,255,.16)}

/* ================= précommandes clôturées ================= */
.cmd-cloture{display:grid;gap:10px;justify-items:start;max-width:560px;padding:16px;border:1px solid rgba(227,185,111,.35);border-radius:22px;background:linear-gradient(140deg,rgba(227,185,111,.12),rgba(21,21,23,.94) 60%)}
.cmd-cloture h2{margin:0;font:500 1.4rem/1.2 var(--f-titre);color:var(--platine)}
.cmd-cloture p{margin:0;font-size:.92rem;line-height:1.45;color:#C9C3B6}
.cmd-cloture .btn{margin-top:4px}
.cmd-ferme{margin:0;padding:10px 12px;border-radius:14px;background:rgba(227,185,111,.1);color:#E8D9B8;font-size:.9rem;line-height:1.4}
.cv-ferme{margin:0;padding:10px 12px;border-radius:14px;background:rgba(227,185,111,.1);color:#E8D9B8;font-size:.86rem;line-height:1.4}
.vue-vendeur .cv-carte .cv-cloture-b{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:var(--argent)}
.cv-cloture-conf p + p{margin-bottom:.4rem}
.cmd-acompte[hidden],.cmd-mini[hidden]{display:none}

/* ================= mode test : corrections ================= */
/* l'onglet Sur commande : le pied de page garde ses marges, comme sous la carte */
.page-cmd > .pied{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
/* iPhone : deux touches rapides sur un bouton (+, −, une taille) ne zooment plus la page */
button,a[href],label,summary,input,select,textarea,[role=button]{touch-action:manipulation}

/* ===== Signature « le flacon, puis ses formats » (frontend-design) =====
   Une seule idée forte : montrer le décant. Le vrai flacon à côté de ses formats, dessinés à l'échelle entre eux,
   en haut de page et dans le choix de taille (la fiole choisie se remplit). Ailleurs, on retire le décor. */

/* ouverture : l'emblème devient un sceau, le titre joue sur les deux échelles */
.ouverture{gap:.9rem;padding-block:1.6rem 3rem}
.ouverture .embleme.cuir{width:min(150px,36vw)}
@media (max-width:620px){.ouverture .embleme.cuir{width:min(118px,30vw)}}
.ouverture h1.titre-echelles{margin:.1rem 0 0;max-width:none;font:500 clamp(2.5rem,11.2vw,5.4rem)/.98 var(--f-titre);letter-spacing:-.018em;color:var(--platine)}
.titre-echelles .t-grand{display:block;white-space:nowrap}
.titre-echelles .t-petit{display:block;margin-top:.28em;font-size:.4em;font-weight:400;letter-spacing:.005em;line-height:1.1}
.ouverture .accroche{max-width:34ch;font-size:.98rem}

/* le décant montré */
.fj{position:relative;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:end;justify-content:center;column-gap:.2rem;width:100%;max-width:440px;margin:.2rem auto 0;padding:0;border:0;background:none;color:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.fj .fj-flacon{width:clamp(118px,32vw,160px);height:clamp(197px,53.4vw,267px);aspect-ratio:auto;border-radius:0;background:none;overflow:visible}
.fj .fj-flacon img{mix-blend-mode:lighten;-webkit-mask:radial-gradient(ellipse 46% 50% at 50% 50%,#000 62%,transparent 100%);mask:radial-gradient(ellipse 46% 50% at 50% 50%,#000 62%,transparent 100%)}
.fj-fioles{display:flex;align-items:flex-end;gap:clamp(.55rem,3vw,1rem);padding-bottom:.1rem}
.fj-f{display:grid;justify-items:center;gap:.15rem}
.fj-verre{display:flex;align-items:flex-end;justify-content:center;height:clamp(96px,28vw,128px)}
.fj-verre .flacon,.choix-fiole .flacon{overflow:hidden}
.fj-verre .flacon{height:calc(var(--hf) * 100%)}
.fj-ml{margin-top:.35rem;font-size:.78rem;line-height:1;color:var(--fumee);font-variant-numeric:tabular-nums;white-space:nowrap}
.fj-prix{font:500 1.2rem/1.1 var(--f-titre);color:var(--platine);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.fj-nom{grid-column:1/-1;margin-top:.7rem;font-size:.82rem;color:var(--fumee)}
.fj:focus-visible{outline:2px solid var(--platine);outline-offset:6px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){
  .fj-f .jus-niveau{animation:bp-remplir 1.2s cubic-bezier(.3,.75,.25,1) both;animation-delay:calc(1.1s + var(--i,0) * .28s)}
}
@keyframes bp-remplir{from{transform:translateY(100%)}to{transform:none}}

/* fiche : les formats à l'échelle ; celui choisi se remplit du jus */
.produit .choix:not(.unique) .choix-taille .choix-fiole{order:-1;display:flex;align-items:flex-end;justify-content:center;height:72px;margin:0 0 .55rem}
.choix-fiole .flacon{height:calc(var(--hf,1) * 100%)}
.choix-taille[aria-pressed="false"] .choix-fiole .jus-niveau{transform:translateY(100%)}
.choix-taille:disabled .choix-fiole{opacity:.3}
.produit .choix:not(.unique) .choix-taille{padding-top:.95rem}
.produit .choix:not(.unique) .choix-taille[aria-pressed="true"]{background:rgba(244,245,247,.07);box-shadow:inset 0 0 0 1px rgba(244,245,247,.75)}
.produit .choix:not(.unique) .choix-taille[aria-pressed="true"] :is(.t,.p){color:var(--platine)}
.produit .choix:not(.unique) .choix-taille[aria-pressed="true"] .u{color:var(--argent)}

/* moins de décor : plus de lettres fantômes derrière les maisons, plus de losanges entre les parties */
.monogramme,.ornement{display:none}


/* « Comment ça marche » : trois étapes, sans cartes à icônes */
.etapes{display:grid;gap:1.4rem;margin:.2rem 0 0;padding:0;list-style:none;counter-reset:etape}
.etapes li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);column-gap:.9rem;row-gap:.2rem;counter-increment:etape}
.etapes li::before{content:counter(etape);grid-row:1/span 2;font:400 2.5rem/.9 var(--f-titre);color:var(--argent);font-variant-numeric:lining-nums}
.etapes b{font:500 1.5rem/1.1 var(--f-titre);color:var(--platine)}
.etapes span{grid-column:2;max-width:42ch;color:var(--argent)}
@media (min-width:900px){.etapes{grid-template-columns:repeat(3,minmax(0,1fr));gap:2rem}}

/* repère de prix sous le choix de taille */
.economie b{font-weight:500;color:var(--platine);font-variant-numeric:tabular-nums}

/* ===== Apple, version décant (25 octobre 2026) =====
   Noir pur, la police de l'iPhone, de grands titres, beaucoup d'air et une seule sorte de carte.
   L'or ne sert qu'aux liens et au bouton principal. Plus de cuir en fond, plus de titres chromés. */
:root{
  --f-titre:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  --f-texte:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  --a-gris:#161617;--a-carte:#1C1C1E;--a-carte2:#2C2C2E;--a-texte:#F5F5F7;--a-sous:#A1A1A6;--a-trait:rgba(255,255,255,.14);--a-or:#E3B96F;
  --feuille:#000;--platine:#F5F5F7;--argent:#D2D2D7;--fumee:#A1A1A6;--filet:rgba(255,255,255,.14);
}
body{background:#000;color:var(--a-texte);font:400 17px/1.47 var(--f-texte);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
body::before,body::after,.lustre{display:none}
:focus-visible{outline-color:var(--a-or)}
.chrome{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--a-texte)}

/* boutons : pilules, l'or pour l'action principale */
.btn{border-radius:999px;border-color:var(--a-trait);padding:.75rem 1.4rem;font-weight:600;letter-spacing:-.01em;color:var(--a-texte)}
.btn.plein{background:var(--a-or);border-color:var(--a-or);color:#000}
.btn.large{border-radius:14px}
.btn.discret{border-color:var(--a-trait);color:var(--a-texte)}
.lien-fleche{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;color:var(--a-or);font:400 1.06rem var(--f-texte);text-decoration:none}
.lien-fleche::after{content:"›";margin-left:.3em;font-size:1.2em;line-height:1}

/* en-tête : verre dépoli, rayons en pilules */
.entete{background:rgba(0,0,0,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--a-trait)}
.marque{font:600 1.06rem/1 var(--f-texte);letter-spacing:-.01em;color:var(--a-texte)}
.marque img{width:30px;height:30px}
.recherche-haut input{height:2.25rem;border:0;border-radius:10px;background:var(--a-carte);color:var(--a-texte)}
.recherche-haut input:focus{border:0;background:var(--a-carte2);box-shadow:0 0 0 2px rgba(227,185,111,.5)}
.menu-in{gap:.5rem;padding-block:.15rem .65rem}
.menu-lien{padding:.5rem .95rem;border:0;border-radius:999px;background:var(--a-carte);color:var(--a-texte);font:500 .94rem var(--f-texte);letter-spacing:-.01em}
.menu-lien[aria-current="true"]{background:var(--a-texte);color:#000;border:0}
.menu-lien.menu-cmd{color:var(--a-or)}
.menu-lien.menu-cmd[aria-current="true"]{color:#000}
.annonce{background:var(--a-gris);border-bottom:0}
.annonce-txt{font-size:.82rem;letter-spacing:0;color:var(--a-sous)}

/* l'ouverture : un sceau, le titre en deux lignes, une phrase, le prix d'entrée, la grande photo */
.ouverture{gap:0;padding-block:2.6rem 0;background:none}
.ouverture .embleme-zone{display:block;margin:0 auto 1.1rem}
.ouverture .embleme,.ouverture .embleme.cuir{width:72px;box-shadow:none}
@media (max-width:620px){.ouverture .embleme.cuir{width:64px}}
.embleme-zone .reflet{display:none}
.sur-titre{margin:0 0 .45rem;font:600 1.06rem var(--f-texte);letter-spacing:-.01em;color:var(--a-or)}
.ouverture h1{max-width:none;margin:0;font:700 clamp(2.7rem,11.8vw,5rem)/1.03 var(--f-titre);letter-spacing:-.04em;color:var(--a-texte)}
.ouverture h1 span{display:block}
.ouverture .accroche{max-width:32ch;margin:1rem auto 0;font-size:1.16rem;line-height:1.42;color:var(--a-sous)}
.des-prix{margin:.85rem 0 0;font-size:1.06rem;font-weight:600}
.ouverture .actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem 1.6rem;margin-top:1.3rem}
.une{display:grid;justify-items:center;gap:.6rem;width:100%;max-width:560px;margin:2.2rem auto 0;padding:0;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
.une .plaque{width:100%;aspect-ratio:4/5;border-radius:0;background:#000}
@media (min-width:600px){.une .plaque{border-radius:22px}}
.une-txt{padding:0 16px .4rem;font-size:.88rem;color:var(--a-sous)}

/* « Choisis ton format. » */
.formats{padding:3.4rem max(16px,env(safe-area-inset-left,0px)) 3.6rem;background:var(--a-gris)}
.formats > *{max-width:760px;margin-inline:auto}
.formats h2{margin-block:0;font:700 clamp(1.9rem,8.2vw,2.8rem)/1.1 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.formats-sous{margin-block:.5rem 0;color:var(--a-sous);font-size:1.06rem}
.formats-liste{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:.6rem;margin-top:1.5rem}
.format-carte{display:grid;justify-items:center;align-content:start;gap:.1rem;padding:1.3rem .4rem 1.2rem;border-radius:18px;background:var(--a-carte);text-align:center}
.format-fiole{display:flex;align-items:flex-end;justify-content:center;height:7.2rem;margin-bottom:.7rem}
.format-fiole .flacon{height:calc(var(--hf,1) * 100%);width:auto;overflow:hidden}
.format-carte b{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--a-texte)}
.format-prix{font-size:.95rem;color:var(--a-texte)}
.format-usage{margin-top:.25rem;font-size:.8rem;line-height:1.3;color:var(--a-sous)}

/* la carte */
.carte{padding-top:3.4rem}
.carte-tete h2{font:700 clamp(1.9rem,8.2vw,2.8rem)/1.1 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.carte-tete p{font-size:1.06rem;color:var(--a-sous)}
.puces-maisons{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:1.2rem calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:.1rem max(16px,env(safe-area-inset-left,0px)) .2rem}
.puces-maisons::-webkit-scrollbar{display:none}
.puce-m{flex:none;min-height:40px;padding:.45rem .95rem;border:1px solid var(--a-trait);border-radius:999px;background:none;color:var(--a-texte);font:500 .92rem var(--f-texte)}
.puce-m[aria-pressed="true"]{background:var(--a-texte);border-color:var(--a-texte);color:#000}
.trouver{margin:1.6rem 0 1rem;padding:1.3rem 1.1rem 1.1rem;border:0;border-radius:22px;background:var(--a-carte)}
.trouver-tete h3{font:700 1.45rem/1.15 var(--f-titre);letter-spacing:-.025em;color:var(--a-texte)}
.trouver-tete p{color:var(--a-sous);font-size:.95rem}
.filtre-bloc h4{font:600 .95rem var(--f-texte);font-style:normal;letter-spacing:-.01em;color:var(--a-sous)}
.envie{border:0;border-radius:16px}
.envie-nom{font:600 1.08rem/1.2 var(--f-texte);letter-spacing:-.015em}
.saison{border:0;border-radius:14px;background:var(--a-carte2);color:var(--a-texte)}
.saison[aria-pressed="true"]{background:var(--a-texte);color:#000}
.quiz-entree{border:0;border-radius:16px;background:var(--a-carte2)}
.quiz-entree b{font:600 1.06rem var(--f-texte)}

/* les rayons : une seule grille, des cartes photo arrondies */
.rayon > .bloc-maison:first-child{padding-top:1.6rem}
.bloc-maison{padding-top:2.6rem;border-top:0}
.maison-tete{display:grid;gap:.15rem;margin:0 0 1rem;text-align:left}
.maison-tete h3{margin:0;font:700 1.5rem/1.15 var(--f-titre);letter-spacing:-.025em;color:var(--a-texte)}
.maison-tete .collection{margin:0;font:400 .95rem var(--f-texte);font-style:normal;color:var(--a-sous)}
.maison-tete .maison-texte{margin:.35rem 0 0;max-width:46ch;font-size:.95rem;color:var(--a-sous)}
.maison-tete .compte,.maison-tete .monogramme{display:none}
.grille,.grille.rangee,.grille.solo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.7rem .75rem;overflow:visible;margin:0;padding:0;-webkit-mask:none;mask:none}
@media (min-width:760px){.grille,.grille.rangee,.grille.solo{grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2rem 1.1rem}}
@media (min-width:1040px){.grille,.grille.rangee,.grille.solo{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grille .tuile,.grille.rangee .tuile{width:auto;flex:none}
.tuile{gap:.65rem}
.tuile .plaque,.plaque{border-radius:18px;background:#000}
.tuile-texte{gap:.1rem;padding:0 .1rem}
.tuile .nom{font:600 1.06rem/1.25 var(--f-texte);letter-spacing:-.015em;color:var(--a-texte)}
.tuile .maison{font:600 .8rem var(--f-texte);letter-spacing:0;text-transform:none;color:var(--a-sous)}
.accords-ligne{font-size:.85rem;color:var(--a-sous)}
.tuile .prix .tailles-ligne{font-size:.82rem;color:var(--a-sous)}
.tuile .prix b{font-weight:600;color:var(--a-texte)}
.drapeau{border:0;border-radius:999px;background:rgba(245,245,247,.92);color:#1D1D1F;font:600 .7rem/1.5 var(--f-texte);letter-spacing:0;text-transform:none}
.coffret,.offre{border:0;border-radius:22px;background:var(--a-carte)}

/* bientôt, pourquoi, questions, fin */
.bientot-carte{border:0;border-radius:22px;background:var(--a-carte)}
.bientot-carte::before{display:none}
.bientot-carte h2{font:700 clamp(1.6rem,7vw,2.3rem)/1.12 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.bientot-carte .sur{border:0;background:var(--a-carte2);color:var(--a-or)}
.bientot-liste li{border:0;background:var(--a-carte2);font:500 .92rem var(--f-texte);font-style:normal}
.service{gap:1.2rem;padding-block:3.4rem 0}
.service > h2{margin:0;font:700 clamp(1.9rem,8.2vw,2.8rem)/1.1 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.tuiles-service{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
@media (min-width:900px){.tuiles-service{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tuile-service{display:grid;align-content:start;gap:.35rem;padding:1.3rem 1.1rem;border:0;border-radius:22px;background:var(--a-carte);color:var(--a-texte);text-align:left}
.tuile-service.large{grid-column:span 2}
.tuile-service .icone{display:block;width:1.9rem;height:1.9rem;margin-bottom:.4rem;color:var(--a-or)}
.tuile-service .icone svg{width:100%;height:100%}
.tuile-service b{font:700 1.2rem/1.2 var(--f-titre);letter-spacing:-.02em}
.tuile-service p{margin:0;font-size:.92rem;line-height:1.42;color:var(--a-sous)}
.tuile-service .lien-fleche{min-height:0;margin-top:.3rem;font-size:.98rem}
.faq{margin-top:3.4rem}
.faq > h2{font:700 clamp(1.9rem,8.2vw,2.8rem)/1.1 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.faq details{border-bottom:1px solid var(--a-trait)}
.faq summary{padding:1.05rem 0;font:400 1.06rem/1.35 var(--f-texte);letter-spacing:-.01em;color:var(--a-texte)}
.faq summary::after{color:var(--a-or)}
.faq details p{color:var(--a-sous)}
.final{margin-top:3.4rem;padding:2.8rem 1rem;border:0;border-radius:22px;background:var(--a-carte)}
.final h2{font:700 clamp(1.7rem,7.5vw,2.4rem)/1.1 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.final p{color:var(--a-sous)}
.final + .pied{margin-top:2.2rem}
.pied{color:var(--a-sous);font-size:.82rem}
.pied-marque b{font:600 1.06rem var(--f-texte);color:var(--a-texte)}
.pied a{color:var(--a-or)}

/* la fiche : achat d'abord, puis « En bref », ce qu'on sent, les notes */
dialog.produit,dialog.produit .fen{background:#000}
.produit-info{gap:1.5rem}
.produit-tete .maison{margin:0;font:600 .95rem var(--f-texte);font-style:normal;letter-spacing:-.01em;text-transform:none;color:var(--a-sous)}
.produit-tete h2{font:700 clamp(2rem,8.6vw,2.7rem)/1.08 var(--f-titre);letter-spacing:-.035em;color:var(--a-texte)}
.produit-tete .meta{font-size:.95rem;color:var(--a-sous)}
.famille-ligne.odeur{align-items:flex-start;margin-top:.7rem;font-size:1.06rem;line-height:1.45;color:var(--a-sous)}
.famille-ligne.odeur .points{padding-top:.5rem}
.famille-ligne.odeur b{font-weight:600;color:var(--a-texte)}
.choix legend{font:600 1.06rem var(--f-texte);color:var(--a-texte)}
.choix-taille,.produit .choix:not(.unique) .choix-taille{border:1px solid var(--a-trait);border-radius:14px;background:var(--a-carte)}
.choix-taille[aria-pressed="true"],.produit .choix:not(.unique) .choix-taille[aria-pressed="true"]{border-color:var(--a-or);background:var(--a-carte);box-shadow:inset 0 0 0 1px var(--a-or)}
.choix-taille .p{font:600 1.2rem var(--f-texte);letter-spacing:-.02em;color:var(--a-texte)}
.choix-taille .t,.choix-taille .u{color:var(--a-sous)}
.choix-taille .tag{background:var(--a-or);color:#000}
.economie{padding:0;border:0;background:none;font-size:.92rem;color:var(--a-sous)}
.economie b{color:var(--a-texte)}
.retrait{display:grid;margin:0;padding:0;list-style:none;border-radius:16px;background:var(--a-carte)}
.retrait li{display:flex;align-items:flex-start;gap:.9rem;padding:.95rem 1rem}
.retrait li + li{border-top:1px solid var(--a-trait)}
.retrait .icone{flex:none;width:1.5rem;height:1.5rem;color:var(--a-or)}
.retrait .icone svg{display:block;width:100%;height:100%}
.retrait b{display:block;font-weight:600;font-size:.98rem;color:var(--a-texte)}
.retrait li > span:last-child > span{display:block;font-size:.9rem;color:var(--a-sous)}
.produit .section h3,.section > h3{margin:0 0 .3rem;font:700 1.55rem/1.15 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
.bref dl{margin:0}
.bref dl > div{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--a-trait)}
.bref dt{color:var(--a-sous)}
.bref dd{margin:0;text-align:right;color:var(--a-texte)}
.source{font-size:.8rem;color:var(--a-sous)}
.source a{color:var(--a-or)}
.fiche-pied{background:linear-gradient(rgba(0,0,0,0),#000 30%)}
.fiche-pied .btn{border-radius:14px}
.jumeau{border:0;border-radius:16px;background:var(--a-carte)}
.etage-t{font:600 .95rem var(--f-texte);font-style:normal;letter-spacing:-.01em;color:var(--a-sous)}
.achat-seul{font-size:.86rem;color:var(--a-sous)}
.achat-seul a{color:var(--a-or)}
.suggestions h3{font:700 1.55rem/1.15 var(--f-titre);letter-spacing:-.03em;color:var(--a-texte)}
/* sur iPhone, chaque rayon est une étagère qui défile sur le côté, comme l'Apple Store ; sur grand écran, une grille */
@media (max-width:759px){

/* Notes olfactives : présentation validée, sans aperçu tronqué. */

.produit .bp-notes-entete h3{margin:0;font:500 22px/1.15 var(--f-texte);letter-spacing:-.7px}

.produit .bp-notes-completes .notes-photos{display:block}
.produit .bp-notes-completes .etage{padding:0 0 13px;margin:0}

/* BlackPhantom — Atelier. Composants originaux adaptés au site existant. */
:root{--bp-ivory:#f0ece3;--bp-champagne:#c8b397;--bp-secondary:#a5a29c;--bp-hairline:#ffffff12}
body{background:#101011;color:var(--bp-ivory)}

.menu-in{max-width:1200px;padding-inline:24px;justify-content:center}

.drapeau.stock.bas{color:#8a5a00}.drapeau.stock.epuise{color:#a12a2a}

.bp-stock-summary button:not([data-f=tous])[aria-pressed="true"]{background:#eeeef3;color:#141418;border-color:#eeeef3}.bp-stock-summary button:not([data-f=tous])[aria-pressed="true"] span{color:#45454d}
.vue-vendeur .ls-prix{white-space:normal;overflow:visible;text-overflow:clip}
/* minimums iPhone (relecture du 27 octobre) : champs à 16 px (sinon zoom), textes à 11 px au moins */
.recherche-haut input,.entete .recherche-haut input{font-size:16px}
.tuile .maison,.accords-ligne,.tuile .prix .tailles-ligne,.tuile .pastille,.envie-compte,.format-usage,.bp-selection-copy small,.bp-selection-copy>span,.bp-hero .sur-titre,.bp-hero-edition,.bp-assurances>span,.bp-hero-caption small,.cmd-contexte,.bp-admin-brand small,.drapeau,.bp-eyebrow{font-size:11px}

/* ===== espace vendeur complet (28 octobre) : Plus, clients, commandes, statistiques, réassort, mise en avant, promos ===== */
.vue-vendeur :is(#g-res,#v-cmds):empty{display:none}

.g-retour{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 14px 0 6px;border:0;border-radius:999px;background:none;color:var(--platine);font:500 16px var(--i-ui)}
.g-retour svg{width:24px;height:24px}
.g-retour:active{background:rgba(255,255,255,.08)}

/* la page « Plus » */
.g-tuiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g-tuile{display:grid;align-content:start;gap:6px;min-height:132px;padding:16px;border:1px solid #ffffff0d;border-radius:18px;background:#19191c;color:var(--platine);text-align:left;font-family:var(--i-ui)}

.g-tuile-ic{display:grid;place-items:center;width:38px;height:38px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--bp-champagne,#c8b397)}
.g-tuile-ic svg{width:22px;height:22px}
.g-tuile b{font-size:15px;font-weight:600;line-height:1.25}
.g-tuile small{font-size:12px;line-height:1.45;color:var(--fumee)}
.g-liens{border-radius:18px;background:#19191c;overflow:hidden}
.g-lien{width:calc(100% - 1rem);border:0;background:none;color:var(--platine);font:400 16px var(--i-ui);text-align:left}
.g-lien > span:first-child{display:flex;align-items:center;gap:12px}
.g-lien svg{width:21px;height:21px;color:var(--argent)}
.g-lien .chevron svg{color:#5E616A}

/* recherche et contrôles segmentés */
.g-recherche{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:1px solid #ffffff12;border-radius:14px;background:#1c1c1f}
.g-recherche .icone{display:flex;width:18px;height:18px;color:var(--fumee)}
.g-recherche .icone svg{width:18px;height:18px}
.g-recherche input{flex:1;min-width:0;min-height:44px!important;padding:0;border:0!important;background:none!important;color:var(--platine);font:16px var(--i-ui)!important;outline:none}
.g-segments{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:12px;background:var(--i-champ)}
.g-segments button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 6px;border:0;border-radius:9px;background:none;color:var(--platine);font:500 13px var(--i-ui);white-space:nowrap}
.g-segments button[aria-pressed="true"]{background:#5C5C62;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.g-defile{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;border-radius:0;background:none;gap:8px}
.g-defile::-webkit-scrollbar{display:none}
.g-defile button{flex:none;min-height:38px;padding:0 15px;border-radius:999px;background:#1f1f22}
.g-defile button[aria-pressed="true"]{background:var(--bp-ivory,#f0ece3);color:#151515;box-shadow:none}
.g-num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12);font-size:11px;font-weight:600}

/* listes */
.g-liste{border-radius:18px;background:#19191c;overflow:hidden}
.dialog-g .g-liste,.mode-vendeur dialog .g-liste{background:#2A2A2D}
.g-ligne{width:calc(100% - 1rem);gap:12px;min-height:60px;border:0;background:none;color:var(--platine);font-family:var(--i-ui);text-align:left}
button.g-ligne:active{background:rgba(255,255,255,.05)}
button.g-ligne:disabled{opacity:1;cursor:default}
.g-txt{display:grid;flex:1;min-width:0;gap:2px}

.g-statut.s-prete{background:rgba(140,195,163,.16);color:var(--ok)}

.g-pastille{flex:none;background:rgba(227,185,111,.16);color:var(--bas)}
.g-pastille.att{background:rgba(160,180,240,.16);color:#B8C6F2}
.g-avatar{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:hsl(var(--h) 22% 30%);color:hsl(var(--h) 45% 88%);font:600 17px var(--i-ui)}

.g-plaque{flex:none;width:44px!important;aspect-ratio:1!important;border-radius:10px!important}
.g-vide{padding:2rem 1rem}
.g-mini{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:var(--platine);font:500 13px var(--i-ui)}

/* fiche client */

.g-lien-client{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 4px;border:0;border-radius:999px;background:rgba(255,255,255,.07);color:var(--platine);font:600 17px var(--i-ui)}

.g-actions2{display:grid}
.g-actions2 .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}

.g-bloc{display:grid;gap:8px}

.g-notes{margin:0;padding:12px 14px;border-radius:14px;background:#2A2A2D;color:var(--platine);font-size:15px;line-height:1.5;white-space:pre-line}
.g-pref{display:flex;flex-wrap:wrap;gap:6px;margin:0}

.btn.g-danger,.mode-vendeur .btn.g-danger{border-color:transparent;background:rgba(221,144,132,.12);color:var(--epuise)}

.g-champ input,.g-champ textarea{width:100%;padding:12px 14px;border:0;border-radius:14px;background:#2A2A2D;color:var(--platine);font:16px/1.45 var(--i-ui)}

.mode-vendeur .g-dlg .gi-ligne select{flex:1;min-width:0;max-width:62%;min-height:38px;padding:0 6px;border:0;background:transparent;color:var(--platine);font:16px var(--i-ui);text-align:right;text-align-last:right}
.mode-vendeur .g-dlg .gi-ligne input[type=time]{flex:none;width:auto;padding:.4rem .7rem;border-radius:10px;background:var(--i-champ);text-align:center}

.gi-bascule input[type=checkbox]:not(.interrupteur input){flex:none;width:22px;height:22px;min-height:0!important;accent-color:var(--ok)}
.g-lignes li{align-items:baseline}
.g-apercu-msg{display:grid;gap:6px;width:100%;padding:14px;border:0;border-radius:16px;background:#2A2A2D;color:var(--platine);font-family:var(--i-ui);text-align:left}
.g-apercu-msg b{font-size:15px}
.g-apercu-msg span{font-size:14px;line-height:1.45;color:var(--argent)}
.g-apercu-msg small{display:inline-flex;align-items:center;gap:5px;color:var(--bp-champagne,#c8b397);font-size:13px;font-weight:600}
.g-apercu-msg small svg{width:15px;height:15px}
.g-diff{display:grid;gap:6px;margin:0;padding:0 0 0 18px;color:var(--argent);font-size:14px;line-height:1.45}

/* statistiques */
.g-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.g-kpi span{font-size:13px;color:var(--fumee)}
.g-kpi b{font:600 24px/1.15 var(--i-ui);letter-spacing:-.02em;color:var(--platine);font-variant-numeric:tabular-nums}
.g-kpi.grand b{font-size:34px}
.g-kpi small{font-size:12px;line-height:1.4;color:var(--fumee)}
.g-kpi small.pos{color:var(--ok)}

.g-graphe{display:block;width:100%;height:auto;overflow:visible}

.g-b-val{min-width:3.6rem;text-align:right;color:var(--argent);font-variant-numeric:tabular-nums}
.g-jauge{display:block;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}

.vue-vendeur .g-stats .tab{width:100%;font-size:14px}
.g-res-sec{display:grid;gap:6px;margin-top:10px}
.g-res-sec h4{margin:0 0 0 4px;font:600 13px var(--i-ui);text-transform:uppercase;letter-spacing:.02em;color:var(--fumee)}

/* messages */
.g-modele textarea{width:100%;padding:12px 14px;border:0;border-radius:14px;background:#26262a;color:var(--platine);font:16px/1.5 var(--i-ui)}

.g-modele .actions svg{width:16px;height:16px}

/* la feuille de vente : préparer comme commande */
.mode-vendeur dialog.vente-dlg .g-en-cmd{margin-top:8px}

/* carte publique : nouveautés et offres (jamais de prix barré) */

}
.g-modele .actions .g-ou{flex:1 1 12rem;margin:0;font-size:12px;line-height:1.45}
/* Sur commande : un nom long passe à la ligne au lieu d'être coupé (iPhone SE) */
.cv-txt b{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word}
/* « De retour en stock » : les deux boutons sous le nom, pour que le pseudo reste entier */
.g-att{flex-wrap:wrap;row-gap:8px;padding-block:10px}
.g-att-actions{display:flex;gap:8px;width:100%;padding-left:52px}

/* ---------- sur commande ----------
   Des flacons neufs que je commande chez mon fournisseur dès que la commande groupée atteint 500 € d'achat.
   Le client réserve avec 50 % d'acompte ; la page ne montre que le pourcentage de remplissage, jamais les prix d'achat. */
const cmdVisibles = () => ((ST.commande && ST.commande.produits) || []).filter(p => p.visible);
const ficheCmd = id => cmdVisibles().find(p => p.id === id) || null;
const acompteDe = prix => arrondi(prix / 2);
/* précommandes ouvertes ou clôturées par le vendeur */
const cmdOuvert = () => !(ST.commande && ST.commande.ferme);
/* une pièce sur commande vue comme un parfum, pour le panier et le journal des ventes */
function pieceCmd(id, toutes) {
  const c = toutes ? ((ST.commande && ST.commande.produits) || []).find(p => p.id === id) : cmdOuvert() ? ficheCmd(id) : null;
  if (!c) return null;
  return { id: c.id, nom: c.nom, maison: c.maison, type: 'commande', cmd: true, contenance: c.ml, prix: { [String(c.ml)]: c.prix }, stock: null, visible: true, statut: '', photo: c.photo, notes: c.notes, fragrantica: c.fragrantica, ficheSource: c.ficheSource, accords: [], saisons: [], moment: [] };
}
/* la commande groupée : une barre simple, des mots simples (pas de « flacon plein » qui se confond avec le parfum) */
const texteJauge = r => r >= 100 ? 'Elle est complète : je la passe très vite.'
  : r >= 60 ? 'Elle est presque complète : encore quelques réservations et elle part.'
  : r > 0 ? 'Elle se remplit au fil des réservations de mes clients.'
  : 'Elle démarre : les premières réservations la lancent.';
function jaugeCmd(r) {
  return `<section class="cmd-jauge" aria-labelledby="t-cmd-jauge"><p class="cmd-jauge-l"><span id="t-cmd-jauge">Prochaine commande groupée</span><b>${r} %</b></p>
    <span class="cmd-barre" role="img" aria-label="Remplie à ${r} %"><span class="cmd-jus" style="width:${r}%"></span></span>
    <p class="cmd-jauge-t">${texteJauge(r)}</p></section>`;
}
function grilleCmd() {
  const m = S.cmdMaison || '';
  return cmdVisibles().filter(p => !m || p.maison === m).map(p => `<button type="button" class="cmd-tuile" data-act="fiche-cmd" data-id="${esc(p.id)}" aria-label="${esc(p.nom)}, ${esc(p.maison)}, ${eur(p.prix)}, sur commande">
      <span class="cmd-photo">${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : ''}</span>
      <span class="cmd-m">${esc(court(p.maison))}, ${esc(ml(p.ml))}</span>
      <span class="cmd-n">${esc(p.nom)}</span>
      <span class="cmd-p"><b>${eur(p.prix)}</b>${p.ailleurs ? `<span>En parfumerie : ${eur(p.ailleurs)}</span>` : ''}</span>
    </button>`).join('');
}
/* l'onglet « Sur commande » : un écran à lui, comme dans une app ; la carte garde sa place quand on y revient */
const enCommande = () => S.vue === 'commande' && cmdVisibles().length > 0 && (!S.vendeur || S.onglet === 'boutique');
function faqCmd() {
  const q = [
    ['Comment réserver ?', cmdOuvert() ? `Touche un flacon, puis « Réserver » : il va dans ton panier. Touche « Commander sur Snapchat », ta demande est copiée : colle-la en message ${reseauxTexte()}. Je te dis comment régler l'acompte.`
      : `Les précommandes sont clôturées pour le moment. Écris-moi ${reseauxTexte()} : je te préviens dès qu'elles rouvrent.`],
    ['Pourquoi un acompte ?', "Je commande ton flacon exprès pour toi : l'acompte de 50 % réserve ta place dans la commande. Tu règles le reste quand tu le récupères."],
    ['Quand part la commande ?', "Dès que les réservations de tous mes clients remplissent la jauge : mon fournisseur ne livre qu'à partir d'un minimum. Je te préviens quand ton flacon est arrivé."],
    ['Et si elle ne part pas ?', `Si elle n'est pas partie dans les ${ST.commande.jours} jours après ton acompte, je te le rends. Un flacon peut aussi manquer chez mon fournisseur : dans ce cas aussi, ton acompte t'est rendu.`]
  ];
  return `<section class="faq cmd-faq" aria-labelledby="t-cmd-faq"><h2 id="t-cmd-faq">Questions</h2>${q.map(x => `<details><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}</section>`;

function vueCommande() {
  const L = cmdVisibles(), C = ST.commande;

  if (S.cmdMaison && !maisons.includes(S.cmdMaison)) S.cmdMaison = '';

    <nav class="cmd-barre-retour" aria-label="Navigation sur commande">

}
/* précommandes clôturées : on le dit tout de suite, et on dit comment être prévenu */
function blocClotureCmd() {
  const snap = lienSnap();
  return `<section class="cmd-cloture" role="status" aria-labelledby="t-cmd-cloture">
      <h2 id="t-cmd-cloture">Précommandes clôturées</h2>

/* comment ça marche : trois étapes en phrases, avec un exemple chiffré pris dans la sélection */
function blocEtapesCmd(L, C) {
  const prix = L.map(p => p.prix).sort((a, b) => a - b);
  const ex = prix[Math.floor(prix.length / 2)] || 160, a = acompteDe(ex);
  return `<section class="cmd-comment" aria-labelledby="t-cmd-comment">
      <h2 id="t-cmd-comment">Comment ça marche</h2>
      <ol class="cmd-pas">
        <li><span class="cmd-pas-n" aria-hidden="true">1</span><div><b>Tu réserves ton flacon</b><p>Tu payes la moitié du prix pour le réserver : c'est l'acompte. Pour un flacon à ${eur(ex)}, tu verses ${eur(a)}.</p></div></li>
        <li><span class="cmd-pas-n" aria-hidden="true">2</span><div><b>Je passe une commande groupée</b><p>Mon fournisseur ne livre qu'à partir d'un minimum. Je regroupe les réservations de mes clients et je commande dès qu'il est atteint.</p></div></li>
        <li><span class="cmd-pas-n" aria-hidden="true">3</span><div><b>Tu récupères ton flacon</b><p>Je te préviens quand il arrive. Tu payes le reste à ce moment-là${a ? ` (${eur(arrondi(ex - a))} dans l'exemple)` : ''}.</p></div></li>
      </ol>
      <p class="cmd-garantie"><span aria-hidden="true">${IC_COCHE}</span>Commande pas partie dans les ${C.jours} jours ? Ton acompte t'est rendu.</p>
    </section>`;
}
/* dans la carte : une entrée vers l'onglet, avec trois flacons */
function entreeCommande() {
  const L = cmdVisibles();
  if (!L.length || !cmdOuvert()) return '';
  const min = Math.min(...L.map(p => p.prix)), photos = L.filter(p => p.photo).slice(0, 3);
  return `<button type="button" class="cmd-entree" data-act="vue" data-v="commande">
      <span class="cmd-entree-img" aria-hidden="true">${photos.map(p => `<span><img src="${esc(p.photo)}" alt="" loading="lazy"></span>`).join('')}</span>
      <span class="cmd-entree-t"><small>Nouveau</small><b>Sur commande</b><span>${L.length} flacons neufs dans leur boîte, dès ${eur(min)}</span></span>
      <span class="cmd-entree-fl" aria-hidden="true">${ICV.suite}</span>
    </button>`;
}
/* la carte retrouve sa place au retour : on retient le bloc à l'écran et son décalage, pas un nombre de pixels
   (la carte se reconstruit, ses images et ses polices peuvent arriver un peu après) */
const SEL_ANCRES = '.ouverture, #carte, #trouver, .cmd-entree, .bloc-maison, #flacons, #miniatures, .petites-maisons, #bientot, #infos, .final, .pied';
function ancreCarte() {
  let a = null;
  document.querySelectorAll(SEL_ANCRES).forEach((e, i) => { const t = e.getBoundingClientRect().top; if (t <= innerHeight / 3) a = { i, dy: t }; });
  return a;
}
function revenirAncre(a) {
  const e = a && document.querySelectorAll(SEL_ANCRES)[a.i];
  if (!e) return;
  window.scrollTo(0, Math.max(0, Math.round(scrollY + e.getBoundingClientRect().top - a.dy)));
}
function changerVue(v, cible, histo) {
  if (v === 'commande' && !cmdVisibles().length) return;
  /* l'onglet déjà ouvert : on remonte en haut, comme sur iPhone */
  if ((v === 'commande') === enCommande()) {
    if (v === 'commande') { arreterDefil(); defiler(null); return; }
    return false;
  }
  arreterDefil();
  if (v === 'commande') S.ancre = ancreCarte();
  S.vue = v;
  S.navActif = v === 'commande' ? 'commande' : cible === 'trouver' ? 'trouver' : cible === 'infos' ? 'infos' : 'carte';
  rendre();
  /* l'onglet a sa propre page dans l'historique : le geste « retour » de l'iPhone ramène à la carte au lieu de quitter le site */
  if (v === 'commande' && !histo && !surClaude()) { try { history.pushState(null, '', location.pathname + location.search + '#sur-commande'); S.cmdPousse = true; } catch (e) { majAdresse('#sur-commande'); } }
  else majAdresse(v === 'commande' ? '#sur-commande' : '');
  if (v === 'commande') { window.scrollTo(0, 0); return; }
  const c = cible && document.getElementById(cible);
  window.scrollTo(0, 0);
  revenirAncre(S.ancre);
  if (c) { S.verrou = null; defiler(c); }
  else {
    /* encore une fois, une fois les images en place, si personne n'a bougé entre-temps */
    const y = scrollY, a = S.ancre;
    setTimeout(() => { if (!enCommande() && scrollY === y && !defil) revenirAncre(a); majNavFlot(); }, 400);
  }
  majNavFlot();
}

  ouvrir(`<button type="button" class="fermer" data-act="fermer" aria-label="Fermer">×</button>
    <div class="fiche-barre" aria-hidden="true"><span>${esc(c.nom)}</span></div>

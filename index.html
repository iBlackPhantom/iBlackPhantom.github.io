function aLaVue(els) {
  if (!('IntersectionObserver' in window) || sansMouvement()) return;
  els.forEach(el => {
    el.classList.add('attend');
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { el.classList.add('vu'); io.disconnect(); } }, { threshold: .35 });
    io.observe(el);
  });
}
/* ouverture en zoom : la photo de la vignette grandit jusqu'à la fiche (iPhone à jour ; sinon ouverture normale) */
const zoomPossible = () => typeof document.startViewTransition === 'function' && !sansMouvement();
const visibleALEcran = el => { if (!el || !el.isConnected) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth; };
function ficheEnZoom(el, id) {
  const src = el && el.querySelector && el.querySelector('.plaque');
  if (!zoomPossible() || !visibleALEcran(src)) { ouvrirFiche(id); return; }
  src.style.viewTransitionName = 'bp-flacon';
  document.documentElement.classList.add('vt-fiche');
  let t;
  try {
    t = document.startViewTransition(() => {
      src.style.viewTransitionName = '';
      ouvrirFiche(id);
      const pl = document.getElementById('fiche-plaque');
      if (pl) pl.style.viewTransitionName = 'bp-flacon';
    });
  } catch (e) { src.style.viewTransitionName = ''; document.documentElement.classList.remove('vt-fiche'); ouvrirFiche(id); return; }
  const fin = () => { const pl = document.getElementById('fiche-plaque'); if (pl) pl.style.viewTransitionName = ''; document.documentElement.classList.remove('vt-fiche'); };
  t.finished.then(fin, fin);
}
/* fermeture : la photo retourne dans sa vignette si elle est à l'écran */
function fermerEnZoom(fermeture) {
  const d = document.getElementById('dlg');
  const pl = d && d.classList.contains('produit') ? document.getElementById('fiche-plaque') : null;
  const cible = pl && S.ficheId ? [...document.querySelectorAll(`#app [data-act=fiche][data-id="${CSS.escape(S.ficheId)}"] .plaque`)].find(visibleALEcran) : null;
  if (!zoomPossible() || !visibleALEcran(pl) || !cible) { fermeture(); return; }
  pl.style.viewTransitionName = 'bp-flacon';
  document.documentElement.classList.add('vt-fiche');
  let t;
  try { t = document.startViewTransition(() => { pl.style.viewTransitionName = ''; fermeture(); cible.style.viewTransitionName = 'bp-flacon'; }); }
  catch (e) { pl.style.viewTransitionName = ''; document.documentElement.classList.remove('vt-fiche'); fermeture(); return; }
  const fin = () => { cible.style.viewTransitionName = ''; document.documentElement.classList.remove('vt-fiche'); };
  t.finished.then(fin, fin);
}

function champStock(el) {

  if (f === 'statut') {
    p.statut = ['rupture', 'bientot'].includes(el.value) ? el.value : '';
    modifie(); majResumeLigne(p);
    toast(p.statut === 'bientot' ? `${p.nom} s'affichera en « Bientôt disponible ». Publie pour le montrer.` : p.statut === 'rupture' ? `${p.nom} s'affichera en rupture. Publie pour le montrer.` : `${p.nom} suit à nouveau son stock.`);
    return;
  }
  const parPiece = el.dataset.unite === 'piece';
  const n = nombre(el.value);
  if (Number.isNaN(n) || (n != null && n < 0) || (parPiece && n != null && !Number.isInteger(n))) {
    el.setAttribute('aria-invalid', 'true');
    toast(f === 'stock' ? (parPiece ? 'Entre un nombre de pièces, par exemple 1.' : 'Entre un nombre de ml, par exemple 45.') : 'Entre un prix en euros, par exemple 30.');
    return;

  el.removeAttribute('aria-invalid');
  if (f === 'stock') { const v = n == null ? null : arrondi(parPiece ? n * p.contenance : n); if (p.stock === v) return; p.stock = v; }
  if (f === 'prix') {
    const s = String(el.dataset.s);

    if (n == null || n === 0) delete p.prix[s]; else p.prix[s] = arrondi(n);
    if (avant === prixDe(p, s)) return;
  }
  modifie();
  majResumeLigne(p);

/* bords de l'image sombres en moyenne : photo sur fond noir */
function fondSombre(img) {
  try {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let t = 0, n = 0;
    for (let i = 0; i < 32; i++) for (const [px, py] of [[i, 0], [i, 31], [0, i], [31, i]]) { const k = (py * 32 + px) * 4; t += d[k] * .2126 + d[k + 1] * .7152 + d[k + 2] * .0722; n++; }
    return t / n < 70;
  } catch (e) { return false; }
}
function traiterImage(fichier) {
  return new Promise((res, rej) => {
    if (!fichier || !/^image\//.test(fichier.type || 'image/')) { rej(new Error('type')); return; }
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      try {
        const W = 640, H = 800, marge = 0.05;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';
        if (fondSombre(img)) {
          /* photo de studio sur fond sombre : recadrée plein cadre, centrée, le bas conservé */
          const r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.fillStyle = '#000';
          x.fillRect(0, 0, W, H);
          x.drawImage(img, (W - w) / 2, H - h, w, h);
        } else {
          /* flacon détouré sur fond clair : posé au centre du plateau */
          x.fillStyle = '#ECECEA';
          x.fillRect(0, 0, W, H);
          const r = Math.min(W * (1 - 2 * marge) / img.naturalWidth, H * (1 - 2 * marge) / img.naturalHeight);
          const w = img.naturalWidth * r, h = img.naturalHeight * r;
          x.globalCompositeOperation = 'multiply';
          x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        }
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('lecture')); };
    img.src = url;
  });
}
function recevoirImage(fichier) {
  const err = document.getElementById('ph-err');
  if (err) err.textContent = '';
  traiterImage(fichier).then(data => {
    S.photoTemp = data;
    const a = document.getElementById('ph-apercu');
    if (a) a.innerHTML = `<img src="${data}" alt="Nouvelle photo">`;
    const b = document.getElementById('ph-ok');
    if (b) b.disabled = false;
  }, () => { if (err) err.textContent = "Cette image n'a pas pu être lue. Essaie une photo en JPEG ou PNG."; });
}

function enregistrerEditeur() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('e-err');
  const nom = v('e-nom');
  if (!nom) { err.textContent = 'Donne un nom au parfum.'; return; }
  const accords = document.getElementById('e-acc').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)(?:\s+(\d{1,3}))?$/);
    return m[2] ? { n: m[1].trim(), v: Math.min(100, Number(m[2])) } : { n: m[1].trim() };
  });
  const coches = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
  const annee = v('e-annee');
  const data = {
    maison: v('e-maison'), nom, collection: v('e-coll'), annee: /^\d{4}$/.test(annee) ? Number(annee) : annee, genre: v('e-genre'),
    fragrantica: /^https:\/\//.test(v('e-frag')) ? v('e-frag') : '', accords,
    notes: { tete: liste(v('e-tete')), coeur: liste(v('e-coeur')), fond: liste(v('e-fond')), plat: liste(v('e-plat')) },
    saisons: coches('e-saison'), moment: coches('e-moment'), saisonsVerifiees: document.getElementById('e-verif').checked,
    badge: v('e-badge'), prixFlacon: (nombre(v('e-pf')) > 0 ? arrondi(nombre(v('e-pf'))) : null), mlFlacon: (nombre(v('e-mf')) > 0 ? nombre(v('e-mf')) : null),
    type: ['miniature', 'flacon'].includes(v('e-type')) ? v('e-type') : '', statut: v('e-statut'), famille: v('e-fam'), mention: v('e-mention').slice(0, 160)
  };
  const ct = nombre(v('e-cont'));
  if (data.type === 'miniature') {
    if (!(ct > 0) || ct > 100) { err.textContent = 'Indique la contenance de la miniature en ml, par exemple 7,5.'; return; }
    data.contenance = arrondi(ct);
  } else if (data.type === 'flacon') {
    if (!(ct >= 15) || ct > 1000) { err.textContent = 'Indique la contenance du flacon en ml, par exemple 100.'; return; }
    data.contenance = arrondi(ct);
  } else data.contenance = null;
  const id = document.getElementById('edit').dataset.id;
  if (id) {
    const p = trouver(id);
    /* changement de contenance d'une pièce entière : le prix et le stock suivent */
    if (data.type && data.type === p.type && p.contenance !== data.contenance) {
      const px = prixDe(p, p.contenance), n = pieces(p);
      if (px != null) { delete p.prix[String(p.contenance)]; p.prix[String(data.contenance)] = px; }
      if (n != null) p.stock = arrondi(n * data.contenance);
    }
    Object.assign(p, normaliser({ parfums: [Object.assign({}, p, data)] }).parfums[0]);
  } else {
    const base = (data.type === 'miniature' ? 'mini-' : data.type === 'flacon' ? 'neuf-' : '') + (nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'parfum');
    let nid = base, i = 2;
    while (trouver(nid)) nid = base + '-' + i++;
    ST.parfums.push(normaliser({ parfums: [Object.assign({ id: nid, prix: {}, stock: null, visible: true, photo: '' }, data)] }).parfums[0]);
  }
  fermer(); modifie(); rendre();
  toast(id ? 'Fiche modifiée. Publie pour mettre la carte à jour.' : 'Parfum ajouté. Indique ses prix, puis publie.');
}

/* publication : la page se republie avec son nouvel état */
function construire() {
  const json = JSON.stringify(ST).replace(/</g, '\\u003c');
  const css = document.getElementById('bp-style').textContent;
  const code = document.getElementById('bp-code').textContent;
  return PREFIX + TETE + '<style id="bp-style">' + css + '</style>' + CORPS
    + '<script type="application/json" id="bp-data">' + json + '<' + '/script>'
    + '<script id="bp-code">' + code + '<' + '/script>' + SUFFIX;
}
function retenirApres(msg) {
  try { sessionStorage.setItem('bp-apres', JSON.stringify({ msg, onglet: S.onglet })); } catch (e) {}
}
function oublierApres() { try { sessionStorage.removeItem('bp-apres'); } catch (e) {} }
async function publier(msgOk) {
  if (S.hote === 'gh') return publierGh(msgOk);
  if (S.publication) return false;
  let art = null;
  try { art = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('artifact') : null; } catch (e) {}
  if (!art) { toast("La publication n'est pas disponible dans cette vue."); return false; }
  S.publication = true; rendreConsole();
  retenirApres(msgOk);
  const html = construire();
  try {
    try { await art.publish(html); }
    catch (e) {
      if (!e || e.code !== 'upstream_error') throw e;
      await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      await art.publish(html);
    }
    return true;
  } catch (e) {
    oublierApres();
    const c = e && e.code;
    if (c === 'conflict') toast('Une version plus récente existe. La page se recharge : refais ta dernière modification.');
    else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) toast("Ce compte ne peut pas publier la carte depuis cette vue.");
    else if (c === 'too_large') toast('La page est trop lourde. Retire une ou deux photos, puis réessaie.');
    else if (c === 'rate_limited') toast("Trop de publications d'affilée. Attends un peu, puis réessaie.");
    else toast("La publication n'a pas abouti. Réessaie dans un instant.");
    return false;
  } finally {
    S.publication = false; rendreConsole();
  }
}

function majPrixVente() {
  const V = S.vs, p = V && trouver(V.id);
  const champ = document.getElementById('v-prix'), info = document.getElementById('v-stock'), ok = document.getElementById('v-ok');
  if (!p || !champ || !info) return;
  const s = Number(V.taille);
  const q = Math.max(1, Math.floor(nombre(document.getElementById('v-qte').value) || 1));
  const px = prixDe(p, s);
  if (!S.prixManuel) champ.value = px != null ? String(arrondi(px * q)).replace('.', ',') : '';
  const total = nombre(champ.value);
  /* prix arrangé (un ami, un geste) : on rappelle le prix de la carte et la remise, avec de quoi y revenir */
  const rz = document.getElementById('v-remise');
  if (rz) {
    const carte = px != null ? arrondi(px * q) : null;
    let h = '';
    if (S.prixManuel && carte != null) {
      const brut = champ.value.trim();
      const lisible = brut && total != null && !Number.isNaN(total) && total >= 0;
      if (!brut) h = `<span>Prix de la carte : ${eur(carte)}. Tape le prix encaissé.</span>`;
      else if (!lisible) h = `<span class="err">Prix illisible : écris un nombre, par exemple 60.</span>`;
      else if (total < carte) h = `<span>Prix de la carte : ${eur(carte)}, remise de <b>${eur(arrondi(carte - total))}</b>.</span>`;
      else if (prixTropHaut(total, carte)) h = `<span class="err">Attention : bien plus que le prix de la carte (${eur(carte)}).</span>`;
      else if (total > carte) h = `<span>Prix de la carte : ${eur(carte)}.</span>`;
      if (h) h += `<button type="button" class="lien" data-act="vs-prix-carte">Remettre ${eur(carte)}</button>`;
    }
    rz.innerHTML = h; rz.hidden = !h;
  }
  const nG = groupe().length;
  if (ok && !ok.disabled) ok.textContent = texteTout(nG + 1, totalGroupe() + (total > 0 ? total : 0));
  const deja = dejaGroupe(p.id);
  const besoin = s * q + deja;
  const txt = v => estMini(p) ? nPieces(Math.round(v / p.contenance)) : ml(v);
  const ces = deja > 0 ? 'ces ventes' : 'cette vente';
  if (p.stock == null) info.textContent = `Stock non suivi pour ${p.nom}.`;
  else if (p.stock >= besoin - 1e-9) info.textContent = `Après ${ces} : ${txt(p.stock - besoin)} de ${p.nom}.`;
  else info.textContent = `Attention : il ne reste que ${txt(p.stock)} de ${p.nom}${deja > 0 ? `, dont ${txt(deja)} déjà en attente` : ''}. La vente reste possible, le stock passera à ${txt(0)}.`;
  const nf = estMini(p) ? null : (resteFioles(s) == null ? null : resteFioles(s) - fiolesGroupe(s));
  if (nf != null) info.textContent += nf >= q ? ` Flacons vides de ${s} ml : il en restera ${nf - q}.` : ` Attention : ${texteFioles(nf, s)} vide${nf > 1 ? 's' : ''} en stock.`;
}
/* Sur Claude, la carte retient les identifiants des ventes déduites (retirés de la vitrine).
   Sur le site, elle retient l'heure de la dernière vente déduite : stock et repère partent dans le même fichier. */
function appliquerVente(idVente, p, quantiteMl, suivi, creeLe) {
  if (p && suivi && p.stock != null) p.stock = Math.max(0, arrondi(p.stock - quantiteMl));
  if (S.hote === 'gh') { ST.deduitJusqua = Math.max(ST.deduitJusqua || 0, creeLe || 0); return; }
  ST.appliquees.push(idVente);
  if (ST.appliquees.length > 300) ST.appliquees = ST.appliquees.slice(-300);
}
const estDeduite = v => S.hote === 'gh' ? (v.creeLe || 0) <= (ST.deduitJusqua || 0) : ST.appliquees.includes(v.id);
/* Enregistre une ou plusieurs ventes d'un coup, retire les ml du stock, puis publie la carte.
   lignes : [{ p, taille, qte, prix, client?, date? }] ; renvoie { erreur } ou { ok } */
async function enregistrerVentes(lignes, client, date) {
  if (!S.db || S.dbEtat !== 'pret') return { erreur: ['sans-depot', 'public', 'erreur', 'absent'].includes(S.dbEtat) ? messageDb() : "Le journal des ventes n'est pas encore chargé. Patiente quelques secondes." };
  const t = Date.now();
  const ventes = lignes.map((l, i) => Object.assign({
    date: l.date || date, parfumId: l.p.id, nom: l.p.nom, maison: l.p.maison, taille: l.taille, qte: l.qte, ml: arrondi(l.taille * l.qte), prix: arrondi(l.prix),
    client: String(l.client != null ? l.client : client || '').trim().slice(0, 80), stockSuivi: l.p.stock != null, creeLe: t + i
  }, estMini(l.p) ? { format: estFlacon(l.p) ? 'flacon' : 'miniature' } : {}));
  if (S.hote === 'gh') {
    const avec = ventes.map(v => Object.assign({ id: 'v' + v.creeLe.toString(36) + Math.random().toString(36).slice(2, 6) }, v));

/* lit un message de commande collé : une ligne par parfum */
const sansAccents = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`´]/g, "'");
function lireCommande(texte) {
  const res = [], ignorees = [];
  const parfums = [...ST.parfums].sort((a, b) => b.nom.length - a.nom.length);
  String(texte || '').split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const n = sansAccents(l).replace(/^[•\-*·–\s]+/, '');
    if (/^(salut|bonjour|hello|coucou|total|remise|livraison|je voudrais|merci)/.test(n)) return;
    /* « miniature » ou « flacon neuf » dans la ligne : la pièce entière, sinon le décant du même nom */
    const veutMini = /\bmini(ature)?s?\b|\bflacons? neufs?\b/.test(n);
    const nc = colle(n);
    const cands = parfums.filter(x => nc.includes(colle(x.nom)));
    const p = cands.find(x => estMini(x) === veutMini) || cands[0];
    if (!p) { if (/\d\s*ml/.test(n)) ignorees.push(l); return; }
    const mt = n.match(/(\d+(?:[.,]\d+)?)\s*ml/);
    const taille = estMini(p) ? p.contenance : mt ? Number(mt[1].replace(',', '.')) : (tailles(p)[0] || ST.tailles[0]);
    const mq = n.match(/(?:×|\bx)\s*(\d+)\b/);
    const qte = mq ? Math.max(1, Number(mq[1])) : 1;
    const mp = n.match(/(\d+(?:[.,]\d{1,2})?)\s*€/);
    const prix = mp ? Number(mp[1].replace(',', '.')) : (prixDe(p, taille) || 0) * qte;
    res.push({ p, taille, qte, prix });
  });
  return { res, ignorees };
}

/* valeur relative d'un parfum : son prix de vente au ml, pris sur le format le plus proche de 30 ml
   (le même repère pour tous, sinon un parfum vendu seulement en grand format paraîtrait moins cher) */
function prixVenteMl(p) {
  const o = p ? tailles(p) : [];
  if (!o.length) return null;
  const s = o.reduce((m, t) => Math.abs(t - 30) < Math.abs(m - 30) || (Math.abs(t - 30) === Math.abs(m - 30) && t > m) ? t : m, o[0]);

/* coût du ml de chaque parfum d'un lot : le montant est réparti selon la valeur de vente (ou le volume) */
function repartirLot(L) {
  const items = (L.parfums || []).filter(i => i && i.ml > 0);
  if (!items.length || !(L.montant > 0)) return {};
  const poids = items.map(i => L.repartition === 'volume' ? 1 : prixVenteMl(trouver(i.id)));
  const connus = poids.filter(w => w > 0);
  const moy = connus.length ? connus.reduce((a, b) => a + b, 0) / connus.length : 1;
  const w = poids.map(x => x > 0 ? x : moy);
  const tot = items.reduce((t, i, k) => t + w[k] * i.ml, 0);
  const res = {};
  items.forEach((i, k) => { res[i.id] = L.montant * w[k] / tot; });

function coutUnitaire(id, couts) {
  const C = couts || S.couts;
  if (!C) return null;
  let euros = 0, mls = 0;
  const c = C.parfums && C.parfums[id];
  if (c && c.achat > 0 && c.ml > 0) { euros += c.achat; mls += c.ml; }
  (Array.isArray(C.lots) ? C.lots : []).forEach(L => {
    const it = (L.parfums || []).find(i => i.id === id);
    if (!it || !(it.ml > 0)) return;
    const r = repartirLot(L)[id];
    if (r != null) { euros += r * it.ml; mls += it.ml; }

      if (f && f.stock != null && n === resteFioles(ml)) { e.stock = f.stock; e.depuis = f.depuis || 0; }
      else { e.stock = n; e.depuis = maintenant; }
    }
    if (e.stock != null || e.prix != null) fioles.push(e);
  }
  const b = document.querySelector('[data-act="fl-ok"]'); if (b) b.disabled = true;
  try { await ecrireCouts(Object.assign({}, S.couts, { fioles })); toast('Stock de flacons enregistré.'); }
  catch (e) { err.textContent = S.hote === 'gh' ? messageGh(e, S.gh.prive) : "L'enregistrement a échoué. Réessaie."; if (b) b.disabled = false; return; }
  rendreFlacons();
}
/* « J'ai acheté des flacons » : ajoute au stock, met le prix à jour (moyenne), compte l'achat */
async function ajouterFioles() {
  const err = document.getElementById('fa-err');
  err.textContent = '';
  if (!S.db || !S.couts) { err.textContent = "Ton stock de flacons n'est pas encore chargé."; return; }
  const v = id => document.getElementById(id).value.trim();

  if (!(n > 0) || !Number.isInteger(n)) { err.textContent = 'Indique combien de flacons tu as achetés, par exemple 50.'; return; }
  if (Number.isNaN(montant) || (montant != null && montant < 0)) { err.textContent = 'Indique le prix payé en euros, par exemple 25.'; return; }
  const f = ficheFiole(ml), reste = resteFioles(ml) || 0;
  let prix = f && f.prix > 0 ? f.prix : null;
  if (montant > 0) prix = arrondi(prix != null && reste > 0 ? (reste * prix + montant) / (reste + n) : montant / n);
  const fioles = fiolesCouts().filter(x => Number(x.ml) !== ml).concat([{ ml, prix, stock: reste + n, depuis: Date.now() }]).sort((a, b) => a.ml - b.ml);
  const lots = montant > 0 ? [{ nom: `Flacons vides ${ml} ml × ${n}`, date: aujourdhui(), montant: arrondi(montant), repartition: 'prix', parfums: [] }, ...lotsCouts()] : lotsCouts();
  const b = document.querySelector('[data-act="fa-ok"]'); if (b) b.disabled = true;
  try { await ecrireCouts(Object.assign({}, S.couts, { fioles, lots })); }
  catch (e) { err.textContent = S.hote === 'gh' ? messageGh(e, S.gh.prive) : "L'enregistrement a échoué. Réessaie."; if (b) b.disabled = false; return; }
  S.flAjout = null;
  const carte = document.getElementById('fa-carte');

  else rendreFlacons();

}
/* proposer ou retirer un format sur la carte (public : il faut publier) */

function margeVente(v) {
  const cu = coutUnitaire(v.parfumId);
  if (cu == null) return null;
  return v.prix - (cu * v.ml + (venteEntiere(v) ? 0 : coutFiole(v.taille) * (v.qte || 1)));
}

function ligneJournal(v) {

async function deduireEnAttente() {
  const nd = nonDeduites();
  if (!nd.length) return;
  nd.forEach(v => appliquerVente(v.id, trouver(v.parfumId), v.ml || 0, v.stockSuivi, v.creeLe));

/* coûts : tableau de bord de l'investissement, lots, achats à l'unité */
function valeurStock() {
  let v = 0, comptes = 0, ignores = 0;
  ST.parfums.forEach(p => {
    const o = tailles(p);
    if (p.stock == null || !o.length) { if (p.stock !== 0) ignores++; return; }
    if (estMini(p)) v += pieces(p) * prixDe(p, p.contenance);
    else v += p.stock * Math.min(...o.map(s => prixDe(p, s) / s));
    comptes++;
  });
  return { v, comptes, ignores };
}
function bilanInvestissement(C) {
  const somme = (l, f) => l.reduce((t, x) => t + (f(x) || 0), 0);
  const lots = Array.isArray(C.lots) ? C.lots : [];
  const unites = Object.values(C.parfums || {}).filter(c => c && c.achat > 0);
  const investi = somme(lots, L => L.montant) + somme(unites, c => c.achat);
  const encaisse = somme(S.ventes, v => v.prix);
  return { investi, encaisse, resultat: encaisse - investi, part: investi > 0 ? Math.min(1, encaisse / investi) : 0, nbLots: lots.length, nbUnites: unites.length };
}

    ${st.comptes ? `<p class="aide">Ton stock restant vaut au moins <b>${eur(Math.round(st.v))}</b> au prix de la carte (calculé au prix des plus grands formats). S'il part en entier : <b class="${projete >= 0 ? 'pos' : 'neg'}">${projete >= 0 ? 'bénéfice estimé ' + eur(Math.round(projete)) : 'perte estimée ' + eur(Math.round(-projete))}</b>.${st.ignores ? ` ${st.ignores} ${st.ignores > 1 ? 'références sans stock suivi ou sans prix ne sont' : 'référence sans stock suivi ou sans prix n\'est'} pas comptée${st.ignores > 1 ? 's' : ''}.` : ''}</p>` : ''}
  </div>`;
}

/* lit le formulaire d'achat ; renvoie { lot } ou { erreur } */
function lireLot() {
  const v = id => document.getElementById(id).value.trim();
  const montant = nombre(v('l-montant'));
  const parfums = [];
  let invalide = '';
  document.querySelectorAll('#lot-form .lot-ligne').forEach(l => {
    if (!l.querySelector('.l-coche').checked) return;
    const p = trouver(l.dataset.id); if (!p) return;
    const brut = l.querySelector('.l-ml').value.trim();
    const n = brut === '' ? (estMini(p) ? 1 : 100) : nombre(brut);
    if (!(n > 0) || (estMini(p) && !Number.isInteger(n))) { invalide = p.nom; return; }
    parfums.push({ id: p.id, ml: arrondi(estMini(p) ? n * p.contenance : n) });
  });
  if (invalide) return { erreur: `Vérifie la quantité de ${invalide}.` };
  if (!(montant > 0)) return { erreur: 'Indique le montant total payé, par exemple 900.' };
  return { lot: { nom: v('l-nom').slice(0, 80), date: /^\d{4}-\d{2}-\d{2}$/.test(v('l-date')) ? v('l-date') : aujourdhui(), montant: arrondi(montant), repartition: v('l-rep') === 'volume' ? 'volume' : 'prix', parfums } };
}
/* aperçu en direct du coût de chaque parfum coché */

  const f = document.getElementById('lot-form');
  if (!f) return;
  const r = lireLot();
  const rep = r.lot ? repartirLot(r.lot) : {};
  f.querySelectorAll('.lot-ligne').forEach(l => {

    const c = l.querySelector('.l-coche').checked;
    l.classList.toggle('pris', c);

  });
}
function rendreCouts() {

/* API GitHub : les erreurs remontent sous la forme { statut, limite } */
async function gh(methode, chemin, corps, accept) {
  let r;
  try {
    r = await fetch(GH_API + chemin, {
      method: methode, cache: 'no-store',
      headers: Object.assign({ Accept: accept || 'application/vnd.github+json', Authorization: 'Bearer ' + S.gh.jeton }, corps ? { 'Content-Type': 'application/json' } : {}),
      body: corps ? JSON.stringify(corps) : undefined
    });
  } catch (e) { throw { statut: 0 }; }
  if (!r.ok) throw { statut: r.status, limite: r.headers.get('x-ratelimit-remaining') === '0' };
  return accept ? r.text() : r.json().catch(() => null);
}
const enc = encodeURIComponent;
const cheminDepot = depot => `/repos/${enc(S.gh.proprio)}/${enc(depot)}`;
const cheminFichier = (depot, f) => cheminDepot(depot) + '/contents/' + f.split('/').map(enc).join('/');
async function lireFichier(depot, f, sansTexte) {
  let d;
  try { d = await gh('GET', cheminFichier(depot, f)); }
  catch (e) { if (e.statut === 404) return null; throw e; }
  if (!d || Array.isArray(d) || !d.sha) throw { statut: -1 };
  if (sansTexte) return { sha: d.sha, texte: null };
  /* au-delà de 1 Mo, l'API ne renvoie pas le contenu : on le demande brut */
  const texte = d.encoding === 'base64' && d.content ? b64Texte(d.content) : await gh('GET', cheminFichier(depot, f), null, 'application/vnd.github.raw+json');
  return { sha: d.sha, texte };
}
async function ecrireFichier(depot, f, contenuB64, sha, message) {
  const d = await gh('PUT', cheminFichier(depot, f), Object.assign({ message, content: contenuB64 }, sha ? { sha } : {}));
  if (!d || !d.content || !d.content.sha) throw { statut: -1 };
  return d.content.sha;
}
async function supprimerFichier(depot, f, sha, message) { await gh('DELETE', cheminFichier(depot, f), { message, sha }); }
function messageGh(e, depot) {
  const s = e && e.statut;
  if (s === 0) return 'Pas de connexion à GitHub. Vérifie ton réseau, puis réessaie.';
  if (s === 401) return "Ton jeton GitHub n'est plus valide (expiré ou supprimé). Crée-en un nouveau sur GitHub, puis reconnecte-toi avec « Nouveau jeton ».";
  if (s === 403 && e.limite) return 'GitHub limite les requêtes pour le moment. Réessaie dans quelques minutes.';
  if (s === 403) return `Ton jeton n'a pas le droit de modifier ${depot || 'ce dépôt'}. Dans ses réglages GitHub, coche ce dépôt et mets « Contents » sur « Read and write ».`;
  if (s === 404) return `Le dépôt ${depot || ''} est introuvable avec ce jeton. Vérifie qu'il existe et qu'il est coché dans le jeton.`;
  if (s === 409 || s === 422) return 'Tes données ont été modifiées entre-temps, depuis un autre appareil ou un autre onglet. Recharge la page, puis refais ta dernière action.';
  return "GitHub n'a pas répondu comme prévu. Réessaie dans un instant.";
}
function messageDb() {
  if (S.hote !== 'gh') return "Le journal des ventes n'est pas accessible depuis cette vue. Ouvre la carte depuis ton compte Claude pour le consulter.";
  const p = S.gh ? S.gh.prive : 'blackphantom-gestion';
  if (S.dbEtat === 'sans-depot') return `Tes ventes et tes coûts sont enregistrés dans ton dépôt privé « ${p} », introuvable avec ton jeton. Crée-le sur GitHub en « Private », coche-le dans les réglages de ton jeton (Repository access), puis recharge la page.`;
  if (S.dbEtat === 'public') return `Le dépôt « ${p} » est public : tout le monde pourrait y lire tes ventes. Rends-le privé sur GitHub (Settings, puis Change visibility), puis recharge la page.`;
  return S.dbErreur || "Tes ventes n'ont pas pu être chargées. Recharge la page.";
}

/* retrouve le jeton dans le texte collé, même entouré d'autres caractères ou avec une majuscule ajoutée au début */
function extraireJeton(t) {
  const m = String(t || '').match(/(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})/i);
  if (!m) return '';
  return m[1].replace(/^github_pat_/i, 'github_pat_').replace(/^gh([pousr])_/i, (x, c) => 'gh' + c.toLowerCase() + '_');
}
async function verifierJeton(jeton, conf) {
  const avant = S.gh;
  S.gh = Object.assign({ jeton }, conf);
  try {
    try { await gh('GET', '/user'); }
    catch (e) { if (e.statut === 401) throw { texte: "Ce jeton n'est pas valide. Recopie-le en entier depuis GitHub (il commence par github_pat_)." }; throw e; }
    try { await gh('GET', cheminDepot(conf.depot)); }
    catch (e) { if (e.statut === 404) throw { texte: `Le dépôt ${conf.proprio}/${conf.depot} est introuvable. Vérifie les noms dans « Dépôts GitHub ».` }; throw e; }
    /* .nojekyll accélère la mise en ligne, et sa création vérifie que le jeton peut écrire */
    if (!(await lireFichier(conf.depot, '.nojekyll', true))) {
      try { await ecrireFichier(conf.depot, '.nojekyll', texteB64('\n'), null, 'Réglage du site'); }
      catch (e) { if (e.statut === 403 || e.statut === 404) throw { texte: `Ce jeton ne peut pas modifier ${conf.depot}. Dans ses réglages GitHub, coche ce dépôt et mets « Contents » sur « Read and write ».` }; throw e; }
    }
  } finally { S.gh = avant; }
}

  const partout = document.getElementById('gh-partout').checked;
  const min = partout ? MDP_MIN_SITE : 8;

  if (mdp !== document.getElementById('gh-mdp2').value) { err.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }

  occupe(true, 'Vérification…');

async function chargerGh() {
  const g = S.gh;
  S.ghEtat = 'charge'; S.dbEtat = 'charge';
  /* la carte publiée, lue sur GitHub plutôt que dans la page (qui peut venir du cache) */
  try {
    const f = await lireFichier(g.depot, 'index.html');
    if (S.gh !== g) return;
    if (!f) throw { statut: 404 };
    const doc = new DOMParser().parseFromString(f.texte, 'text/html');
    const data = doc.getElementById('bp-data'), code = doc.getElementById('bp-code');
    if (!data || !code) throw { texte: "Le fichier index.html de ton site n'est pas une carte BlackPhantom. Remets en ligne le fichier que je t'ai donné." };
    S.gh.shaIndex = f.sha;
    if (code.textContent !== document.getElementById('bp-code').textContent) S.ghEtat = 'ancien';
    else {
      ST = normaliser(JSON.parse(data.textContent));
      BASE = JSON.stringify(ST);

        if (S.gh !== g) return;
        if (ok) delete g.acces;
      }
      S.ghEtat = 'pret';
    }
  } catch (e) {
    if (S.gh !== g) return;
    S.ghEtat = 'erreur';
    S.ghErreur = e.texte || messageGh(e, g.depot);
  }
  rendre();
  if (S.ghEtat !== 'pret') return;
  /* ventes et coûts, dans le dépôt privé */
  try {
    const r = await gh('GET', cheminDepot(g.prive));
    if (S.gh !== g) return;
    if (!r || r.private !== true) { S.dbEtat = 'public'; }
    else {
      const [v, c] = await Promise.all([lireFichier(g.prive, 'ventes.json'), lireFichier(g.prive, 'couts.json')]);
      if (S.gh !== g) return;
      const lv = v ? JSON.parse(v.texte || '[]') : [];
      const lc = c ? JSON.parse(c.texte || '{}') : {};
      S.gh.shaVentes = v ? v.sha : null;
      S.gh.shaCouts = c ? c.sha : null;
      S.ventes = Array.isArray(lv) ? lv.filter(x => x && x.id) : [];
      trierVentes();
      S.couts = Object.assign({ fiole: null, parfums: {} }, lc && typeof lc === 'object' ? lc : {});
      S.db = 'gh'; S.dbEtat = 'pret';
    }
  } catch (e) {
    if (S.gh !== g) return;
    S.dbEtat = e && e.statut === 404 ? 'sans-depot' : 'erreur';
    S.dbErreur = e instanceof SyntaxError ? 'Le fichier de tes ventes est illisible. Dis-le-moi dans la conversation, je le répare.' : messageGh(e, g.prive);
  }
  majPanneauDb();
}

    await publier(`Vente supprimée. ${qteVente(v)} ${venteEntiere(v) && v.qte > 1 ? 'remises' : venteEntiere(v) ? 'remise' : 'remis'} en stock.`);
  } else toast('Vente supprimée.');
  rendreVentesDyn();
}

/* ---------- événements ---------- */
function majBoutonsFiltres() {
  document.querySelectorAll('[data-act="filtre"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.filtre)));
  document.querySelectorAll('[data-act="famille"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.famille)));
}
const actions = {
  filtre: el => { S.filtre = S.filtre === el.dataset.f ? 'tous' : el.dataset.f; majBoutonsFiltres(); rendreGrille(); },
  famille: el => { S.famille = S.famille === el.dataset.f ? 'toutes' : el.dataset.f; majBoutonsFiltres(); rendreGrille(); },
  demander: () => { copier("Salut ! Est-ce que tu pourrais proposer ce parfum en décant : ").then(ok => { if (ok) toast('Message copié : colle-le et ajoute le nom du parfum.'); }); },
  ecrire: () => {},
  effacer: () => { S.q = ''; S.filtre = 'tous'; S.famille = 'toutes'; const q = document.getElementById('q'); if (q) q.value = ''; majBoutonsFiltres(); rendreGrille(); },
  'tout-voir': () => actions.effacer(),
  aller: el => {
    const id = el.dataset.cible;
    let c = document.getElementById(id);
    /* une maison masquée par un filtre : on retire les filtres pour l'afficher */
    if (!c && /^m-/.test(id) && (S.q.trim() || S.filtre !== 'tous' || S.famille !== 'toutes')) { actions.effacer(); c = document.getElementById(id); }
    if (!c) return;
    const menu = el.classList.contains('menu-lien');
    if (menu) { S.verrou = { id, y: -1 }; marquerMenu(id); } else S.verrou = null;
    defiler(c, () => { if (menu && S.verrou && S.verrou.id === id) S.verrou.y = scrollY; });
  },
  haut: () => { S.verrou = null; defiler(null); },
  fiche: el => ficheEnZoom(el, el.dataset.id),
  taille: el => {
    const p = trouver(el.dataset.id); if (!p) return;
    const s = Number(el.dataset.s);
    if (!dispo(p, s)) { toast(`${p.nom}, ${libTaille(p, s)} : plus disponible.`); return; }
    S.choix[p.id] = s;
    document.querySelectorAll('#achat .choix-taille').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === el.dataset.s)));
    document.querySelectorAll('#dlg .trio-f').forEach(f => f.classList.toggle('choisi', f.dataset.s === el.dataset.s));
  },
  ajouter: el => {
    const p = trouver(el.dataset.id); if (!p) return;
    const s = choixDe(p);
    if (s == null || !dispo(p, s)) { toast('Cette taille n\'est plus disponible.'); rafraichirAchat(); return; }
    const k = p.id + '|' + s;
    const depart = el.getBoundingClientRect();
    S.panier[k] = (S.panier[k] || 0) + 1;
    rendreBarre(); rafraichirAchat();
    envolSelection(depart, s);
    toast(`${p.nom}, ${libTaille(p, s)}, ajouté à ton panier.`);
  },
  acheter: el => {
    const p = el.dataset.o === 'produit' ? trouver(el.dataset.id) : null;
    const question = p && !tailles(p).length;
    const texte = el.dataset.o === 'panier' ? messageSelection() : el.dataset.o === 'coffret' ? messageCoffret() : messageProduit(p);
    copier(texte).then(ok => toast(ok ? (question ? 'Message copié : colle-le dans la conversation.' : 'Commande copiée : colle-la dans la conversation.') : 'La copie a échoué : recopie le message de ta commande.'));
  },
  panier: () => ouvrirPanier(),
  'vider-selection': () => { S.panier = {}; rendreBarre(); fermer(); rafraichirAchat(); toast('Ton panier est vide.'); },
  plus: el => { const [id, s] = el.dataset.k.split('|'); const p = trouver(id); if (p && dispo(p, Number(s))) S.panier[el.dataset.k]++; remplirPanier(); rendreBarre(); },
  moins: el => { const k = el.dataset.k; if (--S.panier[k] <= 0) delete S.panier[k]; rendreBarre(); remplirPanier(); },
  copier: el => {
    copier(messageSelection()).then(ok => {
      el.textContent = ok ? 'Copié' : 'Message sélectionné, copie-le';
      setTimeout(() => { if (el.isConnected) el.textContent = 'Copier ma commande'; }, 2600);
    });
  },
  fermer: () => fermer(),
  onglet: el => { S.onglet = el.dataset.o; ecrire(CLE_ONGLET, S.onglet); S.confirmVente = null; S.prixManuel = false; S.lotEdit = null; S.lotSuppr = null; S.flAjout = null; rendre(); window.scrollTo(0, 0); },
  publier: async () => {
    const ok = await publier('Carte publiée.');
    /* les boutons « Vendu » et les pastilles suivent les nouveaux prix et stocks */
    if (ok && S.hote === 'gh' && S.onglet === 'stock') { const y = scrollY; rendre(); scrollTo(0, y); }
    if (S.onglet === 'accueil') rendreAccueil();
  },
  'annuler-modifs': () => { ST = normaliser(JSON.parse(BASE)); S.modifs = 0; rendre(); toast('Modifications annulées.'); },
  photo: el => ouvrirPhoto(el.dataset.id),
  'photo-ok': el => { const p = trouver(el.dataset.id); if (!p || !S.photoTemp) return; p.photo = S.photoTemp; S.photoTemp = null; fermer(); modifie(); rendre(); toast('Photo ajoutée. Publie pour la montrer à tes clients.'); },
  'photo-retirer': el => { const p = trouver(el.dataset.id); if (!p) return; p.photo = ''; fermer(); modifie(); rendre(); },
  editer: el => ouvrirEditeur(el.dataset.id),
  nouveau: () => ouvrirEditeur(null),
  'editer-ok': () => enregistrerEditeur(),
  'suppr-parfum': () => {
    const z = document.getElementById('e-actions');
    z.innerHTML = `<span class="err" style="margin-right:.4rem">Supprimer ce parfum de la carte ?</span><button type="button" class="btn danger" data-act="suppr-parfum-ok">Oui, supprimer</button><button type="button" class="btn discret" data-act="fermer">Non</button>`;
  },
  'suppr-parfum-ok': () => {
    const id = document.getElementById('edit').dataset.id;
    ST.parfums = ST.parfums.filter(p => p.id !== id);
    fermer(); modifie(); rendre(); toast('Parfum retiré. Publie pour mettre la carte à jour.');
  },
  reglages: () => ouvrirReglages(),
  vitrine: () => telechargerVitrine(),
  'reglages-ok': () => {
    const v = id => document.getElementById(id).value.trim();
    const n = id => { const x = nombre(v(id)); return x > 0 ? x : 0; };
    Object.assign(ST.boutique, {
      nom: v('r-nom') || 'BlackPhantom', titre: v('r-titre'), accroche: v('r-accroche'),
      snapchat: v('r-snap').replace(/^@/, ''), instagram: v('r-insta').replace(/^@/, ''),
      lieuRemise: v('r-lieu'), zoneLivraison: v('r-zone'), livraisonMin: n('r-min'), livraisonNb: Math.floor(n('r-nb')), note: v('r-note'), coffretPrix: arrondi(n('r-coffret')), google: document.getElementById('r-google').checked
    });
    ST.boutique.bientot = document.getElementById('r-bientot').value.split('\n').map(x => x.trim()).filter(Boolean);
    ST.boutique.avis = document.getElementById('r-avis').value.split('\n').map(x => x.trim()).filter(Boolean).map(l => { const i = l.lastIndexOf('|'); return i > 0 ? { t: l.slice(0, i).trim(), n: l.slice(i + 1).trim() } : { t: l, n: '' }; });
    document.querySelectorAll('textarea[data-maison]').forEach(t => { const m = t.dataset.maison; const x = t.value.trim(); if (x) ST.maisons[m] = x; else delete ST.maisons[m]; });
    fermer(); modifie(); rendre();
  },
  vendre: () => enregistrerVente(),
  deduire: async () => { await deduireEnAttente(); if (S.onglet === 'accueil') rendreAccueil(); },
  'suppr-vente': el => { S.confirmVente = el.dataset.id; rendreVentesDyn(); },
  'suppr-vente-non': () => { S.confirmVente = null; rendreVentesDyn(); },
  'suppr-vente-ok': el => supprimerVente(el.dataset.id),
  'couts-ok': () => enregistrerCouts(),
  'fl-ok': () => enregistrerFioles(),
  'fl-ajout': () => { S.flAjout = { ml: ST.tailles[0] }; rendreFlacons(); const n = document.getElementById('fa-n'); const z = document.getElementById('fl-ajout'); if (z) defiler(z); if (n) n.focus({ preventScroll: true }); },
  'fa-annuler': () => { S.flAjout = null; rendreFlacons(); },
  'fa-ok': () => ajouterFioles(),
  'lot-nouveau': () => { S.lotEdit = { i: -1 }; S.lotSuppr = null; rendreCouts(); const f = document.getElementById('lot-form'); if (f) { defiler(f); const n = document.getElementById('l-nom'); if (n) n.focus({ preventScroll: true }); } },
  'lot-editer': el => { S.lotEdit = { i: Number(el.dataset.i) }; S.lotSuppr = null; rendreCouts(); const f = document.getElementById('lot-form'); if (f) defiler(f); },
  'lot-annuler': () => { S.lotEdit = null; rendreCouts(); },
  'lot-ok': () => validerLot(),
  'lot-suppr': el => { S.lotSuppr = Number(el.dataset.i); rendreCouts(); },
  'lot-suppr-non': () => { S.lotSuppr = null; rendreCouts(); },
  'lot-suppr-ok': el => { const i = Number(el.dataset.i); const lots = lotsCouts().filter((_, k) => k !== i); enregistrerLots(lots, 'Achat supprimé.'); },
  quiz: () => ouvrirQuiz(),
  partager: el => {
    const p = trouver(el.dataset.id); if (!p) return;
    const url = lienParfum(p), titre = `${p.nom}, ${p.maison}`;
    if (navigator.share) { navigator.share({ title: titre, text: `${p.nom} (${p.maison}) ${estMini(p) ? (estFlacon(p) ? 'en flacon neuf' : "en miniature d'origine") : 'en décant'} chez ${ST.boutique.nom}`, url }).catch(() => {}); return; }
    copier(url).then(ok => toast(ok ? 'Lien copié : colle-le où tu veux.' : url));
  },
  prevenir: el => {
    const p = trouver(el.dataset.id); if (!p) return;
    const quoi = (estMini(p) ? (estFlacon(p) ? 'le flacon neuf ' : 'la miniature ') : '') + `${p.nom} (${p.maison})`;
    const t = etat(p) === 'bientot' ? `Salut ! Tu peux me prévenir quand ${quoi} arrive à la carte ?` : `Salut ! Tu peux me prévenir quand ${quoi} revient en stock ?`;
    copier(t).then(ok => toast(ok ? 'Message copié : colle-le dans la conversation.' : 'La copie a échoué : écris-moi directement.'));
  },
  coffret: () => ouvrirCoffret(),
  'coffret-choix': el => {
    const id = el.dataset.id, i = S.coffret.indexOf(id);
    if (i >= 0) S.coffret.splice(i, 1); else if (S.coffret.length < COFFRET_NB) S.coffret.push(id);
    const y = document.querySelector('#dlg .fen').scrollTop;
    remplirCoffret();
    document.querySelector('#dlg .fen').scrollTop = y;
  },
  'cmd-lire': () => apercuCommande(),
  'cmd-ok': () => validerCommande(),
  export: () => exporterVentes(),
  'vente-ouvrir': el => ouvrirVente('choix', el.dataset.id),
  'vente-coller': () => ouvrirVente('coller'),
  'groupe-ouvrir': () => ouvrirVente('groupe'),
  'vs-ajouter': () => ajouterAuGroupe(),
  'vs-prix-carte': () => { S.prixManuel = false; majPrixVente(); const c = document.getElementById('v-prix'); if (c) c.focus(); },
  'vs-tout': () => enregistrerGroupe(),
  'vs-groupe': () => { if (!S.vs) return; S.vs.etape = 'groupe'; rendreVente(); },
  'vs-retirer': el => { const G = groupe(); const i = Number(el.dataset.i); if (!(i >= 0 && i < G.length)) return; G.splice(i, 1); sauverGroupe(); if (S.vs) rendreVente(); },
  'vs-mode': el => { if (!S.vs) return; S.vs.etape = el.dataset.m === 'coller' ? 'coller' : S.vs.id ? 'details' : 'parfum'; rendreVente(); },
  'vs-choisir': el => { const p = trouver(el.dataset.id); if (!p || !S.vs) return; Object.assign(S.vs, { id: p.id, taille: tailleParDefaut(p), etape: 'details' }); S.prixManuel = false; rendreVente(); },
  'vs-retour': () => { if (!S.vs) return; S.vs.etape = 'parfum'; rendreVente(); const f = document.querySelector('#dlg .fen'); if (f) f.scrollTop = 0; },
  'vs-taille': el => { if (!S.vs) return; S.vs.taille = Number(el.dataset.s); S.prixManuel = false; document.querySelectorAll('#dlg .vs-taille').forEach(b => b.setAttribute('aria-pressed', String(b === el))); majPrixVente(); },
  'vs-plus': () => { const i = document.getElementById('v-qte'); i.value = Math.max(1, Math.floor(nombre(i.value) || 1)) + 1; S.prixManuel = false; majPrixVente(); },
  'vs-moins': () => { const i = document.getElementById('v-qte'); i.value = Math.max(1, Math.floor(nombre(i.value) || 1) - 1); S.prixManuel = false; majPrixVente(); },
  'filtre-stock': el => { S.filtreStock = el.dataset.f; rendreListeStock(); },
  'aller-vendeur': el => allerVendeur(el.dataset.o, el.dataset.f),
  'partager-carte': () => {
    const url = (adresseSite() || location.origin) + '/';
    if (navigator.share) { navigator.share({ title: ST.boutique.nom, text: ST.boutique.titre || ST.boutique.nom, url }).catch(() => {}); return; }
    copier(url).then(ok => toast(ok ? 'Lien de ta carte copié : colle-le où tu veux.' : url));
  },
  lien: el => { const p = trouver(el.dataset.id); if (!p) return; copier(lienParfum(p)).then(ok => toast(ok ? `Lien de ${p.nom} copié : colle-le dans ta story ou en message.` : lienParfum(p))); },
  'sv-bascule': el => {
    const p = trouver(el.dataset.id); if (!p) return;
    const k = el.dataset.k, v = el.dataset.v, l = p[k] || (p[k] = []);
    const i = l.indexOf(v);
    if (i >= 0) l.splice(i, 1); else l.push(v);
    const ordre = (k === 'saisons' ? SAISONS : MOMENTS).map(x => x[0]);
    l.sort((a, b) => ordre.indexOf(a) - ordre.indexOf(b));
    el.setAttribute('aria-pressed', String(i < 0));
    modifie();
  },
  'sv-ok': el => { const p = trouver(el.dataset.id); if (!p) return; p.saisonsVerifiees = true; S.svOuvert = true; modifie(); rendre(); toast(`Saisons de ${p.nom} validées. Publie pour mettre la carte à jour.`); },
  'quiz-rep': el => { if (!S.quiz) return; S.quiz.r[QUIZ[S.quiz.etape].cle] = el.dataset.v; S.quiz.etape++; rendreQuiz(); },
  'quiz-retour': () => { if (!S.quiz || !S.quiz.etape) return; S.quiz.etape--; rendreQuiz(); },
  'quiz-refaire': () => { S.quiz = { etape: 0, r: {} }; rendreQuiz(); },
  'vendeur-entree': () => ouvrirConnexion(false),
  'gh-nouveau': () => ouvrirConnexion(true),
  'gh-faceid': el => entrerFaceId(el),
  'faceid-activer': el => activerFaceId(el),
  'faceid-retirer': () => retirerFaceId(),
  'faceid-confirmer': el => confirmerFaceId(el),
  'gh-voir': el => { const i = document.getElementById('gh-jeton'); if (!i) return; const cache = i.classList.toggle('masque'); el.textContent = cache ? 'Afficher' : 'Masquer'; },
  deconnexion: () => quitterVendeur(),
  'gh-reessayer': () => { rendre(); chargerGh(); },
  'gh-changer': () => { S.modifs = 0; quitterVendeur(); ouvrirConnexion(true); },
  'gh-recharger': () => { location.replace(location.pathname + '?v=' + Date.now() + '#vendeur'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { const f = actions[el.dataset.act]; if (f) { if (el.tagName !== 'A') e.preventDefault(); f(el, e); } return; }
  const d = document.getElementById('dlg');
  if (d && e.target === d && d.classList.contains('leger')) fermer();
});
/* le doigt place le curseur après le focus : on sélectionne tout au focus, puis encore juste après le toucher */
function toutSelectionner(t) {
  if (document.activeElement !== t) return;
  try { t.setSelectionRange(0, t.value.length); } catch (er) { try { t.select(); } catch (er2) {} }
}
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!t || t.id !== 'v-prix') return;
  t.dataset.toutSel = '1';
  setTimeout(() => toutSelectionner(t), 0);
  setTimeout(() => { delete t.dataset.toutSel; }, 600);
});
document.addEventListener('click', e => {
  const t = e.target;
  if (t && t.id === 'v-prix' && t.dataset.toutSel) { delete t.dataset.toutSel; setTimeout(() => toutSelectionner(t), 0); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; rendreGrille(); versResultats(); return; }
  if (t.id === 'st-q') { S.qStock = t.value; rendreListeStock(); return; }
  if (t.id === 'vs-q' && S.vs) { S.vs.q = t.value; const g = document.getElementById('vs-grille'); if (g) g.innerHTML = typo(grilleVente()); return; }
  if (t.id === 'v-qte') { majPrixVente(); return; }
  if (t.id === 'cmd-texte') { clearTimeout(S.cmdMinuteur); S.cmdMinuteur = setTimeout(() => apercuCommande(true), 350); return; }
  if (t.id === 'v-prix') { S.prixManuel = true; majPrixVente(); return; }
  if (t.closest && t.closest('#lot-form')) { majApercuLot(); return; }
  if (t.closest && t.closest('#couts-zone')) { S.coutsEdites = true; majCalculsCouts(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && t.closest('.ligne-stock')) { champStock(t); return; }
  if (t.classList && t.classList.contains('fl-carte-c')) { basculerFormat(t); return; }
  if (t.id === 'fa-taille') {
    const autre = t.value === 'autre';
    if (S.flAjout) S.flAjout.ml = autre ? 'autre' : Number(t.value);
    document.getElementById('fa-autre-z').hidden = !autre;
    document.getElementById('fa-carte-z').hidden = !autre;
    return;
  }
  if (t.id === 'ph-fichier' && t.files && t.files[0]) recevoirImage(t.files[0]);
  if (t.name === 'mode') { S.mode = t.value; sauverSelection(); const m = document.getElementById('msg'); if (m) m.textContent = document.querySelector('#dlg.coffret-dlg') ? messageCoffret() : messageSelection(); }
});
document.addEventListener('toggle', e => {
  if (e.target && e.target.classList && e.target.classList.contains('saisons-verif')) S.svOuvert = e.target.open;
  if (e.target && e.target.classList && e.target.classList.contains('flacons')) S.flFerme = !e.target.open;
  if (e.target && e.target.classList && e.target.classList.contains('couts-parfums')) S.cpOuvert = e.target.open;
  if (e.target && e.target.classList && e.target.classList.contains('ligne-stock')) { const id = e.target.dataset.id; if (e.target.open) S.ouverts.add(id); else S.ouverts.delete(id); }
}, true);
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'gh-form') { e.preventDefault(); validerConnexion(); }
});
window.addEventListener('beforeunload', e => {
  if (S.hote === 'gh' && (S.modifs || S.publication)) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('paste', e => {
  if (!document.getElementById('ph-fichier')) return;
  const f = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.kind === 'file' && /^image\//.test(i.type));
  if (f) { e.preventDefault(); recevoirImage(f.getAsFile()); }
});

/* ---------- démarrage ---------- */
function demarrer(donnees) {
  installerDegrades();
  const d = donnees || {};
  if (d.panier && typeof d.panier === 'object') S.panier = d.panier;
  else chargerSelection();
  if (typeof d.q === 'string') S.q = d.q;
  if (typeof d.filtre === 'string') S.filtre = d.filtre;
  let apres = null;
  try { apres = JSON.parse(sessionStorage.getItem('bp-apres') || 'null'); sessionStorage.removeItem('bp-apres'); } catch (e) {}
  if (apres && apres.onglet) S.ongletApres = apres.onglet;
  rendre();
  if (apres && apres.msg) toast(apres.msg);
  if (surClaude()) { initVendeur(); return; }
  /* site hébergé : l'adresse …/#vendeur ouvre directement la connexion */
  if (/[?&]v=\d+/.test(location.search)) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  const porte = () => {
    if (location.hash === '#vendeur') { if (!S.vendeur) ouvrirConnexion(false); return; }
    const p = trouver(decodeURIComponent(location.hash.slice(1)));
    if (p && p.visible && !(document.getElementById('dlg') && document.getElementById('dlg').open)) ouvrirFiche(p.id);
  };
  window.addEventListener('hashchange', porte);
  porte();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ panier: S.panier, q: S.q, filtre: S.filtre })); } catch (e) {} }
if (hot && typeof hot.ready === 'function') hot.ready(demarrer); else demarrer(hot && hot.data);
})();
